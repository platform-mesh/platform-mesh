version: '3'

includes:
  # Shared go-installable tooling (golangci-lint), installed once into the
  # root bin/ and reused by every component.
  tools:
    taskfile: ../../tools/Taskfile.yaml
    dir: .

tasks:
  generate:
    desc: Nothing is generated in this module.
    cmds: []
  fmt:
    cmds:
      - go fmt ./...
  lint:
    cmds:
      - task: fmt
      - task: tools:lint
  build:
    cmds:
      - go build ./...
  test:
    cmds:
      - go test ./... {{.ADDITIONAL_COMMAND_ARGS}}
