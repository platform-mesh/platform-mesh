# kind cluster for the end-to-end flow (hack/e2e/kind.sh), the cluster
# installation/README.md describes: Traefik's NodePort 31000 is published as
# https://portal.localhost:8443. The plain-HTTP registry is configured per
# node after creation (hosts.toml), since its address is only known at runtime.
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
networking:
  apiServerAddress: "127.0.0.1"
  kubeProxyMode: iptables
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 31000
        hostPort: 8443
        protocol: TCP
        listenAddress: "127.0.0.1"
