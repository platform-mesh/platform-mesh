# A navigation entry of the tenant's own, for the page of its account in the
# portal.
apiVersion: ui.platform-mesh.io/v1alpha1
kind: ContentConfiguration
metadata:
  name: upgrade-seed
  labels:
    ui.platform-mesh.io/entity: core_platform-mesh_io_account
spec:
  inlineConfiguration:
    contentType: json
    content: |-
      {
        "name": "upgrade-seed",
        "luigiConfigFragment": {
          "data": {
            "nodes": [
              {
                "entityType": "main.core_platform-mesh_io_account",
                "pathSegment": "upgrade-seed",
                "label": "Seeded by tests/upgrade",
                "icon": "lab",
                "order": 900,
                "url": "/assets/platform-mesh-portal-ui-wc.js#generic-detail-view",
                "webcomponent": {
                  "selfRegistered": true,
                  "type": "module"
                }
              }
            ]
          }
        }
      }
