# What the provider connection of the platform scenario is for, in the extra
# workspace: the Gadget API, and a binding of the workspace to its own
# export, so that Gadgets can be created in it.
apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1.gadgets.platform.upgrade.platform-mesh.io
spec:
  group: platform.upgrade.platform-mesh.io
  names:
    kind: Gadget
    listKind: GadgetList
    plural: gadgets
    singular: gadget
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        type: object
        required:
          - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              note:
                type: string
---
apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: platform.upgrade.platform-mesh.io
spec:
  resources:
    - group: platform.upgrade.platform-mesh.io
      name: gadgets
      schema: v1.gadgets.platform.upgrade.platform-mesh.io
      storage:
        crd: {}
---
apiVersion: apis.kcp.io/v1alpha2
kind: APIBinding
metadata:
  name: platform.upgrade.platform-mesh.io
spec:
  reference:
    export:
      name: platform.upgrade.platform-mesh.io
      path: root:providers:upgrade-platform
