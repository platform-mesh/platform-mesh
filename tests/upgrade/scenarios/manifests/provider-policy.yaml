# Who may bind the API of the provider, in root:orgs: the accounts of the
# organization of the consumer.
apiVersion: core.platform-mesh.io/v1alpha1
kind: APIExportPolicy
metadata:
  name: seed.upgrade.platform-mesh.io
spec:
  apiExportRef:
    name: seed.upgrade.platform-mesh.io
    clusterPath: root:providers:upgrade-seed
  allowPathExpressions:
    - :root:orgs:upgrade-consumer:*
