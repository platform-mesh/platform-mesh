# The integration tests (tests/integration, build tag `integration`) against a
# kcp in Docker, and the Playwright portal suite (tests/e2e/portal, included
# below as `portal-e2e:`). The Go code under tests/ belongs to the root module:
# `task test-root`, `lint-root`, `build-root`, ... cover its unit tests and lint.
# Included from the root Taskfile as `tests:`.
#
# The Playwright tasks keep the names they had in the helm-charts repository
# minus the `test:` prefix, e.g. `task tests:portal-e2e:httpbins`.

version: '3'

includes:
  # Playwright portal suite: `task tests:portal-e2e`, `tests:portal-e2e:httpbins`, ...
  portal-e2e:
    taskfile: e2e/portal/Taskfile.yaml
    dir: e2e/portal

vars:
  TOPLEVEL:
    sh: git rev-parse --show-toplevel
  # The repository's kcp version (third_party/kcp), also what Tilt deploys.
  KCP_VERSION:
    sh: "sed -n 's/^ *version: v\\([0-9][^ ]*\\)$/\\1/p' {{.TOPLEVEL}}/third_party/kcp/component-constructor.yaml | head -1"
  # The kcp image the framework runs; KCP_IMAGE=... overrides.
  KCP_IMAGE: '{{.KCP_IMAGE | default (printf "ghcr.io/kcp-dev/kcp:v%s" .KCP_VERSION)}}'
  # Narrow a run to one area, e.g. PKG=./integration/resourcebroker/...
  PKG: '{{.PKG | default "./integration/..."}}'
  # Test packages run in parallel; they share one kcp (see tests/README.md).
  P: '{{.P | default "2"}}'

tasks:
  integration:
    desc: 'Run tests/integration against kcp in Docker (PKG=./integration/<area>/... narrows, P= parallel packages, KCP_IMAGE= another kcp image, ADDITIONAL_COMMAND_ARGS= extra go test flags).'
    env:
      KCP_IMAGE: '{{.KCP_IMAGE}}'
    cmds:
      - go test -tags integration -count=1 -p {{.P}} -timeout 40m {{.PKG}} {{.ADDITIONAL_COMMAND_ARGS}}
