# The integration tests (tests/integration) against a kcp in Docker, the e2e
# tests (tests/e2e) against a deployed Platform Mesh, and the Playwright
# portal suite (tests/e2e/portal, included below as `portal-e2e:`). The Go
# code under tests/ belongs to the root module: `task test-root`, `lint-root`,
# `build-root`, ... cover its unit tests and lint; test-root leaves integration/
# and e2e/ out, they only run through the tasks here.
# Included from the root Taskfile as `tests:`.
#
# The Playwright tasks keep the names they had in the helm-charts repository
# minus the `test:` prefix, e.g. `task tests:portal-e2e:httpbins`.

version: '3'

includes:
  # Playwright portal suite: `task tests:portal-e2e`, `tests:portal-e2e:httpbins`, ...
  portal-e2e:
    taskfile: e2e/portal/Taskfile.yaml
    dir: e2e/portal

vars:
  TOPLEVEL:
    sh: git rev-parse --show-toplevel
  # The repository's kcp version (third_party/kcp, also what Tilt deploys),
  # the release the framework runs unless KCP_VERSION=... says otherwise.
  REPO_KCP_VERSION:
    sh: "sed -n 's/^ *version: v\\([0-9][^ ]*\\)$/\\1/p' {{.TOPLEVEL}}/third_party/kcp/component-constructor.yaml | head -1"
  # Narrow a run to one area, e.g. PKG=./integration/resourcebroker/...
  PKG: '{{.PKG | default "./integration/..."}}'
  # Test packages run in parallel; they share one kcp (see tests/README.md).
  P: '{{.P | default "2"}}'

tasks:
  integration:
    desc: 'Run tests/integration against kcp in Docker (PKG=./integration/<area>/... narrows, P= parallel packages, KCP_VERSION= another kcp release, ADDITIONAL_COMMAND_ARGS= extra go test flags).'
    env:
      # Read by tests/framework/kcp; with or without the leading v.
      KCP_VERSION: 'v{{.KCP_VERSION | default .REPO_KCP_VERSION | trimPrefix "v"}}'
    cmds:
      - go test -count=1 -p {{.P}} -timeout 40m {{.PKG}} {{.ADDITIONAL_COMMAND_ARGS}}
  # --- e2e: against a deployed Platform Mesh (KUBECONFIG, ADMIN_KUBECONFIG) --
  e2e:
    desc: 'Run tests/e2e Go suites against the cluster KUBECONFIG points at, then the portal suite (TEST_RUN_ID= for the sharded portal run).'
    vars:
      TEST_RUN_ID: '{{.TEST_RUN_ID | default (now | unixEpoch | printf "%.8s")}}'
    cmds:
      - go test -count=1 -timeout 60m ./e2e/... {{.ADDITIONAL_COMMAND_ARGS}}
      - task: portal-e2e:default
        vars: {TEST_RUN_ID: '{{.TEST_RUN_ID}}'}
  e2e:go:
    desc: 'Only the Go e2e suites (no Playwright).'
    cmds:
      - go test -count=1 -timeout 60m ./e2e/... {{.ADDITIONAL_COMMAND_ARGS}}
