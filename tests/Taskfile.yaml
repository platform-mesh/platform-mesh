# The tests module (go.platform-mesh.io/tests): integration tests against a
# kcp test server (tests/integration, build tag `integration`), e2e tests
# against a deployed Platform Mesh (tests/e2e, build tag `e2e`) and the
# Playwright portal suite (tests/e2e/portal, included below as `portal-e2e:`).
# Included from the root Taskfile as `tests:`.
#
# The Playwright tasks keep the names they had in the helm-charts repository
# minus the `test:` prefix, e.g. `task tests:portal-e2e:httpbins`.

version: '3'

includes:
  tools:
    taskfile: ../tools/Taskfile.yaml
    dir: ..
    internal: true
  # Playwright portal suite: `task tests:portal-e2e`, `tests:portal-e2e:httpbins`, ...
  portal-e2e:
    taskfile: e2e/portal/Taskfile.yaml
    dir: e2e/portal

vars:
  TOPLEVEL:
    sh: git rev-parse --show-toplevel
  BIN: '{{.TOPLEVEL}}/bin'
  TESTS_DIR: '{{.TOPLEVEL}}/tests'
  # Narrow a run to one area, e.g. PKG=./integration/resourcebroker/...
  PKG: '{{.PKG | default "./integration/..."}}'
  # Test packages run in parallel; each boots its own kcp test server.
  P: '{{.P | default "2"}}'

tasks:
  # --- Go: standard component targets (root `task <target>-tests`) ---------
  test:
    desc: Unit tests of the test framework itself (no kcp, no cluster).
    cmds:
      - go test -count=1 ./framework/...
  build:
    desc: Compile every test package, including the tagged ones.
    cmds:
      - go vet -tags integration,e2e ./...
  generate:
    desc: No code generation in the tests module.
    cmds:
      - 'echo "tests: nothing to generate"'
  lint:
    vars:
      GOLANGCI_LINT:
        sh: 'UGET_DIRECTORY={{.BIN}} UGET_CHECKSUMS={{.TOPLEVEL}}/hack/tools.checksums UGET_PRINT_PATH=absolute task --dir {{.TOPLEVEL}} tools:golangci-lint'
    cmds:
      - '{{.GOLANGCI_LINT}} run --config {{.TOPLEVEL}}/.golangci.yaml --build-tags integration,e2e --timeout 15m ./...'
  # --- integration: components in-process against a kcp test server --------
  integration:
    desc: 'Run tests/integration (PKG=./integration/<area>/... narrows, P= parallel packages, ADDITIONAL_COMMAND_ARGS= extra go test flags).'
    deps: [tools:kcp]
    env:
      # The framework resolves kcp, kcp-front-proxy, cache-server and
      # sharded-test-server from this directory (installed by tools:kcp).
      TEST_KCP_ASSETS: '{{.BIN}}'
      NO_GORUN: "true"
    cmds:
      # The framework's own server lifecycle tests need the kcp binaries too.
      - go test -count=1 -run 'TestStopLeavesNoProcesses|TestReapsOrphanedServer' ./framework/kcp/
      - go test -tags integration -count=1 -p {{.P}} -timeout 40m {{.PKG}} {{.ADDITIONAL_COMMAND_ARGS}}
  integration:shared:
    desc: 'Like integration, but one sharded kcp for the whole run (packages run sequentially and attach to it).'
    deps: [tools:kcp]
    env:
      TEST_KCP_ASSETS: '{{.BIN}}'
      NO_GORUN: "true"
      KCP_ASSET_KCP: '{{.BIN}}/kcp'
      KCP_ASSET_KCP_FRONT_PROXY: '{{.BIN}}/kcp-front-proxy'
      KCP_ASSET_CACHE_SERVER: '{{.BIN}}/cache-server'
      KCP_ASSET_SHARDED_TEST_SERVER: '{{.BIN}}/sharded-test-server'
    cmds:
      - |
        bash -euo pipefail <<'EOF'
        work="{{.TESTS_DIR}}/.test/shared-kcp"
        rm -rf "$work" && mkdir -p "$work"
        (cd "$work" && exec {{.BIN}}/sharded-test-server -number-of-shards 2 -work-dir-path "$work" -quiet >"$work/sharded-test-server.log" 2>&1) &
        pid=$!
        trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
        for _ in $(seq 1 180); do [ -f "$work/.kcp/ready-to-test" ] && break; kill -0 "$pid" || { echo "sharded-test-server exited, see $work/sharded-test-server.log" >&2; exit 1; }; sleep 1; done
        [ -f "$work/.kcp/ready-to-test" ] || { echo "sharded-test-server not ready, see $work/sharded-test-server.log" >&2; exit 1; }
        KCP_KUBECONFIG="$work/.kcp/admin.kubeconfig" go test -tags integration -count=1 -p 1 -timeout 40m {{.PKG}} {{.ADDITIONAL_COMMAND_ARGS}}
        EOF

  # --- e2e: against a deployed Platform Mesh (KUBECONFIG, ADMIN_KUBECONFIG) --
  e2e:
    desc: 'Run tests/e2e Go suites against the cluster KUBECONFIG points at, then the portal suite (TEST_RUN_ID= for the sharded portal run).'
    vars:
      TEST_RUN_ID: '{{.TEST_RUN_ID | default (now | unixEpoch | printf "%.8s")}}'
    cmds:
      - go test -tags e2e -count=1 -timeout 60m ./e2e/... {{.ADDITIONAL_COMMAND_ARGS}}
      - task: portal-e2e:default
        vars: {TEST_RUN_ID: '{{.TEST_RUN_ID}}'}
  e2e:go:
    desc: 'Only the Go e2e suites (no Playwright).'
    cmds:
      - go test -tags e2e -count=1 -timeout 60m ./e2e/... {{.ADDITIONAL_COMMAND_ARGS}}
  e2e:deployer:
    desc: 'Multi-cluster platform-mesh-deployer suite (tests/e2e/deployer): creates its own kind clusters via hack/kind.sh, local and nightly (e2e-deployer.yml). Needs docker, kubectl, helm; E2E_KEEP=1 keeps the clusters.'
    deps: [tools:kind]
    env:
      # hack/kind.sh and the suite's `kind load` use this binary.
      KIND: '{{.KIND}}'
      # The suite skips itself without this, so e2e:go against a Tilt cluster
      # does not also bring up the deployer's clusters.
      E2E_DEPLOYER: "true"
    cmds:
      - go test -tags e2e -count=1 -timeout 60m ./e2e/deployer/... {{.ADDITIONAL_COMMAND_ARGS}}
