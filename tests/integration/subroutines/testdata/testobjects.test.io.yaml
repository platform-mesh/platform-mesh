# TestObject is the minimal CRD the subroutines lifecycle test reconciles. Its
# schema mirrors the testObject Go type in lifecycle_test.go: a free-form spec
# and a status carrying conditions, observed generation and the spread
# next-reconcile time, served through the status subresource (the lifecycle
# patches status there).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: testobjects.test.io
spec:
  group: test.io
  scope: Namespaced
  names:
    kind: TestObject
    listKind: TestObjectList
    plural: testobjects
    singular: testobject
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              value:
                type: string
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
                  required:
                  - type
                  - status
              initializers:
                type: array
                items:
                  type: string
              terminators:
                type: array
                items:
                  type: string
              observedGeneration:
                type: integer
                format: int64
              nextReconcileTime:
                type: string
                format: date-time
                nullable: true
