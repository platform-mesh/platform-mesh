version: "3"

# Root Taskfile for the platform-mesh monorepo.
#
# Structure:
#   * Global targets (`lint`, `test`, `generate`, `build`) run the
#     matching target for EVERY component.
#   * Per-component targets (`lint-<name>`, `test-<name>`, ...) run it for ONE
#     component, e.g. `task lint-account-operator`.
#
# Every component (module/service) must expose the standard targets in its own
# Taskfile: lint, test, generate, build. The root simply fans out to them.
# Integration and e2e tests live under tests/ in the root module: `task
# test-integration` (components in-process against a kcp in Docker) and `task
# test-e2e` (against a deployed Platform Mesh); see tests/README.md.
#
# The components below are linked locally through the repository-root go.work
# file. Add a component by listing its name here; its directory is discovered
# under ./, ./operators/ or ./services/.

includes:
  # Shared go-installable tooling (controller-gen, golangci-lint, mockery,
  # apigen), installed once into the root bin/ and reused by every component.
  tools:
    taskfile: tools/Taskfile.yaml
    dir: .
  # Helm charts: `task charts:lint`, `task charts:test`, `task charts:docs`, ...
  charts:
    taskfile: charts/Taskfile.yaml
    dir: .
  # The integration tests: `task tests:integration` (kcp in Docker), `task
  # tests:e2e` (deployed stack) and the Playwright portal suite
  # (`task tests:portal-e2e:setup`, `task tests:portal-e2e:httpbins`, ...).
  tests:
    taskfile: tests/Taskfile.yaml
    dir: tests

vars:
  COMPONENTS:
    # the root module
    - root

    # shared
    - apis
    - subroutines
    - golang-commons

    # operators
    - account-operator
    - extension-manager-operator
    - kro-composition-operator
    - platform-mesh-operator
    - pm-keycloak-operator
    - pm-openfga-operator
    - provider-operator
    - resource-broker
    - terminal-controller-manager

    # services
    - iam-service
    - kubernetes-graphql-gateway
    - pm-openfga-authz-webhook
    - virtual-workspaces


  LIBRARIES:
    - apis
    - subroutines
    - golang-commons

  # Renovate CLI image. Cannot be placed in tools/ as vars from other
  # taskfile are not visible.
  RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.202.1

tasks:
  default:
    cmds:
      - task --list

  tilt:up:
    desc: Start the Tilt development environment on kind.
    preconditions:
      - sh: command -v helm
        msg: helm is not installed; the Tilt environment renders the charts with it.
    vars:
      KIND: { sh: 'env -u UGET_CHECKSUMS -u UGET_DIRECTORY UGET_PRINT_PATH=absolute task --dir {{.ROOT_DIR}} tools:kind' }
      TILT: { sh: 'env -u UGET_CHECKSUMS -u UGET_DIRECTORY UGET_PRINT_PATH=absolute task --dir {{.ROOT_DIR}} tools:tilt' }
    cmds:
      - KIND={{.KIND}} hack/kind.sh up
      - contrib/tilt/hack/print-urls.sh
      # Arguments after `--` go to the Tiltfile, e.g. task tilt:up -- --frontend-cors
      - "{{.TILT}} up -f ./contrib/tilt/Tiltfile -- {{.CLI_ARGS}}"

  tilt:ci:
    desc: Bring up the Tilt development environment and wait for readiness.
    preconditions:
      - sh: command -v helm
        msg: helm is not installed; the Tilt environment renders the charts with it.
    vars:
      KIND: { sh: 'env -u UGET_CHECKSUMS -u UGET_DIRECTORY UGET_PRINT_PATH=absolute task --dir {{.ROOT_DIR}} tools:kind' }
      TILT: { sh: 'env -u UGET_CHECKSUMS -u UGET_DIRECTORY UGET_PRINT_PATH=absolute task --dir {{.ROOT_DIR}} tools:tilt' }
    cmds:
      - KIND={{.KIND}} hack/kind.sh up
      - "{{.TILT}} ci -f ./contrib/tilt/Tiltfile {{.CLI_ARGS}}"

  tilt:help:
    desc: Print the Tilt options, URLs and the environment for running the portal locally.
    silent: true
    cmds:
      - |
        cat <<'EOF'
        Tilt development environment

          task tilt:up                         start kind and Tilt
          task tilt:up -- --frontend-cors      same, and allow browser calls from a frontend
                                               run outside the cluster (localhost, *.portal.localhost)
          task tilt:ci                         start and wait until everything is ready
          task tilt:up -- --without=keycloak   leave Keycloak (and iam-service, iam-ui, pm-keycloak-operator) out
          task tilt:up -- --without=openfga    leave OpenFGA (and pm-openfga-authz-webhook, pm-openfga-operator) out
          task tilt:e2e                        run the e2e suites (Go, then portal) against Tilt
          . contrib/tilt/env.sh                export the URLs and credentials for tests

        Logging in: create an organization with your e-mail as creator (the Invite puts
        you into the organization's Keycloak realm); there is no SMTP, so the password
        is "password" and must be changed at first login.

        Change options of a running Tilt without restarting it:

          tilt args -- --frontend-cors

        Tiltfile options (after `--`): --frontend-cors, --without, --context, --cluster-id, --httpbin-namespace
        EOF
      - contrib/tilt/hack/print-urls.sh
      - |
        echo "Running the portal outside the cluster: start Tilt with --frontend-cors, then"
        echo "use this environment (save it as .env, or source it):"
        echo
        contrib/tilt/hack/print-frontend-env.sh || echo "(not available until Tilt has deployed the portal)"

  tilt:e2e:
    desc: Run the e2e suites (tests/e2e Go, then the portal) against the Tilt environment.
    cmds:
      - |
        . contrib/tilt/env.sh || exit 1
        # tests/e2e reads the kind cluster from KUBECONFIG (context KIND_CONTEXT).
        export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
        task tests:e2e TEST_RUN_ID="$(date +%s)"

  # ---------------------------------------------------------------------------
  # Global fan-out targets: run the standard target across all components.
  # ---------------------------------------------------------------------------
  verify:
    desc: Runs all check targets in sequence.
    cmds:
      - task: dco
      - task: lint
      - task: boilerplate
      - task: tidy-check
  dco:
    desc: 'Every commit on this branch needs a Signed-off-by matching its author (BASE=<ref> to override the comparison point).'
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      - |
        base='{{.BASE}}'
        if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
          echo "dco: cannot resolve base ref '$base', skipping (set BASE=<ref> to pick another)" >&2
          exit 0
        fi
        # Mirrors the DCO app that gates pull requests: merge commits and bot
        # authors are exempt, and the sign-off email must match the author's.
        # The whole message is scanned, not just the trailer block -- a commit
        # may end with another paragraph (e.g. On-behalf-of:), which would hide
        # the sign-off from git's trailer parser but still satisfies the app.
        bad=$(git rev-list --no-merges "$base..HEAD" | while read -r sha; do
          author=$(git show -s --format='%ae' "$sha" | tr 'A-Z' 'a-z')
          case "$author" in *"[bot]"*) continue ;; esac
          git show -s --format='%B' "$sha" | grep -i '^signed-off-by:' \
            | tr 'A-Z' 'a-z' | grep -qF "<$author>" \
            || git show -s --format='  %h %s' "$sha"
        done)
        if [ -n "$bad" ]; then
          echo "Commits without a Signed-off-by matching the commit author:" >&2
          echo "$bad" >&2
          echo "Fix with: git rebase --signoff $base" >&2
          exit 1
        fi
  lint:
    desc: Lint every component.
    cmds:
      - for: {var: COMPONENTS}
        cmd: task lint-{{.ITEM}}
  tidy-check:
    desc: Each go.mod must be self-contained (tidy + deps resolve without go.work).
    cmds:
      - for: {var: COMPONENTS}
        cmd: task tidy-check-{{.ITEM}}
  boilerplate:
    desc: Verifies the boilerplate comment in each source file.
    cmds:
      - |
        # --skip args from hack/boilerplate/skip.txt, ignoring blank lines and '#' comment lines.
        skip_args=$(grep -vE '^[[:space:]]*(#|$)' hack/boilerplate/skip.txt | sed 's/^/--skip /' | tr '\n' ' ')
        ./hack/verify_boilerplate.py --boilerplate-dir hack/boilerplate/ $skip_args
  boilerplate-fix:
    desc: Prepends the boilerplate comment to source files that are missing it.
    cmds:
      - |
        # --skip args from hack/boilerplate/skip.txt, ignoring blank lines and '#' comment lines.
        skip_args=$(grep -vE '^[[:space:]]*(#|$)' hack/boilerplate/skip.txt | sed 's/^/--skip /' | tr '\n' ' ')
        ./hack/fix_boilerplate.py --boilerplate-dir hack/boilerplate/ $skip_args
  test:
    desc: Run unit tests for every component.
    cmds:
      - for: {var: COMPONENTS}
        cmd: task test-{{.ITEM}}
  test-integration:
    desc: Run the integration tests (tests/integration) against a kcp in Docker.
    cmds:
      - task: tests:integration
        vars: {PKG: '{{.PKG}}', P: '{{.P}}', KCP_VERSION: '{{.KCP_VERSION}}', ADDITIONAL_COMMAND_ARGS: '{{.ADDITIONAL_COMMAND_ARGS}}'}
  test-e2e:
    desc: Run the e2e tests (tests/e2e Go suites, then the portal suite) against KUBECONFIG / ADMIN_KUBECONFIG.
    cmds:
      - task: tests:e2e
        vars: {TEST_RUN_ID: '{{.TEST_RUN_ID}}', ADDITIONAL_COMMAND_ARGS: '{{.ADDITIONAL_COMMAND_ARGS}}'}
  generate:
    desc: Run code generation for every component, then sync the generated CRDs into the charts.
    cmds:
      - for: {var: COMPONENTS}
        cmd: task generate-{{.ITEM}}
      - task: charts:sync-crds
  build:
    desc: Build every component.
    cmds:
      - for: {var: COMPONENTS}
        cmd: task build-{{.ITEM}}
  pmctl:
    desc: Build the pmctl CLI into bin/pmctl (VERSION= to override the stamped version). Also built by `task build-root`.
    cmds:
      - task --taskfile Taskfile.root.yaml pmctl {{if .VERSION}}VERSION={{.VERSION}}{{end}}
  images:
    desc: 'Build container images for every component that ships a Dockerfile (VERSION=, PUSH=, PLATFORMS= to override).'
    cmds:
      - for: {var: COMPONENTS}
        task: images-{{.ITEM}}
        vars:
          REGISTRY: '{{.REGISTRY}}'
          REPO: '{{.REPO}}'
          VERSION: '{{.VERSION}}'
          PUSH: '{{.PUSH}}'
          PLATFORMS: '{{.PLATFORMS}}'

  # ---------------------------------------------------------------------------
  # Per-component targets. Each delegates to the component's own Taskfile.
  # ---------------------------------------------------------------------------
  "test-*":
    desc: "Run unit tests for one component (e.g. task test-account-operator)."
    cmds:
      - task: _run
        vars: {COMPONENT: "{{index .MATCH 0}}", TARGET: test}
  "lint-*":
    desc: "Lint one component (e.g. task lint-account-operator)."
    cmds:
      - task: _run
        vars: {COMPONENT: "{{index .MATCH 0}}", TARGET: lint}
  "generate-*":
    desc: "Run code generation for one component (e.g. task generate-account-operator)."
    deps: [tools:controller-gen, tools:apigen, tools:mockery]
    cmds:
      - task: _run
        vars: {COMPONENT: "{{index .MATCH 0}}", TARGET: generate}
  "build-*":
    desc: "Build one component (e.g. task build-account-operator)."
    cmds:
      - task: _run
        vars: {COMPONENT: "{{index .MATCH 0}}", TARGET: build}
  "tidy-check-*":
    desc: "Verify one module is self-contained (e.g. task tidy-check-apis)."
    env:
      GOWORK: "off"
    vars:
      YQ: { sh: 'env -u UGET_CHECKSUMS -u UGET_DIRECTORY UGET_PRINT_PATH=absolute task --dir {{.ROOT_DIR}} tools:yq' }
    cmds:
      - |
        comp='{{index .MATCH 0}}'
        dir=$({{.YQ}} -e ".components.\"$comp\".path" ocm/components.yaml) || { echo "unknown component '$comp' (not in ocm/components.yaml)" >&2; exit 1; }
        cd "$dir" && go mod tidy -diff && go list -m all >/dev/null
  "boilerplate-*":
    desc: "Verify boilerplate for one component (e.g. task boilerplate-apis)."
    vars:
      YQ: { sh: 'env -u UGET_CHECKSUMS -u UGET_DIRECTORY UGET_PRINT_PATH=absolute task --dir {{.ROOT_DIR}} tools:yq' }
    cmds:
      - |
        comp='{{index .MATCH 0}}'
        dir=$({{.YQ}} -e ".components.\"$comp\".path" ocm/components.yaml) || { echo "unknown component '$comp' (not in ocm/components.yaml)" >&2; exit 1; }
        root=$PWD
        # --skip args from hack/boilerplate/skip.txt, ignoring blank lines and '#' comment lines.
        skip_args=$(grep -vE '^[[:space:]]*(#|$)' "$root/hack/boilerplate/skip.txt" | sed 's/^/--skip /' | tr '\n' ' ')
        cd "$dir" && "$root/hack/verify_boilerplate.py" --boilerplate-dir "$root/hack/boilerplate/" $skip_args
  "verify-*":
    desc: "Run all checks for one component (e.g. task verify-account-operator)."
    cmds:
      - task: lint-{{index .MATCH 0}}
      - task: tidy-check-{{index .MATCH 0}}
      - task: boilerplate-{{index .MATCH 0}}
  "images-*":
    desc: "Build (and optionally push) one component's image (e.g. task images-account-operator VERSION=v0.1.0 PUSH=true)."
    vars:
      # Defaults match the release pipeline's image naming; override on the CLI.
      REGISTRY: '{{.REGISTRY | default "ghcr.io"}}'
      REPO: '{{.REPO | default "platform-mesh/platform-mesh"}}'   # ghcr namespace: <registry>/<repo>/<name>
      VERSION: '{{.VERSION | default "dev"}}'                     # image tag; also pushed without leading "v"
      PUSH: '{{.PUSH | default "false"}}'                          # true -> buildx --push, false -> --load
      PLATFORMS: '{{.PLATFORMS | default "linux/amd64"}}'          # multi-arch (e.g. linux/amd64,linux/arm64) requires PUSH=true
      CONTEXT: '{{.CONTEXT | default "."}}'                         # build context; repo root by default (shared go.work)
      METADATA_FILE: '{{.METADATA_FILE | default ""}}'             # write buildx metadata (incl. containerimage.digest) here for signing
    cmds:
      - task: _image
        vars:
          COMPONENT: "{{index .MATCH 0}}"
          REGISTRY: "{{.REGISTRY}}"
          REPO: "{{.REPO}}"
          VERSION: "{{.VERSION}}"
          PUSH: "{{.PUSH}}"
          PLATFORMS: "{{.PLATFORMS}}"
          CONTEXT: "{{.CONTEXT}}"
          METADATA_FILE: "{{.METADATA_FILE}}"

  # Resolve a component name to its directory (ocm/components.yaml) and
  # delegate to its Taskfile.
  _run:
    internal: true
    silent: true
    vars:
      YQ: { sh: 'env -u UGET_CHECKSUMS -u UGET_DIRECTORY UGET_PRINT_PATH=absolute task --dir {{.ROOT_DIR}} tools:yq' }
    cmds:
      - |
        comp='{{.COMPONENT}}'; target='{{.TARGET}}'
        dir=$({{.YQ}} -e ".components.\"$comp\".path" ocm/components.yaml) || { echo "unknown component '$comp' (not in ocm/components.yaml)" >&2; exit 1; }
        # The root module's Taskfile is this one; its own targets live in Taskfile.root.yaml.
        if [ "$dir" = . ]; then
          task --taskfile Taskfile.root.yaml "$target"
        else
          task --dir "$dir" "$target"
        fi

  # Build (and optionally push) a single component image. Mirrors how the release
  # workflows build the operator images (root context + shared go.work), so a
  # local `task images-<name>` reproduces the CI image.
  _image:
    internal: true
    silent: true
    vars:
      YQ: { sh: 'env -u UGET_CHECKSUMS -u UGET_DIRECTORY UGET_PRINT_PATH=absolute task --dir {{.ROOT_DIR}} tools:yq' }
    cmds:
      - |
        set -eu
        comp='{{.COMPONENT}}'
        dir=$({{.YQ}} -e ".components.\"$comp\".path" ocm/components.yaml) || { echo "unknown component '$comp' (not in ocm/components.yaml)" >&2; exit 1; }
        # apis and other code-only modules ship no Dockerfile — skip, don't fail,
        # so the `images` fan-out can iterate every component.
        if [ ! -f "$dir/Dockerfile" ]; then
          echo ">> $comp: no Dockerfile in $dir — skipping image build"
          exit 0
        fi

        version='{{.VERSION}}'
        image='{{.REGISTRY}}/{{.REPO}}'/"$comp"

        # Build context is the repo ROOT: the operator Dockerfiles use the shared
        # go.work + apis module, so they COPY root-relative paths. A self-contained
        # component can override with CONTEXT=<dir>.
        context='{{.CONTEXT | default "."}}'

        push_flag='--load'
        [ '{{.PUSH}}' = 'true' ] && push_flag='--push'

        # Single tag: image:VERSION (e.g. v0.1.0, latest, pr-N, dev).
        set -- -t "$image:$version"

        # Optional: emit buildx metadata (incl. containerimage.digest) so callers
        # like the release workflow can cosign-sign the pushed image by digest.
        meta='{{.METADATA_FILE}}'
        [ -n "$meta" ] && set -- "$@" --metadata-file "$meta"

        echo ">> building $image:$version (context=$context platforms={{.PLATFORMS}} push={{.PUSH}})"
        docker buildx build \
          --file "$dir/Dockerfile" \
          --platform '{{.PLATFORMS}}' \
          "$push_flag" \
          "$@" \
          "$context"

  # ---------------------------------------------------------------------------
  # Point every consumer at a released version of an internal module. Generic
  # over the module: the component's own go.mod supplies the module path, so the
  # same target works for apis, golang-commons, subroutines, ... — nothing is
  # hardcoded. Run it after tagging a module (git tag <module>/vX.Y.Z), then
  # commit the resulting go.mod/go.sum changes.
  #   task bump-deps -- apis v0.0.1
  bump-deps:
    desc: 'Point every consumer at a released internal-module version (e.g. task bump-deps -- apis v0.0.1).'
    env:
      GOWORK: "off"   # resolve the published version from the proxy, not the local workspace copy.
      GOSUMDB: "" # skip resolving on gosumbdb
      GOPROXY: "direct" # skip module proxy, get from source
    vars:
      YQ: { sh: 'env -u UGET_CHECKSUMS -u UGET_DIRECTORY UGET_PRINT_PATH=absolute task --dir {{.ROOT_DIR}} tools:yq' }
    cmds:
      - |
        set -eu
        comp=$(printf '%s\n' {{.CLI_ARGS}} | sed -n 1p)
        version=$(printf '%s\n' {{.CLI_ARGS}} | sed -n 2p)
        if [ -z "$comp" ] || [ -z "$version" ]; then
          echo "usage: task bump-deps -- <component> <version>   e.g. task bump-deps -- apis v0.0.1" >&2
          exit 1
        fi
        dir=$({{.YQ}} -e ".components.\"$comp\".path" ocm/components.yaml) || { echo "unknown component '$comp' (not in ocm/components.yaml)" >&2; exit 1; }
        module=$(go mod edit -json "$dir/go.mod" | jq -r '.Module.Path')
        echo ">> bumping consumers of $module to $version"
        # Trailing space pins the require line for exactly this module, not a
        # longer path that shares its prefix (e.g. .../apis vs .../apis/foo).
        grep -rls "$module " --include=go.mod . | while read -r f; do
          d=$(dirname "$f")
          # Skip the module's own go.mod.
          [ "$(go mod edit -json "$f" | jq -r '.Module.Path')" = "$module" ] && continue
          echo "   - $d"
          (cd "$d" && go get "$module@$version" && go mod tidy)
        done
        # Re-sync the workspace with GOWORK reset (the task disables it above so
        # the per-module bumps resolve the published version, not the local copy).
        GOWORK= go work sync

  # ---------------------------------------------------------------------------
  # Dependency refresh via the Renovate CLI.
  # The Renovate app only raises vulnerability PRs via .github/renovate.json.
  # Everything else moves through these targets once per release cycle.
  # ---------------------------------------------------------------------------
  deps:local-update:
    desc: 'Run Renovate against a throwaway local Forgejo and fetches the deps/all branch.'
    cmds:
      - RENOVATE_IMAGE={{.RENOVATE_IMAGE}} hack/deps-local.sh
  deps:post-release:
    desc: 'Bump every dependency using renovate and regenerate.'
    cmds:
      - task: deps:local-update
      - hack/deps-local.sh apply
      - hack/verify-go-version.sh --fix
      - task: tidy
      - task: generate

  # ---------------------------------------------------------------------------
  # Workspace helpers
  # ---------------------------------------------------------------------------
  tidy:
    desc: Tidy every module's go.mod (standalone) and re-sync the workspace.
    cmds:
      - go work sync
      - for: {var: COMPONENTS}
        cmd: task tidy-{{.ITEM}}
      # ref: https://github.com/golang/go/issues/63901
      # TLDR: go work sync doesn't actually everything.
      # We force fill the go.work.sum by downloading all deps.
      # Without this the go.work.sum is randomly updated when
      # a developer pulls a dependency they didn't have in the module
      # cache yet.
      - go mod download all
  "tidy-*":
    desc: "Tidy one module's go.mod (e.g. task tidy-apis)."
    env:
      GOWORK: "off"
    vars:
      YQ: { sh: 'env -u UGET_CHECKSUMS -u UGET_DIRECTORY UGET_PRINT_PATH=absolute task --dir {{.ROOT_DIR}} tools:yq' }
    cmds:
      - |
        comp='{{index .MATCH 0}}'
        dir=$({{.YQ}} -e ".components.\"$comp\".path" ocm/components.yaml) || { echo "unknown component '$comp' (not in ocm/components.yaml)" >&2; exit 1; }
        # Forward version-pin replaces from go.work into the module's go.mod so
        # it resolves standalone, e.g. in docker builds.
        replaces=$(GOWORK= go work edit -json | jq -r '.Replace[] | "\(.Old.Path)=\(.New.Path)@\(.New.Version)"')
        cd "$dir"
        go mod edit $(printf ' -replace=%s' $replaces)
        go mod tidy
        # Drop old replaces and those whose Old path isn't referenced by this module.
        deps=$(go list -m -f '{{`{{.Path}}`}}' all)
        for r in $(go mod edit -json | jq -r '.Replace[]?.Old.Path'); do
          grep -qxF "$r" <<<"$deps" || go mod edit -dropreplace="$r"
        done
