name: images

# Keeps the mutable :latest images current: on every push to main, the image
# of every component whose sources changed in that push is built for
# amd64/arm64, pushed as ghcr.io/<owner>/platform-mesh/<component>:latest and
# signed. (A change to a shared library, go.work or ocm/components.yaml counts
# for all components.)
#
# No checks run here; the commit passed them as a pull request and in the
# merge queue (verify-*.yml). Versioned, immutable images are built by
# job-publish.yml for Platform Mesh releases (`v*` tags) and prereleases.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Rebuild :latest for every component, not just the changed ones"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      imageComponents: ${{ steps.c.outputs.imageComponents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changed components
        id: c
        env:
          BASE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          set -euo pipefail
          if [ "$ALL" = "true" ] || ! git cat-file -e "${BASE:-none}" 2>/dev/null; then
            changed=""   # everything (manual request, or unknown base such as a force push)
          else
            changed="$(git diff --name-only "$BASE..HEAD")"
          fi
          hack/release/changed-components.sh "$changed" | tee -a "$GITHUB_OUTPUT"

  # this step runs once for each changed component and produces the final image
  image:
    needs: changes
    if: needs.changes.outputs.imageComponents != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push :latest
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.imageComponents) }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push :latest
        id: build
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          task images-${COMPONENT} \
            VERSION=latest \
            REPO=${GITHUB_REPOSITORY_OWNER}/platform-mesh \
            PLATFORMS=linux/amd64,linux/arm64 \
            PUSH=true \
            METADATA_FILE="${RUNNER_TEMP}/metadata.json"
          image=$(yq ".components.\"$COMPONENT\".image" ocm/components.yaml)
          digest=$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json")
          echo "imageRef=ghcr.io/${GITHUB_REPOSITORY_OWNER}/platform-mesh/${image}@${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        run: cosign sign --yes "${IMAGE_REF}"
        env:
          IMAGE_REF: ${{ steps.build.outputs.imageRef }}
