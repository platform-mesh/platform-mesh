name: e2e-deployer

# The multi-cluster platform-mesh-deployer suite (tests/e2e/deployer). Every
# test brings up its own kind clusters through hack/kind.sh (ten in total, all
# in parallel) and runs the deployer in-process, which is too heavy for every
# pull request, so it runs nightly. `task tests:e2e:deployer` locally.

on:
  # FORK: schedule disabled to not burn runner minutes in the test fork; re-enable at cutover.
  # schedule:
  #   - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest-large
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The suite drives kind through hack/kind.sh with KIND set by the task;
      # kind on PATH is for the diagnostics step below. docker, kubectl and
      # helm come with the runner image.
      - name: Install kind
        run: |
          kind="$(UGET_PRINT_PATH=absolute task tools:kind)"
          sudo install -m 0755 "$kind" /usr/local/bin/kind
          kind version
          docker version
          kubectl version --client
          helm version

      # Ten kind clusters at once exhaust the default inotify limits
      # ("too many open files" in kubelet / kube-proxy).
      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=1048576
          sudo sysctl -w fs.inotify.max_user_instances=8192

      - name: Deployer e2e
        env:
          # Keep the clusters so the diagnostics step can dump them; the
          # runner is discarded afterwards.
          E2E_KEEP: "true"
        run: |
          set -o pipefail
          task tests:e2e:deployer ADDITIONAL_COMMAND_ARGS=-v |& tee e2e-deployer.log

      # The suite logs the config plane's deployer objects on failure; this
      # dumps every cluster the suite created.
      - name: Dump cluster diagnostics
        if: failure()
        run: |
          mkdir -p runtime-artifacts
          for cluster in $(kind get clusters | grep '^pm-deployer-e2e-'); do
            kind export kubeconfig --name "$cluster"
            KUBE_CONTEXT="kind-$cluster" hack/dump-cluster-diagnostics.bash "runtime-artifacts/$cluster" || true
            kind export logs --name "$cluster" "runtime-artifacts/$cluster/kind-logs" || true
          done

      - name: Upload runtime artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-deployer-artifacts
          path: |
            runtime-artifacts/
            e2e-deployer.log
          retention-days: 5
