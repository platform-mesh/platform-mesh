name: release

# Releases Platform Mesh. Triggered by pushing a tag `vYY.MM.P` (final) or
# `vYY.MM.P-rc.N` (release candidate), on main or on a release-YY.MM branch.
# job-publish.yml builds and publishes every image, chart and OCM component at
# that version, then a GitHub release with generated notes is created.
#
# There is nothing to prepare before tagging: charts carry no versions in git
# (RFC 015), third-party versions live in third_party/*/component-constructor.yaml.
#
# Builds of main between releases use prerelease.yml.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Resolve version from the tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing Platform Mesh $version (prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: version
    uses: ./.github/workflows/job-publish.yml
    permissions:
      contents: read
      packages: write # push images, charts and OCM components
      id-token: write # keyless cosign signing
      security-events: write # trivy SARIF reports
    secrets:
      OCM_SIGNING_PRIVATE_KEY: ${{ secrets.OCM_SIGNING_PRIVATE_KEY }}
      OCM_SIGNING_CERT: ${{ vars.OCM_SIGNING_CERT }}
    with:
      version: ${{ needs.version.outputs.version }}

  github-release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # release notes compare against the previous tag
      - name: Release notes
        run: hack/release/release-notes.sh "$TAG" > release-notes.md
      - name: Create GitHub release
        run: |
          set -euo pipefail
          flags=(--title "Platform Mesh $VERSION" --notes-file release-notes.md --verify-tag)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}"
