name: release

# Releases Platform Mesh. Triggered by pushing a tag `vYY.MM.P` (final) or
# `vYY.MM.P-rc.N` (release candidate), on main or on a release-YY.MM branch.
# job-publish.yml builds and publishes every image, chart and OCM component at
# that version, then goreleaser creates a GitHub release with generated notes
# and the release assets (.goreleaser.yaml): pmctl for linux and darwin on
# amd64 and arm64, and the rendered component-constructor.yaml.
#
# There is nothing to prepare before tagging: charts carry no versions in git
# (RFC 015), third-party versions live in third_party/*/component-constructor.yaml.
#
# Builds of main between releases use prerelease.yml.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Resolve version from the tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing Platform Mesh $version (prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: version
    uses: $/.github/workflows/job-publish.yml
    permissions:
      contents: read
      packages: write # push images, charts and OCM components
      id-token: write # keyless cosign signing
      security-events: write # trivy SARIF reports
    secrets:
      OCM_SIGNING_PRIVATE_KEY: ${{ secrets.OCM_SIGNING_PRIVATE_KEY }}
      OCM_SIGNING_CERT: ${{ vars.OCM_SIGNING_CERT }}
    with:
      version: ${{ needs.version.outputs.version }}

  github-release:
    needs: [version, publish]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write # create the release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # release notes compare against the previous tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false # Do not restore CI caches in a release job with write access.
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Outside the checkout: goreleaser refuses to release from a dirty tree.
      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # raises the API rate limit
        run: go run ./hack/release/release-notes --end "$TAG" > "$RUNNER_TEMP/release-notes.md"
      # Builds pmctl for every platform, renders component-constructor.yaml and
      # creates the release with both attached (.goreleaser.yaml).
      - name: Create GitHub release with its assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: task release-publish VERSION="$TAG" NOTES="$RUNNER_TEMP/release-notes.md"
