name: verify-all

# Repository-wide quality gate.
#
# Unlike the per-component pipelines this workflow has NO path filter: it runs
# on every pull request and every push to main. The per-component workflows only
# fire when their own paths change, so a component without a workflow — or a
# change to hack/, tools/ or the root Taskfile — would otherwise reach main with
# nothing checking it at all.
#
# It fans out over every component in the root Taskfile's COMPONENTS list, so a
# new component is covered the moment it is added there.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read # Needed for actions/checkout

concurrency:
  group: verify-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # lint + tidy-check fan out over every component
    env:
      GOPRIVATE: github.com/platform-mesh
      # `task dco` walks BASE..HEAD. On a pull_request the checkout is the merge
      # commit, so this is exactly the PR's own commits; on a push to main the
      # range is empty and the check passes trivially.
      BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # `task dco` needs the base branch and full commit history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - name: Enable git CLI clones using GITHUB_TOKEN
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Every commit on the branch needs a Signed-off-by matching its author.
      # The DCO app gates pull requests but not the merge queue, and running it
      # here means `task verify` locally catches the same thing before pushing.
      - run: task dco BASE=${BASE}
        if: ${{ !startsWith(github.event.pull_request.title, '[REBASE] ') }}
      - run: task lint
      - run: task tidy-check
      # Missing headers are fixed locally with `task boilerplate-fix`.
      - run: task boilerplate
