name: echo-signing-cert

on:
  workflow_dispatch:
  push:
    branches:

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Print OCM_SIGNING_CERT
        run: |
          echo "=== BEGIN OCM_SIGNING_CERT ==="
          echo "${{ secrets.OCM_SIGNING_CERT }}" > public.crt
          echo "=== base64 ==="
          base64 < public.crt
          echo "=== cat ==="
          cat public.crt
          echo "=== END OCM_SIGNING_CERT ==="
