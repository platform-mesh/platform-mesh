name: echo-signing-cert

on:
  workflow_dispatch:
  push:
    branches:

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Print OCM_SIGNING_CERT
        run: |
          echo "=== BEGIN OCM_SIGNING_CERT ==="
          echo "${{ secrets.OCM_SIGNING_CERT }}" | base64
          echo "=== END OCM_SIGNING_CERT ==="
