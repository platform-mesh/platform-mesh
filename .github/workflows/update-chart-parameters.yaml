name: update-chart-parameters

# Opens an auto-merging pull request that pins a new image version of a
# component from another repository (portal, iam-ui, marketplace-ui, …) as
# appVersion in charts/<chart>/Chart.yaml.
#
# Dispatched by the release workflow of that repository through
# platform-mesh/.github's job-chart-version-update.yml; the file name is the
# contract. Charts built in this repository are refused
# (hack/charts/set-app-version.sh).

on:
  workflow_dispatch:
    inputs:
      chart:
        description: "Chart under charts/ (e.g. portal)"
        required: true
        type: string
      appVersion:
        description: "Image version to pin (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

# Serialize per chart so that back-to-back dispatches cannot race each other
# while opening and closing bump PRs.
concurrency:
  group: update-chart-parameters-${{ inputs.chart }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pushed and opened as the PM Publisher app so that PR-triggered
      # workflows run without a maintainer approval prompt.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: "1415820"
          private-key: ${{ secrets.PM_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # A second identity satisfies the required review.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: approver-app-token
        with:
          app-id: "4247305"
          private-key: ${{ secrets.PM_APPROVER_PRIVATE_KEY }}
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set appVersion
        id: bump
        env:
          CHART: ${{ inputs.chart }}
          APP_VERSION: ${{ inputs.appVersion }}
          RELEASE_TOOLS_FROM_PATH: "true"
        run: |
          set -euo pipefail
          hack/charts/set-app-version.sh "$CHART" "$APP_VERSION"

          chart_yaml="charts/$CHART/Chart.yaml"
          if git diff --quiet -- "$chart_yaml"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app_version="$(yq -r '.appVersion' "$chart_yaml")"
          {
            echo "changed=true"
            echo "branch=bump/$CHART-$app_version"
            echo "title=Set appVersion $app_version in $chart_yaml"
          } >> "$GITHUB_OUTPUT"
      - name: Open PR
        id: pr
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHART: ${{ inputs.chart }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          TITLE: ${{ steps.bump.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name "Platform Mesh Publisher[bot]"
          git config user.email "platformmesh@gmail.com"
          gh auth setup-git
          git checkout -b "$BRANCH"
          git add "charts/$CHART/Chart.yaml"
          git commit -s -m "$TITLE"
          # Bot-owned, disposable branch: a plain force push is safe and avoids
          # the "stale info" rejection from --force-with-lease, which needs a
          # remote-tracking ref this fresh checkout never fetched.
          git push --force origin "$BRANCH"
          # Reuse an existing PR for this branch only if one is still open;
          # re-running after a manual close creates a fresh PR off current main.
          url="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')"
          if [ -z "$url" ]; then
            url="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "Automated appVersion bump.")"
            gh pr merge "$url" --auto
          else
            echo "Open PR already exists for $BRANCH; skipping create."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Approve PR
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ steps.approver-app-token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: gh pr review "$PR_URL" --approve
      - name: Close superseded PRs
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHART: ${{ inputs.chart }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          # Older bump PRs for the same chart are dead once any of them merges.
          # Match on the title suffix, not the branch prefix: chart names overlap
          # (platform-mesh-operator vs. platform-mesh-operator-crds).
          gh pr list --state open --author "app/platform-mesh-publisher" \
            --json number,title,headRefName --limit 100 \
          | jq -r --arg chart "$CHART" --arg branch "$BRANCH" '
              .[]
              | select(.headRefName | startswith("bump/"))
              | select(.title | endswith(" in charts/\($chart)/Chart.yaml"))
              | select(.headRefName != $branch)
              | .number' \
          | while read -r number; do
              echo "Closing #$number, superseded by $PR_URL"
              gh pr close "$number" --delete-branch --comment "Superseded by $PR_URL."
            done
