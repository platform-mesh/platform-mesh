name: prerelease

# Publishes the current state of a branch (normally main) as a Platform Mesh
# prerelease, exactly like release.yml does for a tag, but
#
#   - on demand (and optionally on a schedule), not for every commit,
#   - with the version <next release>-dev.<run number>.g<sha>, e.g.
#     26.11.0-dev.42.g1a2b3c4 (next release per hack/release/next-version.sh,
#     i.e. the VERSION file). "dev" sorts below "rc", so semver range queries
#     prefer release candidates and releases over these builds,
#   - without a GitHub release.
#
# Install it like a release (installation/README.md), with the version as
# `ocm.version` of the platform-mesh-operator chart.
#
# Old prerelease versions are removed by prerelease-cleanup.yml.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to publish (default: the branch this workflow runs from)"
        required: false
        type: string
  # Uncomment for a nightly build of main.
  # schedule:
  #   - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0 # tags are needed to derive the version
      - name: Derive version
        id: v
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$(hack/release/next-version.sh)-dev.${RUN_NUMBER}.g$(git rev-parse --short=7 HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "Publishing prerelease $version from $(git rev-parse HEAD)."
            echo
            echo "Install it like a release (installation/README.md) with \`--set-string ocm.version=$version\`."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: version
    uses: ./.github/workflows/job-publish.yml
    permissions:
      contents: read
      packages: write # push images, charts and OCM components
      id-token: write # keyless cosign signing
      security-events: write # trivy SARIF reports
    secrets:
      OCM_SIGNING_PRIVATE_KEY: ${{ secrets.OCM_SIGNING_PRIVATE_KEY }}
      OCM_SIGNING_CERT: ${{ vars.OCM_SIGNING_CERT }}
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.sha }}
