name: install-kind

# Installs Platform Mesh on a kind cluster the way installation/README.md
# describes it and runs the Playwright smoke test (tests/). Ported from
# helm-charts' kind-localsetup.yaml.
#
# What this tests, and what not: the platform-mesh-prerequisites and
# platform-mesh-operator charts (including the kind profile) come from the
# checkout, so a change to them is exercised. Everything the operator then
# installs comes from the *published* Platform Mesh version `ocm.version`
# points at (the latest release of this repository unless given), so a change
# to any other chart is not. Those changes are first tested by a prerelease
# or release candidate; see docs/release/process.md.

on:
  pull_request:
    paths:
      - 'charts/platform-mesh-operator/**'
      - 'charts/platform-mesh-prerequisites/**'
      - 'installation/**'
      - 'tests/**'
      - '.github/workflows/install-kind.yml'
  merge_group:
  workflow_dispatch:
    inputs:
      platform-mesh-version:
        description: "Platform Mesh version to install (default: latest release of this repository)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_DOMAIN: portal.localhost
  PORTAL_BASE_URL: https://portal.localhost:8443/
  KEYCLOAK_BASE_URL: https://portal.localhost:8443/keycloak

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read # pull the published components and images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Pick the Platform Mesh version to install
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.platform-mesh-version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            # Latest Platform Mesh release (tags vYY.MM.P); the repository also has
            # releases of the Go modules (apis/v0.2.0, ...), which are not installable.
            # Release candidates only if there is no final release yet.
            pm_releases='map(select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$")))'
            version="$(gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName --jq "$pm_releases | .[0].tagName // empty")"
            if [ -z "$version" ]; then
              version="$(gh release list --exclude-drafts --limit 50 --json tagName --jq "$pm_releases | .[0].tagName // empty")"
            fi
            [ -n "$version" ] || { echo "::error::no Platform Mesh release (vYY.MM.P) found in $GH_REPO; pass platform-mesh-version"; exit 1; }
          fi
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*|[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$version' is not a Platform Mesh version"; exit 1 ;;
          esac
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Installing Platform Mesh $version" >> "$GITHUB_STEP_SUMMARY"

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/helm
        id: helm

      - name: Install kubectl kcp plugins
        run: |
          set -e
          ( set -x; cd "$(mktemp -d)" && curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/latest/download/krew-linux_amd64.tar.gz" && tar zxvf krew-linux_amd64.tar.gz && KREW_ROOT="$HOME/.krew" ./krew-linux_amd64 install krew )
          echo "$HOME/.krew/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.krew/bin:$PATH"
          kubectl krew index add kcp-dev https://github.com/kcp-dev/krew-index.git
          kubectl krew install kcp-dev/kcp
          kubectl krew install kcp-dev/ws
          kubectl krew install kcp-dev/create-workspace
          kubectl krew install oidc-login

      - name: Install kind
        run: |
          kind="$(UGET_PRINT_PATH=absolute task tools:kind)"
          sudo install -m 0755 "$kind" /usr/local/bin/kind
          kind version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'tests/package-lock.json'

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

      - name: Create kind cluster
        run: |
          kind create cluster --name platform-mesh --image kindest/node:v1.35.1 --config=- <<'EOF'
          apiVersion: kind.x-k8s.io/v1alpha4
          kind: Cluster
          networking:
            apiServerAddress: "127.0.0.1"
            kubeProxyMode: iptables
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 31000
                  hostPort: 8443
                  protocol: TCP
                  listenAddress: "127.0.0.1"
          EOF
          kubectl cluster-info --context kind-platform-mesh

      - name: Log in to ghcr.io for Helm
        run: echo "${GITHUB_TOKEN}" | ${HELM} registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM: ${{ steps.helm.outputs.path }}

      - name: Add /etc/hosts entries
        run: |
          run_id="${GITHUB_RUN_ID}"
          run_id="${run_id: -8}"
          echo "TEST_RUN_ID=${run_id}" >> "$GITHUB_ENV"
          sudo tee -a /etc/hosts >/dev/null <<EOF
          127.0.0.1 portal.localhost
          127.0.0.1 kcp.api.portal.localhost
          127.0.0.1 root.kcp.portal.localhost
          127.0.0.1 org-root-${run_id}.portal.localhost
          EOF

      - name: Resolve chart dependencies
        run: hack/charts/resolve-dependencies.sh

      - name: Install prerequisites (pass 1 — controllers and CRDs)
        env:
          HELM: ${{ steps.helm.outputs.path }}
        run: |
          # Reduce CPU requests for components with hard defaults so the
          # security-operator pods have room to schedule on the 4-vCPU runner.
          ${HELM} upgrade --install platform-mesh-prerequisites \
            ./charts/platform-mesh-prerequisites \
            --namespace platform-mesh-system \
            --set keycloak-operator.watchNamespaces=platform-mesh-system \
            --set keycloak-operator.resources.requests.cpu=100m \
            --set flux2.helmController.resources.requests.cpu=50m \
            --set flux2.kustomizeController.resources.requests.cpu=50m \
            --set flux2.sourceController.resources.requests.cpu=50m \
            --set flux2.notificationController.resources.requests.cpu=50m \
            --set flux2.imageAutomationController.create=false \
            --set flux2.imageReflectionController.create=false \
            --set ocm-k8s-toolkit.resources.requests.cpu=50m \
            --set etcd-druid.resources.requests.cpu=25m \
            --create-namespace \
            --wait \
            --timeout 15m

      - name: Install prerequisites (pass 2 — enable Traefik NodePort)
        env:
          HELM: ${{ steps.helm.outputs.path }}
        run: |
          ${HELM} upgrade platform-mesh-prerequisites \
            ./charts/platform-mesh-prerequisites \
            --namespace platform-mesh-system \
            --reset-values \
            --wait \
            --timeout 15m \
            --set keycloak-operator.watchNamespaces=platform-mesh-system \
            --set keycloak-operator.resources.requests.cpu=100m \
            --set flux2.helmController.resources.requests.cpu=50m \
            --set flux2.kustomizeController.resources.requests.cpu=50m \
            --set flux2.sourceController.resources.requests.cpu=50m \
            --set flux2.notificationController.resources.requests.cpu=50m \
            --set flux2.imageAutomationController.create=false \
            --set flux2.imageReflectionController.create=false \
            --set ocm-k8s-toolkit.resources.requests.cpu=50m \
            --set etcd-druid.resources.requests.cpu=25m \
            --set traefik.enabled=true \
            --set traefik.service.type=NodePort \
            --set traefik.service.spec.type=NodePort \
            --set traefik.service.spec.clusterIP=10.96.188.4 \
            --set traefik.ports.websecure.exposedPort=8443 \
            --set traefik.ports.websecure.nodePort=31000

      - name: Capture Traefik ClusterIP
        id: traefik
        run: |
          ip=$(kubectl --namespace platform-mesh-system \
            get service platform-mesh-prerequisites-traefik \
            --output jsonpath='{.spec.clusterIP}')
          echo "cluster_ip=${ip}" >> "$GITHUB_OUTPUT"
          echo "Traefik ClusterIP: ${ip}"

      - name: Install platform-mesh-operator (kind profile)
        env:
          HELM: ${{ steps.helm.outputs.path }}
          PM_VERSION: ${{ steps.version.outputs.version }}
          TRAEFIK_CLUSTER_IP: ${{ steps.traefik.outputs.cluster_ip }}
          GATEWAY_CLASS_NAME: traefik
          OWNER: ${{ github.repository_owner }}
        run: |
          # hostAliases is intentionally not set: the operator reaches
          # kcp via the in-cluster front-proxy Service, and component pods get their
          # host aliases from the kind profile keyed on gateway.clusterIP.
          #
          # No --wait here: the chart applies the PlatformMesh resource, then the
          # dedicated "Wait for Platform Mesh" step gates readiness with a 30m budget.
          # (Helm v4 --wait tracks custom-resource readiness, so a short --wait would
          # time out on a cold KIND before the platform finishes reconciling.)
          #
          # image.tag: the chart in git has appVersion 0.0.0 (the version is written
          # in at release time), so the operator image of the installed version is
          # named explicitly.
          ${HELM} upgrade --install platform-mesh-operator \
            ./charts/platform-mesh-operator \
            --namespace platform-mesh-system \
            --set ocm.enabled=true \
            --set ocm.profile=kind \
            --set ocm.repository="ghcr.io/${OWNER}" \
            --set ocm.installSigningCertificate=true \
            --set image.repository="${OWNER}/platform-mesh/platform-mesh-operator" \
            --set image.tag="v${PM_VERSION}" \
            --set gateway.baseDomain="${BASE_DOMAIN}" \
            --set gateway.className="${GATEWAY_CLASS_NAME}" \
            --set gateway.port=8443 \
            --set gateway.clusterIP="${TRAEFIK_CLUSTER_IP}" \
            --set kcp.frontProxyPort=8443 \
            --set certificates.selfSigned.enabled=true \
            --set-string ocm.version="${PM_VERSION}"

      - name: Wait for Platform Mesh to become ready
        run: |
          kubectl wait --namespace platform-mesh-system \
            --for=condition=Ready platformmeshes/platform-mesh \
            --timeout=30m

      - name: Wait for portal data plane to become ready
        # PlatformMesh Ready confirms PMO subroutines completed, but Flux may still
        # be installing portal and the GraphQL gateway. Wait for both Helm releases
        # and their deployments before sending browser traffic through Traefik.
        run: |
          kubectl wait --namespace platform-mesh-system \
            --for=condition=Ready helmreleases/portal helmreleases/kubernetes-graphql-gateway \
            --timeout=15m
          kubectl rollout status --namespace platform-mesh-system deployment/portal --timeout=5m
          kubectl rollout status --namespace platform-mesh-system deployment/kubernetes-graphql-gateway --timeout=5m

      - name: Regenerate kcp admin kubeconfig
        # Run from the repo root so the kubeconfig lands at <repo>/.secret/kcp/admin.kubeconfig,
        # which is exactly the ADMIN_KUBECONFIG the e2e resolves (tests/..). The admin client
        # cert is rotated on every install, so this must run after the operator is Ready.
        run: ./tests/create-kcp-admin-kubeconfig.sh

      - name: Install Playwright
        run: task tests:portal-e2e:setup

      - name: Run portal e2e (root-shard smoke)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Give the workspace initializer more time on a single-node KIND cluster —
          # nereus/triton shards compete for CPU, making workspace provisioning slower
          # than on dedicated hardware.
          ORG_READY_TIMEOUT_SECONDS: "600"
        run: task tests:portal-e2e:remote TEST_RUN_ID="${TEST_RUN_ID}"

      - name: Dump cluster diagnostics
        if: failure()
        env:
          ADMIN_KUBECONFIG: .secret/kcp/admin.kubeconfig
        run: hack/dump-cluster-diagnostics.bash runtime-artifacts

      - name: Upload runtime artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-artifacts
          path: runtime-artifacts/
          retention-days: 5

      - name: Upload Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts
          path: |
            tests/test-results/
            tests/*.png
          retention-days: 5
