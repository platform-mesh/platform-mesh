name: test

# Unit tests for the changed components (as per ocm/components.yaml), the
# integration tests (tests/integration: components in-process against kcp test
# servers). The full-platform e2e on kind is e2e.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The changed-component list and the integration flag gate the jobs below,
  # so they come from a job of its own.
  changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.changes.outputs.components }}
      integration: ${{ steps.changes.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/changes
        id: changes

  # One job, not a matrix: every component is run even if an earlier one
  # fails; the failing ones are listed at the end.
  test:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unit tests
        env:
          COMPONENTS: ${{ needs.changes.outputs.components }}
        run: |
          set -euo pipefail
          failed=()
          for component in $(jq -r '.[]' <<<"$COMPONENTS"); do
            echo "::group::task test-$component"
            task "test-$component" || failed+=("$component")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error title=test::Unit tests failed for: ${failed[*]}. Reproduce with 'task test-<component>'."
            exit 1
          fi

  # tests/integration: the packages share one sharded kcp in Docker
  # (kcp-testcontainers) and run the components in-process.
  # `task test-integration` locally.
  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Root module unit tests (test framework)
        run: task test-root
      - name: Integration tests
        run: task test-integration
      - name: Upload kcp test server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kcp-logs
          path: tests/.test/**/*.log
          include-hidden-files: true # tests/.test is a hidden directory
          retention-days: 5
