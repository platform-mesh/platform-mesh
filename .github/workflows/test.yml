name: test

# Unit tests and component e2e suites for the changed components, as per
# ocm/components.yaml. Unit tests are one job; the e2e suites are a matrix
# (one entry per component) because each takes minutes and brings up its own
# kcp or kind. The full-platform e2e on kind is tilt.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The e2e matrix is built before the job starts, so the changed-component
  # list has to come from a job of its own.
  changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.changes.outputs.components }}
      e2eComponents: ${{ steps.changes.outputs.e2eComponents }}
      integration: ${{ steps.changes.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/changes
        id: changes

  # One job, not a matrix: every component is run even if an earlier one
  # fails; the failing ones are listed at the end.
  test:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unit tests
        env:
          COMPONENTS: ${{ needs.changes.outputs.components }}
        run: |
          set -euo pipefail
          failed=()
          for component in $(jq -r '.[]' <<<"$COMPONENTS"); do
            echo "::group::task test-$component"
            task "test-$component" || failed+=("$component")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error title=test::Unit tests failed for: ${failed[*]}. Reproduce with 'task test-<component>'."
            exit 1
          fi

  # Envtest suites against a shared kcp, or (platform-mesh-operator) a kind
  # cluster with the whole stack; see each component's `test-e2e` task.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2eComponents != '[]'
    # The platform-mesh-operator suite brings up the whole stack on kind, which
    # does not fit on the 4-vCPU default runner; the envtest suites do.
    runs-on: ${{ matrix.component == 'platform-mesh-operator' && 'ubuntu-latest-large' || 'ubuntu-latest' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.e2eComponents) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Local hostnames used by the kind-based suites
        run: |
          echo "127.0.0.1 portal.localhost" | sudo tee -a /etc/hosts
          echo "127.0.0.1 kcp.api.portal.localhost" | sudo tee -a /etc/hosts
          echo "127.0.0.1 root.kcp.portal.localhost" | sudo tee -a /etc/hosts
          echo "127.0.0.1 root.kcp.localhost" | sudo tee -a /etc/hosts
      - name: E2E tests
        run: task test-e2e-${COMPONENT}
        env:
          COMPONENT: ${{ matrix.component }}

  # tests/integration: every package boots a kcp sharded test server (the
  # server binds fixed ports, so packages run one at a time) and runs the
  # components in-process. `task test-integration` locally.
  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test framework unit tests
        run: task test-tests
      - name: Integration tests
        run: task test-integration
      - name: Upload kcp test server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kcp-test-server-logs
          path: tests/.test/**/*.log
          retention-days: 5
