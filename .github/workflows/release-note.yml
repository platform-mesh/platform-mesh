name: release-note

# Every PR description needs a ```release-note block holding NONE or the note
# (see .github/pull_request_template.md). Locally: `task verify-release-note`.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: release-note-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: hack/verify-release-note.sh
          sparse-checkout-cone-mode: false

      - name: verify-release-note
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: hack/verify-release-note.sh
