name: pr-gate

# Auto-merge gate for pull requests and merge queue. This allows for the repository
# to only have one single required job configured instead of having to maintain
# per-repository configuration on admin-level.

on:
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read # Needed for actions/checkout
  checks: read # Needed to read check-run results for the gate
  pull-requests: read # Needed to read PR metadata
  statuses: read # Needed to read commit statuses for the gate

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # With GH_REPO set the repository doesn't need to be cloned just to run the gh cli
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      # for merge group checks are looked up by the hash
      MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
      SELF_JOB: ${{ github.job }}
    steps:
      - name: pr-gate
        run: |
          set -euo pipefail

          sleep 30  # let workflows register their checks first

          # checks on the PR as a stream of {name, bucket}
          pr_checks() {
            gh pr checks "$PR" --json bucket,name --jq '.[]'
          }

          # checks on the merge queue commit as a stream of {name, bucket}, like pr_checks
          merge_group_checks() {
            gh api --paginate "repos/$GH_REPO/commits/$MERGE_GROUP_SHA/check-runs?per_page=100" \
              --jq '.check_runs[]
                | {
                    name,
                    bucket: (
                      if .status != "completed" then "pending"
                      elif .conclusion == "success" then "pass"
                      elif .conclusion == "skipped" or .conclusion == "neutral" then "skipping"
                      else "fail"
                      end
                    )
                  }'
          }

          # drops this job and renovate/ checks (e.g. stability-days)
          filter_checks() {
            jq 'select(.name != env.SELF_JOB) | select(.name | startswith("renovate/") | not)'
          }

          relevant_checks() {
            if [[ -n "$MERGE_GROUP_SHA" ]]; then
              merge_group_checks
            else
              pr_checks
            fi | filter_checks
          }

          pending_checks() {
            relevant_checks \
              | jq 'select(.bucket as $val | ["pass", "skipping", "fail"] | index($val) | not)'
          }

          are_checks_pending() {
            [[ "$(pending_checks | wc -l)" -gt 0 ]]
          }

          failed_checks() {
            relevant_checks | jq 'select(.bucket == "fail")'
          }

          are_any_failed() {
            [[ "$(failed_checks | wc -l)" -gt 0 ]]
          }

          while true; do
            if are_any_failed; then
              echo Some jobs failed, reporting failure
              exit 1
            fi
            if are_checks_pending; then
              echo Some jobs are still running, sleeping
              sleep 1
              continue
            fi
            break
          done

          echo All jobs finished, checking for failures
          if are_any_failed; then
            echo Some jobs failed, reporting failure
            exit 1
          fi
          echo No jobs failed, success!
