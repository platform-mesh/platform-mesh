name: pr-gate

# Auto-merge gate for pull requests and merge queue. This allows for the repository
# to only have one single required job configured instead of having to maintain
# per-repository configuration on admin-level.

on:
  merge_group:
  pull_request:
    types:
      - opened
      - edited # re-evaluate after the release-note check re-runs on a description edit
      - synchronize
      - reopened

permissions:
  contents: read # Needed for actions/checkout
  actions: read # Needed to list workflow runs for the gate

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
      SELF_WORKFLOW: ${{ github.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: hack/pr-gate.bash
          sparse-checkout-cone-mode: false

      - name: pr-gate
        run: |
          sleep 30  # let workflows register their checks first
          hack/pr-gate.bash
