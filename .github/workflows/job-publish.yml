name: publish

# Builds and publishes one Platform Mesh version from the calling workflow's
# checkout. Used by release.yml (for a vX.Y.Z tag) and prerelease.yml (for a
# -dev build of main); the only difference between the two is the version.
#
#   1. images     every component image from ocm/components.yaml, plus the
#                 images under <component>/images/<name>/, tagged v<version>,
#                 for linux/amd64 and linux/arm64, cosign-signed, with SBOMs
#                 attested to the image and published by
#                 hack/release/ocm-build-image as the OCM component
#                 github.com/platform-mesh/images/<component>:<version>
#   2. aggregate  the commands under hack/release/, one per directory:
#                 ocm-build-third-party <third_party dir>   wrappers
#                 ocm-build-chart <charts dir>              archive + component
#                 ocm-build-aggregate                       the aggregate
#                 github.com/platform-mesh/platform-mesh:<version>, all signed
#   3. verify     the published graph the way a consumer sees it
#   4. trivy      vulnerability scans of the images and SBOMs
#
# Nothing is tested here: the commit went through the verify-* workflows as a
# pull request. Published versions are immutable; a version that exists in the
# registry already makes the run fail.

on:
  workflow_call:
    inputs:
      version:
        description: "The Platform Mesh version to publish, without leading v"
        required: true
        type: string
      ref:
        description: "Commit to build (default: the commit the calling workflow runs for)"
        required: false
        type: string
        default: ""
    secrets:
      OCM_SIGNING_PRIVATE_KEY:
        description: "PEM private key the OCM components are signed with"
        required: true
      OCM_SIGNING_CERT:
        description: "Certificate matching OCM_SIGNING_PRIVATE_KEY; its CN is the signature name"
        required: true

permissions:
  contents: read

env:
  OCM_REPO: ghcr.io/${{ github.repository_owner }}
  # The signature name must equal the CN of the signing certificate.
  SIGNATURE: ${{ vars.OCM_SIGNATURE_NAME || 'platform-mesh.platform-mesh' }}

jobs:
  # ──────────────────────────────────────────────
  # Which images to build, from ocm/components.yaml.
  # ──────────────────────────────────────────────
  components:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.c.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: List image components
        id: c
        run: |
          set -euo pipefail
          images="$(yq -o=json -I=0 '[.components | to_entries | .[] | select(.value.image != null) | {"component": .key, "image": .value.image, "path": .value.path}]' ocm/components.yaml)"
          [ "$images" != "[]" ] && [ -n "$images" ] || { echo "::error::no image components found in ocm/components.yaml"; exit 1; }
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "$images" | jq -r '.[] | "- \(.component) (image \(.image), \(.path))"'

  # ──────────────────────────────────────────────
  # Component images: build, push, sign, SBOM, attest, OCM component.
  # A component's constructor may declare further images; they are built from
  # <path>/images/<name>/Dockerfile with that directory as context.
  # ──────────────────────────────────────────────
  image:
    needs: components
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the image and the component descriptor
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.components.outputs.images) }}
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/platform-mesh
      VERSION: ${{ inputs.version }}
      COMPONENT: ${{ matrix.component }}
      COMPONENT_DIR: ${{ matrix.path }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        # Writes images.txt, one "<name> <ref>@<digest>" per image.
        run: |
          set -euo pipefail
          task images-${COMPONENT} \
            VERSION=v${VERSION} \
            REPO=${GITHUB_REPOSITORY_OWNER}/platform-mesh \
            PLATFORMS=linux/amd64,linux/arm64 \
            PUSH=true \
            METADATA_FILE="${RUNNER_TEMP}/${COMPONENT}.json"
          echo "${COMPONENT} ${IMAGE_REPO}/${COMPONENT}@$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/${COMPONENT}.json")" >> images.txt
          for dockerfile in "${COMPONENT_DIR}"/images/*/Dockerfile; do
            [ -f "$dockerfile" ] || continue
            context="$(dirname "$dockerfile")"
            name="$(basename "$context")"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --push \
              --tag "${IMAGE_REPO}/${name}:v${VERSION}" \
              --metadata-file "${RUNNER_TEMP}/${name}.json" \
              "$context"
            echo "${name} ${IMAGE_REPO}/${name}@$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/${name}.json")" >> images.txt
          done
          cat images.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        id: syft
      - name: Sign images, generate and attest SBOMs
        # sbom/<name>/sbom-*.json is where the constructors' file inputs point.
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          while read -r name ref; do
            cosign sign --yes "$ref"
            mkdir -p "sbom/$name"
            "$SYFT" scan "registry:$ref" \
              --output "cyclonedx-json=sbom/$name/sbom-cyclonedx.json" \
              --output "spdx-json=sbom/$name/sbom-spdx.json"
            cosign attest --yes --type cyclonedx --predicate "sbom/$name/sbom-cyclonedx.json" "$ref"
            cosign attest --yes --type spdxjson --predicate "sbom/$name/sbom-spdx.json" "$ref"
          done < images.txt
      - name: OCM config (registry credentials + signing key)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCM_SIGNING_PRIVATE_KEY: ${{ secrets.OCM_SIGNING_PRIVATE_KEY }}
          OCM_SIGNING_CERT: ${{ vars.OCM_SIGNING_CERT }}
        run: |
          set -euo pipefail
          if [ -z "$OCM_SIGNING_PRIVATE_KEY" ] || [ -z "$OCM_SIGNING_CERT" ]; then
            echo "::error::OCM_SIGNING_PRIVATE_KEY / OCM_SIGNING_CERT secrets are not set"; exit 1
          fi
          hack/release/ocm-config.sh "$OCM_REPO" "$SIGNATURE" > "$HOME/.ocmconfig"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      - name: Install ocm (pinned in tools/Taskfile.yaml)
        run: |
          task tools:ocm
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Publish OCM component github.com/platform-mesh/images/${{ matrix.component }}
        env:
          PM_VERSION: ${{ inputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: go run ./hack/release/ocm-build-image "$COMPONENT_DIR" sbom

  # ──────────────────────────────────────────────
  # Charts, chart components, third-party wrappers, aggregate.
  # ──────────────────────────────────────────────
  aggregate:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push charts and OCM components
    env:
      PM_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      - name: Install ocm, helm, yq (pinned in tools/Taskfile.yaml)
        run: |
          task tools:ocm tools:helm tools:yq
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Registry credentials
        run: |
          set -euo pipefail
          if [ -z "$OCM_SIGNING_PRIVATE_KEY" ] || [ -z "$OCM_SIGNING_CERT" ]; then
            echo "::error::OCM_SIGNING_PRIVATE_KEY / OCM_SIGNING_CERT secrets are not set"; exit 1
          fi
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          hack/release/ocm-config.sh "$OCM_REPO" "$SIGNATURE" > "$HOME/.ocmconfig"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCM_SIGNING_PRIVATE_KEY: ${{ secrets.OCM_SIGNING_PRIVATE_KEY }}
          OCM_SIGNING_CERT: ${{ vars.OCM_SIGNING_CERT }}
      - name: Build and publish OCM components
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          go build -o bin/ ./hack/release/ocm-build-third-party ./hack/release/ocm-build-chart ./hack/release/ocm-build-aggregate
          for dir in third_party/*/; do ocm-build-third-party "${dir%/}"; done
          for chart_yaml in charts/*/Chart.yaml; do ocm-build-chart "${chart_yaml%/Chart.yaml}"; done
          ocm-build-aggregate

  # ──────────────────────────────────────────────
  # Check the published result the way a consumer would see it.
  # ──────────────────────────────────────────────
  verify:
    needs: aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the published components back for verification
    env:
      COMPONENT: github.com/platform-mesh/platform-mesh
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ocm, helm, yq (pinned in tools/Taskfile.yaml)
        run: |
          task tools:ocm tools:helm tools:yq
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Registry credentials (public key only, no signing key)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCM_SIGNING_CERT: ${{ vars.OCM_SIGNING_CERT }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          OCM_SIGNING_PRIVATE_KEY=unused hack/release/ocm-config.sh "$OCM_REPO" "$SIGNATURE" \
            | yq 'del(.configurations[].consumers[].credentials[].properties.private_key_pem)' > "$HOME/.ocmconfig"
      - name: Component graph
        run: |
          set -euo pipefail
          {
            echo "### Component graph of \`$COMPONENT:$VERSION\`"
            echo '```'
            ocm get component-version "$OCM_REPO//$COMPONENT:$VERSION" --recursive
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Signatures
        run: |
          set -euo pipefail
          # Everything in the graph at this version was built from this
          # repository by this run and must verify with our certificate;
          # components at other versions come from other repositories or
          # earlier runs and may carry other signatures.
          ocm get component-version "$OCM_REPO//$COMPONENT:$VERSION" --recursive -o json \
            | yq -r '.[].component | select(.version == strenv(VERSION)) | .name + ":" + .version' \
            | sort -u | while read -r cv; do
            ocm verify component-version --signature "$SIGNATURE" "$OCM_REPO//$cv" >/dev/null
            echo "verified $cv"
          done
      - name: Charts are installable
        run: |
          set -euo pipefail
          for chart in account-operator infra common; do
            helm pull "oci://$OCM_REPO/helm-charts/$chart" --version "$VERSION" --destination /tmp
            [ "$chart" = common ] || helm template "/tmp/$chart-$VERSION.tgz" >/dev/null
            echo "ok: $chart $VERSION"
          done

  # ──────────────────────────────────────────────
  # Vulnerability scans.
  # ──────────────────────────────────────────────
  trivy-image:
    needs: [components, image]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.components.outputs.images) }}
    uses: ./.github/workflows/job-trivy-image.yml
    permissions:
      contents: read
      packages: read # pull the image to scan
      security-events: write # upload the SARIF report
    with:
      imageRef: ghcr.io/${{ github.repository_owner }}/platform-mesh/${{ matrix.image }}:v${{ inputs.version }}

  trivy-sbom:
    needs: [components, image]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.components.outputs.images) }}
    uses: ./.github/workflows/job-trivy-sbom.yml
    permissions:
      contents: read
      packages: read # read the SBOM from the component
      security-events: write # upload the SARIF report
    with:
      componentName: github.com/platform-mesh/images/${{ matrix.component }}
      componentVersion: ${{ inputs.version }}
