name: verify

# Repo-wide checks, no path filter: the commits themselves (DCO), license
# headers, Go versions, and every generated file committed up to date. The
# per-component and per-chart checks live in go-lint.yml, helm-lint.yml and
# test.yml; pr-gate.yml aggregates them all.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # `task dco` walks BASE..HEAD: on a pull request the PR's own commits,
      # in the merge queue the commits being merged.
      BASE: origin/${{ github.base_ref || github.event.merge_group.base_ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # `task dco` needs the base branch and full commit history

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true # zizmor: ignore[cache-poisoning]

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Every commit on the branch needs a Signed-off-by matching its author.
      # The DCO app gates pull requests but not the merge queue, and running it
      # here means `task verify` locally catches the same thing before pushing.
      - name: DCO sign-off on every commit
        run: task dco BASE="${BASE}"
        if: ${{ !startsWith(github.event.pull_request.title, '[REBASE] ') }}

      # Missing headers are fixed locally with `task boilerplate-fix`.
      - name: License headers
        run: task boilerplate

      - name: Verify Go versions in go.mod files
        run: hack/verify-go-version.sh

      # Everything a generator writes: controller-gen CRDs, deepcopy, mocks,
      # apigen APIExports/APIResourceSchemas, the chart copies of the CRDs
      # (hack/charts/sync-crds.sh, run by `task generate`) and the helm-docs
      # READMEs. All components, not only the changed ones: a change in a shared
      # module (apis/) regenerates everyone.
      - name: Regenerate
        run: |
          task generate
          task charts:docs

      - name: Generated files must be committed
        run: |
          set -euo pipefail
          hint="Generated files are out of date. Run 'task generate' and 'task charts:docs', then commit the result (a changed *-crds chart also needs 'task charts:update-changed' for the snapshots). Renames of APIResourceSchemas (v<date>-<hash>.*) alone are ignored and need no commit."
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "generated files that are not committed:" >&2
            echo "$untracked" >&2
            echo "::error title=verify::$hint"
            exit 1
          fi
          # APIResourceSchema names carry a date and a hash of the schema
          # (v261030-566cb8a8.<resource>, 7+ hex chars; hack/apigen.sh). Names
          # written before that wrapper hash the HEAD commit instead and get
          # renamed once when their schema next regenerates; `-I` drops hunks
          # made only of such lines.
          if ! git diff --exit-code -I 'v[0-9]{6}-[0-9a-f]{7,}\.'; then
            echo "::error title=verify::$hint"
            exit 1
          fi
