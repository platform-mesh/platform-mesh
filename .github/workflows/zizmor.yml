name: Zizmor
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # FORK: schedule disabled to not burn runner minutes in the test fork; re-enable at cutover.
  # schedule:
  #   - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    uses: platform-mesh/.github/.github/workflows/job-zizmor.yml@12757bf1a9cfd4be410cfc58d3e1fbeb94bd9e2e # main
    with:
      persona: 'auditor'
    permissions:
      security-events: write # Needed to write to the GitHub Security tab
      contents: read # Needed to read repository contents
      actions: read # Needed to read GitHub Actions workflows
