name: e2e-diagnostics
description: >-
  Collects what is needed to see why an e2e job failed (hack/e2e/diagnostics.sh:
  cluster state, logs) and the Playwright traces, and uploads both.

inputs:
  name:
    description: Suffix for the artifact names (the job)
    required: true

runs:
  using: composite
  steps:
    - name: Dump cluster diagnostics
      shell: bash
      run: task e2e:diagnostics DIR=runtime-artifacts || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: runtime-artifacts-${{ inputs.name }}
        path: runtime-artifacts/
        retention-days: 5
        if-no-files-found: ignore
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-artifacts-${{ inputs.name }}
        path: |
          tests/test-results/
          tests/*.png
        retention-days: 5
        if-no-files-found: ignore
