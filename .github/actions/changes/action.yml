name: changes
description: >-
  Works out which components (as per ocm/components.yaml) and charts a pull
  request or merge group changed, via hack/release/changed-components.sh.
  Requires a checkout with fetch-depth 0 before (the base commit is diffed).

outputs:
  components:
    description: JSON array of changed components, libraries included
    value: ${{ steps.c.outputs.components }}
  e2eComponents:
    description: JSON array of changed components that have e2e tests
    value: ${{ steps.c.outputs.e2eComponents }}
  charts:
    description: JSON array of changed chart names (directories under charts/)
    value: ${{ steps.c.outputs.charts }}

runs:
  using: composite
  steps:
    - id: c
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      run: |
        set -euo pipefail
        hack/release/changed-components.sh "$(git diff --name-only "$BASE...HEAD")" | tee -a "$GITHUB_OUTPUT"
