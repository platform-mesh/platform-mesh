name: helm
description: >-
  Installs the helm version pinned in tools/Taskfile.yaml and puts a `helm`
  symlink on PATH (ct and Helm plugins invoke it by name). Requires task to be
  set up (arduino/setup-task) before.

outputs:
  path:
    description: Absolute path of the installed Helm binary
    value: ${{ steps.helm.outputs.path }}

runs:
  using: composite
  steps:
    - name: Install Helm
      id: helm
      shell: bash
      run: |
        set -euo pipefail
        HELM_BINARY="$(UGET_PRINT_PATH=absolute task tools:helm)"
        # ct needs a "helm" binary somewhere in $PATH
        sudo ln -sf "$HELM_BINARY" /usr/local/bin/helm
        # make the path available to the following steps
        echo "path=$HELM_BINARY" >> "$GITHUB_OUTPUT"
