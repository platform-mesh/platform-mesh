# Release assets of a Platform Mesh release, attached to the GitHub release:
#
#   pmctl_<version>_<os>_<arch>.tar.gz   the pmctl CLI
#   pmctl_<version>_checksums.txt        SHA-256 of the archives
#
# Images, charts and OCM components are not built here, job-publish.yml
# publishes them to the registry before this runs.
#
# Run through the tasks, which set the environment this file reads:
#
#   task release-snapshot                build everything into dist/, publish nothing
#   task release-publish NOTES=<file>    create the GitHub release (release.yml)
#
# Environment:
#
#   LDFLAGS                  linker flags stamping pmctl (`task pmctl-ldflags`)
#   GORELEASER_CURRENT_TAG   the release tag; set explicitly because the
#                            repository also carries library tags (<name>/vX.Y.Z)

version: 2

project_name: platform-mesh

builds:
  - id: pmctl
    main: ./cmd/pmctl
    binary: pmctl
    ldflags:
      - "{{ .Env.LDFLAGS }}"
    env:
      - CGO_ENABLED=0
      - GOFIPS140=certified
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: pmctl
    ids:
      - pmctl
    formats:
      - tar.gz
    name_template: "pmctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "pmctl_{{ .Version }}_checksums.txt"

# A snapshot is named after the version the task passes in, like a release.
snapshot:
  version_template: "{{ .Version }}"

release:
  name_template: "Platform Mesh {{ .Version }}"
  # vYY.MM.P-rc.N is a prerelease, vYY.MM.P is not.
  prerelease: auto
