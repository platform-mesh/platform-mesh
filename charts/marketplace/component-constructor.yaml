components:
  - name: github.com/platform-mesh/helm-charts/marketplace
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: chart
        type: helmChart
        relation: external
        version: ${PM_VERSION}
        access:
          type: OCIImage/v1
          imageReference: ${CHART_REPO}/marketplace:${PM_VERSION}
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
  - name: github.com/platform-mesh/marketplace
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
    componentReferences:
      - name: chart
        componentName: github.com/platform-mesh/helm-charts/marketplace
        version: ${PM_VERSION}
      - name: image
        componentName: github.com/platform-mesh/images/marketplace
        version: ${PM_VERSION}
