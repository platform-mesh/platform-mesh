components:
  - name: github.com/platform-mesh/helm-charts/observability
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: chart
        type: helmChart
        relation: external
        version: ${PM_VERSION}
        access:
          type: ociArtifact
          imageReference: ${CHART_REPO}/observability:${PM_VERSION}
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
  - name: github.com/platform-mesh/images/observability
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: otel-collector-image
        type: ociImage
        version: 0.153.0
        access:
          type: ociArtifact
          imageReference: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0
        relation: external
      - name: kubectl-image
        type: ociImage
        version: 1.0.0
        access:
          type: ociArtifact
          imageReference: docker.io/bitnami/kubectl:latest@sha256:a67b11e95e953f550f020a41970185ccc5f83d78b86b8c575d02c904aa0f9cd7
        relation: external
      - name: prometheus-server-image
        type: ociImage
        version: v3.11.3
        access:
          type: ociArtifact
          imageReference: quay.io/prometheus/prometheus:v3.11.3@sha256:c0b857aead0d5793aa566adb8f49a9983d6f6031652098759d521a330cfa050f
        relation: external
      - name: prometheus-config-reloader-image
        type: ociImage
        version: v0.91.0
        access:
          type: ociArtifact
          imageReference: quay.io/prometheus-operator/prometheus-config-reloader:v0.91.0@sha256:7d9e4eea5f1139e602508871f422b0116c60e87c662f3dcd234d5ab60cd0d8c1
        relation: external
  - name: github.com/platform-mesh/observability
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
    componentReferences:
      - name: chart
        componentName: github.com/platform-mesh/helm-charts/observability
        version: ${PM_VERSION}
      - name: image
        componentName: github.com/platform-mesh/images/observability
        version: ${PM_VERSION}
