suite: image localization
templates:
  - templates/otel-collector.yaml
  - templates/servicemonitors/kcp.yaml
release:
  name: observability
  namespace: observability
tests:
  - it: renders the otel-collector image from the split schema
    template: templates/otel-collector.yaml
    set:
      otelCollector.image.tag: "9.9.9-test"
    asserts:
      - equal:
          path: spec.image
          value: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:9.9.9-test
  - it: renders the otel-collector image tag- and digest-pinned when digest set
    template: templates/otel-collector.yaml
    set:
      otelCollector.image.tag: "9.9.9-test"
      otelCollector.image.digest: "sha256:deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
    asserts:
      - equal:
          path: spec.image
          value: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:9.9.9-test@sha256:deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
  - it: scrapes kcp with the kcp-operator client certificate
    template: templates/servicemonitors/kcp.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: platform-mesh-system
      - equal:
          path: spec.endpoints[0].tlsConfig.cert.secret.name
          value: kubeconfig-cert-metrics-viewer
      - equal:
          path: spec.endpoints[0].tlsConfig.cert.secret.key
          value: tls.crt
      - equal:
          path: spec.endpoints[0].tlsConfig.keySecret.name
          value: kubeconfig-cert-metrics-viewer
      - equal:
          path: spec.endpoints[0].tlsConfig.keySecret.key
          value: tls.key
  - it: renders the cert-extractor image digest-pinned
    template: templates/kcp-metrics-cert-job.yaml
    documentIndex: 5
    asserts:
      - equal:
          path: kind
          value: Job
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^docker\.io/bitnami/kubectl@sha256:[a-f0-9]{64}$
