{{- if .Values.serviceMonitors.pmOpenfgaOperator.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pm-openfga-operator
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.serviceMonitors.pmOpenfgaOperator.namespace }}
  selector:
    matchLabels:
      {{- toYaml .Values.serviceMonitors.pmOpenfgaOperator.labels | nindent 6 }}
  endpoints:
    - port: {{ .Values.serviceMonitors.pmOpenfgaOperator.port }}
      path: {{ .Values.serviceMonitors.pmOpenfgaOperator.path }}
{{- end }}
