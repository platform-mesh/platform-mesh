{{- if .Values.serviceMonitors.kcp.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kcp
  # prometheus-operator resolves tlsConfig secrets in the ServiceMonitor's own
  # namespace, so the monitor sits where the client certificate is issued.
  namespace: {{ .Values.serviceMonitors.kcp.namespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.serviceMonitors.kcp.namespace }}
  selector:
    matchLabels:
      {{- toYaml .Values.serviceMonitors.kcp.labels | nindent 6 }}
  endpoints:
    - port: {{ .Values.serviceMonitors.kcp.port }}
      path: {{ .Values.serviceMonitors.kcp.path }}
      {{- if .Values.serviceMonitors.kcp.scheme }}
      scheme: {{ .Values.serviceMonitors.kcp.scheme }}
      {{- end }}
      tlsConfig:
        insecureSkipVerify: {{ .Values.serviceMonitors.kcp.tlsInsecureSkipVerify | default false }}
        # kcp-operator issues the client certificate of a Kubeconfig into a
        # secret named "kubeconfig-cert-<Kubeconfig name>".
        cert:
          secret:
            name: kubeconfig-cert-{{ .Values.serviceMonitors.kcp.kubeconfig.name }}
            key: tls.crt
        keySecret:
          name: kubeconfig-cert-{{ .Values.serviceMonitors.kcp.kubeconfig.name }}
          key: tls.key
{{- end }}
