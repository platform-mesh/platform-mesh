set:
  exposure.baseDomain: example.com
suite: Test Kubernetes Gateway API
values:
- ../values.yaml
- ../test_values.yaml
release:
  name: kubernetes-graphql-gateway
  namespace: platform-mesh-system
chart:
  appVersion: 1.0.0
templates:
  - httproute.yaml
tests:
  - it: HTTPRoute matches snapshot
    asserts:
      - matchSnapshot: {}
  - it: uses the explicit route hostnames
    set:
      gatewayApi.enabled: true
      gatewayApi.httpRoute.enabled: true
      gatewayApi.httpRoute.hostnames:
      - custom.example.net
    asserts:
    - equal:
        path: spec.hostnames
        value:
        - custom.example.net
    template: httproute.yaml
