apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.entity.name" . }}-initializer
  namespace: {{ .Release.Namespace }}
spec:
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  selector:
    matchLabels:
      service: {{ include "common.entity.name" . }}-initializer
  template:
    metadata:
      labels:
        service: {{ include "common.entity.name" . }}-initializer
        control-plane: controller-manager
    spec:
      {{- include "common.pod.securityContext" . | indent 6 }}
      terminationGracePeriodSeconds: {{ include "common.terminationGracePeriodSeconds" .}}
      {{ include "common.hostAliases" $ | nindent 6 }}
      containers:
      - {{- include "common.podBasics" . | indent 8 }}
        {{- include "common.container.securityContext" . | indent 8 }}
        {{- include "common.operatorHealthAndReadiness" . | indent 8}}
        ports:
        {{- include "common.PortsMetricsHealth" . | nindent 10 }}
        args:
          - initializer
          - --core-module-path=/data/coreModule.fga
          {{- include "security-operator.featureGates" . | indent 10 }}
          - --fga-target={{ .Values.openfga.endpoint }}
          {{- if .Values.initializer.kubeconfigSecret }}
          - --kcp-kubeconfig=/api-kubeconfig/kubeconfig
          {{- end }}
          {{- if not .Values.initializer.subroutines.workspaceEnabled }}
          - --initializer-workspace-enabled=false
          {{- end }}
          {{- with .Values.openfga.storeIDCacheTTL }}
          - --fga-store-id-cache-ttl={{ . }}
          {{- end }}
          {{- with .Values.initializer.extraArgs }}
          {{ toYaml . | nindent 10}}
          {{- end }}
          {{- include "common.commonOperatorArgs" . | indent 8 }}
        env:
        {{- include "common.basicEnvironment" . | nindent 10 }}
        volumeMounts:
          {{- include "common.extraVolumeMounts" . | nindent 10 }}
          {{- if .Values.initializer.kubeconfigSecret }}
          - name: external-api-server
            mountPath: /api-kubeconfig
          {{- end }}
          - name: core-module
            mountPath: /data
      volumes:
        {{- include "common.extraVolumes" . | nindent 8 }}
        {{- if .Values.initializer.kubeconfigSecret }}
        - name: external-api-server
          secret:
            secretName: {{ .Values.initializer.kubeconfigSecret }}
        {{- end }}
        - name: core-module
          configMap:
            name: {{ include "common.entity.name" . }}-core-module
