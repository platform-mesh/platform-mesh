suite: operator
chart:
  version: 1.0.0
  appVersion: 1.0.0
tests:
  - it: operator match the snapshot
    set:
      kubeconfigSecret: kcp-kubeconfig
      initializer:
        extraArgs:
          - --test=myval
          - --test2=myval
        kubeconfigSecret: kcp-initializer-kubeconfig
      terminator:
        kubeconfigSecret: kcp-terminator-kubeconfig
    asserts:
      - matchSnapshot: {}
  - it: operator match the snapshot w. sentry
    set:
      sentry:
        enabled: true
      externalSecrets:
        enabled: true
      extraEnvs:
        - name: TEST_ENV
          value: test
      extraVolumes:
        - name: kcp-kubeconfig
          secret:
            secretName: kcp-kubeconfig
      extraVolumeMounts:
        - name: kcp-kubeconfig
          mountPath: /etc/kcp-kubeconfig
          readOnly: true
    asserts:
      - matchSnapshot: {}
  - it: has all health checks
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /readyz
  - it: renders feature gates from values
    set:
      featureGates:
        OpenFGA: false
        Keycloak: true
    templates:
      - deployment.yaml
      - system-deployment.yaml
      - initializer-deployment.yaml
      - terminator-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=Keycloak=true,OpenFGA=false
  - it: keycloak disabled turns the gate off and drops every keycloak object
    set:
      keycloak:
        enabled: false
        baseUrl: https://keycloak.example.com
      featureGates:
        Keycloak: true
      kubeconfigSecret: kcp-kubeconfig
    templates:
      - deployment.yaml
      - system-deployment.yaml
      - initializer-deployment.yaml
      - terminator-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=Keycloak=false
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --keycloak-base-url=https://keycloak.example.com
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --webhooks-enabled=true
      - notExists:
          path: spec.template.spec.initContainers
      - notMatchRegexRaw:
          pattern: KEYCLOAK_CLIENT_SECRET|keycloak-credentials|keycloak-password|bootstrap-keycloak-clients
  - it: keycloak disabled renders no webhook or init container objects
    set:
      keycloak:
        enabled: false
      webhooks:
        register: true
    templates:
      - webhook/pki.yaml
      - webhook/service.yaml
      - webhook/validating-webhook.yaml
      - init-container-config.yaml
    asserts:
      - hasDocuments:
          count: 0
