apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.entity.name" . }}-initializer
  namespace: {{ .Release.Namespace }}
spec:
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  selector:
    matchLabels:
      service: {{ include "common.entity.name" . }}-initializer
  template:
    metadata:
      labels:
        service: {{ include "common.entity.name" . }}-initializer
        control-plane: controller-manager
    spec:
      {{- include "common.pod.securityContext" . | indent 6 }}
      terminationGracePeriodSeconds: {{ include "common.terminationGracePeriodSeconds" .}}
      {{ include "common.hostAliases" $ | nindent 6 }}
      containers:
      - {{- include "common.podBasics" . | indent 8 }}
        {{- include "common.container.securityContext" . | indent 8 }}
        {{- include "common.operatorHealthAndReadiness" . | indent 8}}
        ports:
        {{- include "common.PortsMetricsHealth" . | nindent 10 }}
        args:
          - initializer
          {{- include "pm-keycloak-operator.featureGates" . | indent 10 }}
          {{- include "pm-keycloak-operator.keycloakArgs" . | indent 10 }}
          {{- with .Values.jwt.userIdClaim }}
          - --user-claim={{ . }}
          {{- end }}
          {{- if .Values.initializer.kubeconfigSecret }}
          - --kcp-kubeconfig=/api-kubeconfig/kubeconfig
          {{- end }}
          {{- if not .Values.initializer.subroutines.idpEnabled }}
          - --initializer-idp-enabled=false
          {{- end }}
          {{- if not .Values.initializer.subroutines.inviteEnabled }}
          - --initializer-invite-enabled=false
          {{- end }}
          {{- if not .Values.initializer.subroutines.workspaceAuthEnabled }}
          - --initializer-workspace-auth-enabled=false
          {{- end }}
          {{- if .Values.domainCALookup }}
          - --domain-ca-lookup
          {{- end }}
          {{- with .Values.idp.additionalRedirectUrls }}
          - --idp-additional-redirect-urls={{ join "," . }}
          {{- end }}
          {{- if .Values.idp.registrationAllowed }}
          - --idp-registration-allowed
          {{- end }}
          {{- if .Values.idp.allowUnverifiedEmails }}
          - --development-allow-unverified-emails
          {{- end }}
          {{- with .Values.initializer.extraArgs }}
          {{ toYaml . | nindent 10}}
          {{- end }}
          {{- include "common.commonOperatorArgs" . | indent 8 }}
        env:
        {{- include "common.basicEnvironment" . | nindent 10 }}
        volumeMounts:
          {{- include "common.extraVolumeMounts" . | nindent 10 }}
          {{- if .Values.initializer.kubeconfigSecret }}
          - name: external-api-server
            mountPath: /api-kubeconfig
          {{- end }}
      volumes:
        {{- include "common.extraVolumes" . | nindent 8 }}
        {{- if .Values.initializer.kubeconfigSecret }}
        - name: external-api-server
          secret:
            secretName: {{ .Values.initializer.kubeconfigSecret }}
        {{- end }}
