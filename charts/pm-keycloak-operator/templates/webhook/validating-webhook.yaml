{{- if and .Values.webhooks.enabled .Values.webhooks.register -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "common.clusterScoped.affix" (dict "context" . "name" (printf "%s-validating-webhook-configuration" (include "common.entity.name" .))) }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "common.entity.name" . }}-serving-cert
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "common.entity.name" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: "/validate-keycloak-platform-mesh-io-v1alpha1-identityproviderconfiguration"
      port: {{ .Values.webhooks.port }}
  failurePolicy: Fail
  name: vidp.kb.io
  rules:
  - apiGroups:
    - keycloak.platform-mesh.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - identityproviderconfigurations
  sideEffects: None
{{- if include "pm-keycloak-operator.legacyAPIs" . }}
# Deprecated core.platform-mesh.io kind, served while LegacyAPIs is on.
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "common.entity.name" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: "/validate-core-platform-mesh-io-v1alpha1-identityproviderconfiguration"
      port: {{ .Values.webhooks.port }}
  failurePolicy: Fail
  name: vlegacyidp.kb.io
  rules:
  - apiGroups:
    - core.platform-mesh.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - identityproviderconfigurations
  sideEffects: None
{{- end }}
{{- end -}}
