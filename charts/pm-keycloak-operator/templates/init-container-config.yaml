{{- if .Values.initContainer.enabled }}
{{- $_ := required "exposure.baseDomain is required" .Values.exposure.baseDomain -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.entity.name" . }}-init-container-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    {{- if .Values.keycloak.baseUrl }}
    keycloakBaseURL: {{ .Values.keycloak.baseUrl | quote }}
    {{- else }}
    keycloakBaseURL: "{{ .Values.exposure.protocol }}://{{ .Values.exposure.baseDomain }}{{ .Values.exposure.normalizedPort }}/keycloak"
    {{- end }}
    keycloakClientID: {{ .Values.initContainer.keycloakClientId | quote }}
    keycloakUser: {{ .Values.initContainer.keycloakUser | quote }}
    passwordFile: "/secrets/keycloak-password"
    clients:
    {{- range .Values.initContainer.clients }}
      - name: {{ .name | quote }}
        secretRef:
          name: {{ .secretRef.name | quote }}
          namespace: {{ .secretRef.namespace | quote }}
    {{- end }}
{{- end }}
