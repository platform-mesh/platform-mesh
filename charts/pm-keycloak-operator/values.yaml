image:
  # -- The image registry
  registry: ghcr.io
  # -- The image repository path (without registry)
  repository: platform-mesh/platform-mesh/pm-keycloak-operator
  # -- The image digest (when set, overrides tag: registry/repository@digest)
  digest: ""

# -- environment indicator, used for logging and observability
environment: ""
# -- region indicator, used for logging and observability
region: ""

deployment:
  # -- Number of old ReplicaSets to retain for rollback
  revisionHistoryLimit: 3
  resources:
    limits:
      cpu: 260m
      memory: 512Mi
    requests:
      cpu: 150m
      memory: 128Mi

# -- Log level for all operator components. Permissible values: debug, info, warn, error
logLevel: info

# -- Feature gates rendered into --feature-gates. Known gates: LegacyAPIs (default true; also serves the deprecated core.platform-mesh.io IdentityProviderConfigurations and Invites).
featureGates: {}

webhooks:
  # -- Enable validating admission webhooks
  enabled: true

  # -- Register the ValidatingWebhookConfiguration resources
  register: false

  # -- Webhook server port (must match controller-runtime webhook server)
  port: 9443

  # -- The directory for webhook certificates (mounted from the serving cert secret)
  certDir: /certs

  # -- CA certificate duration (default: 3 months)
  caDuration: 2160h
  # -- CA certificate renewal time before expiration (default: 30 days)
  caRenewBefore: 720h
  # -- Serving certificate duration (default: 3 months)
  certDuration: 2160h
  # -- Serving certificate renewal time before expiration (default: 30 days)
  certRenewBefore: 720h

# -- The kubeconfig secret for the operator
kubeconfigSecret: ""

# -- Name of the secret containing Keycloak admin credentials (keys: username, password, secret)
keycloakSecret: "keycloak-admin"
# -- Name of the secret containing the CA certificate for outbound TLS trust (key: tls.crt or ca.crt)
caSecret: ""

# -- Enable domain CA lookup for TLS verification on kcp side
domainCALookup: true

# -- Base domain of the platform deployment (e.g. platform.example.com). Used to derive internal service URLs when explicit URLs are not set. Required.
baseDomain: ""

# JWT configuration
jwt:
  userIdClaim: "email"

# Identity provider configuration. This is MUST be set for email verification to work
idp:
  smtp:
    # -- SMTP server hostname
    server: ""
    # -- SMTP server port
    port: ""
    # -- Email address used as the sender for IDP notifications
    fromAddress: ""
  # -- Additional redirect URLs to allow for OAuth clients (e.g. for local development callbacks)
  additionalRedirectUrls: []
  # -- (Development only) Allow self-registration of new users via IDP. Must be false in production.
  registrationAllowed: false
  # -- (Development only) Allow login without email verification. Must be false in production.
  allowUnverifiedEmails: false
  # -- (Development only) Set a default password for new users. Must be false in production.
  setDefaultPassword: false


keycloak:
  # -- base URL of the Keycloak instance (e.g. https://example.com/keycloak). Required.
  baseUrl: ""
  client:
    secret:
      name: pm-keycloak-operator-client-secret
      key: client_secret

initializer:
  # -- The kubeconfig secret for the initializer
  kubeconfigSecret: "keycloak-initializer-kubeconfig"
  extraArgs: []
  subroutines:
    # -- Enable IDPSubroutine (Keycloak identity provider configuration)
    idpEnabled: true
    # -- Enable InviteSubroutine (creates Invite resources for org creator)
    inviteEnabled: true
    # -- Enable WorkspaceAuthConfigurationSubroutine (JWT authentication setup)
    workspaceAuthEnabled: true

terminator:
  # -- The kubeconfig secret for the terminator
  kubeconfigSecret: "keycloak-terminator-kubeconfig"
  extraArgs: []

# -- Init container configuration for bootstrapping Keycloak service account clients
initContainer:
  # -- Enable the init container
  enabled: true
  # -- Keycloak base URL (e.g., https://keycloak.example.com). If empty, derived from baseDomain.
  keycloakBaseURL: ""
  # -- Keycloak client ID for admin authentication
  keycloakClientId: admin-cli
  # -- Keycloak username for admin authentication
  keycloakUser: keycloak-admin
  # -- Service account clients to create (beyond the default one from keycloak.client.secret)
  clients:
  - name: pm-keycloak-operator
    secretRef:
      name: pm-keycloak-operator-client-secret
      namespace: platform-mesh-system
  - name: iam-service
    secretRef:
      name: iam-client-secret
      namespace: platform-mesh-system

operator:
  extraArgs: []

# Staged KRM provider controller. Keep disabled until legacy realm ownership has
# been migrated and the IdentityProviderClass is installed in KCP.
provider:
  # -- Deploy the provider-neutral IdentityTenant reconciler. Requires featureGates.LegacyAPIs=false; enable only after legacy ownership is fenced or migrated.
  enabled: false
  # -- Kubeconfig Secret for a least-privilege KCP identity API service account (key: kubeconfig).
  kubeconfigSecret: "pm-keycloak-identity-provider-kubeconfig"
  # -- Trusted workspace containing IdentityProviderClass and Welcome IdentityTenant resources.
  classWorkspace: root:platform-mesh-system
  # -- Trusted workspace containing organization IdentityTenant and Invitation resources.
  organizationWorkspace: root:orgs
  # -- IdentityProviderClass name selected for this provider runtime.
  className: default
  # -- Platform-owned identity APIExportEndpointSlice name.
  endpointSlice: identity.platform-mesh.io
  # -- Maximum duration of one provider reconciliation.
  requestTimeout: 30s
  # -- Periodic provider state and configuration resync interval.
  resyncInterval: 30s
  extraArgs: []

# Staged OIDC directory endpoint. Keep disabled until IAM uses the provider-
# neutral directory contract and the workload/KCP identities are provisioned.
directory:
  # -- Deploy the opt-in mTLS identity directory backed by the selected provider.
  enabled: false
  # -- Dedicated KCP service identity Secret (key: kubeconfig).
  kubeconfigSecret: "pm-keycloak-identity-directory-kubeconfig"
  # -- TLS serving certificate Secret (keys: tls.crt, tls.key).
  tlsSecret: ""
  # -- CA bundle Secret trusted for directory callers (key: ca.crt).
  clientCASecret: ""
  # -- Optional provider-specific CA Secret (key: ca.crt).
  providerCASecret: ""
  # -- Trusted workspace containing IdentityProviderClass resources.
  classWorkspace: root:platform-mesh-system
  # -- IdentityProviderClass name selected for this provider runtime.
  className: default
  # -- Exact SPIFFE identities permitted to call the directory.
  allowedWorkloads: []
  # -- Immutable KCP logical cluster IDs permitted to query the directory.
  allowedTenantClusters: []
  # -- Explicitly permit the allowed workloads to query dynamic organization clusters.
  allowAnyTenantCluster: false
  # -- Maximum duration of one directory request.
  requestTimeout: 30s

hostAliases:
  enabled: false

clusterScopedName:
  # -- Prefix for the names of cluster-scoped resources (ClusterRoles, ClusterRoleBindings, webhook configurations), so several installations can share a cluster. A global.clusterScopedName value takes precedence over this one
  prefix: ""
  # -- Suffix for the names of cluster-scoped resources
  suffix: ""
