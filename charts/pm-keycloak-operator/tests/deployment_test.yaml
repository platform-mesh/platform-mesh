set:
  exposure.baseDomain: example.com
suite: operator
chart:
  version: 1.0.0
  appVersion: 1.0.0
tests:
  - it: operator matches the snapshot
    set:
      kubeconfigSecret: kcp-kubeconfig
      initializer:
        extraArgs:
          - --test=myval
          - --test2=myval
        kubeconfigSecret: kcp-initializer-kubeconfig
      terminator:
        kubeconfigSecret: kcp-terminator-kubeconfig
    asserts:
      - matchSnapshot: {}
  - it: operator matches the snapshot w. sentry
    set:
      sentry:
        enabled: true
      externalSecrets:
        enabled: true
      extraEnvs:
        - name: TEST_ENV
          value: test
      extraVolumes:
        - name: kcp-kubeconfig
          secret:
            secretName: kcp-kubeconfig
      extraVolumeMounts:
        - name: kcp-kubeconfig
          mountPath: /etc/kcp-kubeconfig
          readOnly: true
    asserts:
      - matchSnapshot: {}
  - it: has all health checks
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /readyz
  - it: renders feature gates from values
    set:
      featureGates:
        LegacyAPIs: false
    templates:
      - deployment.yaml
      - initializer-deployment.yaml
      - terminator-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=LegacyAPIs=false
  - it: renders no feature gates by default
    templates:
      - deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=LegacyAPIs=true
  - it: registers the legacy webhook rule only while LegacyAPIs is on
    set:
      webhooks:
        register: true
    template: webhook/validating-webhook.yaml
    asserts:
      - lengthEqual:
          path: webhooks
          count: 2
  - it: drops the legacy webhook rule with LegacyAPIs=false
    set:
      webhooks:
        register: true
      featureGates:
        LegacyAPIs: false
    template: webhook/validating-webhook.yaml
    asserts:
      - lengthEqual:
          path: webhooks
          count: 1
  - it: uses normalized exposure port consistently for Keycloak arguments
    set:
      exposure.protocol: https
      exposure.port: 8443
      exposure.normalizedPort: ":8443"
    asserts:
    - contains:
        path: spec.template.spec.containers[0].args
        content: --keycloak-base-url=https://example.com:8443/keycloak
    - contains:
        path: spec.template.spec.containers[0].args
        content: --base-domain=example.com:8443
    template: deployment.yaml
  - it: retains the explicit Keycloak endpoint
    set:
      keycloak.baseUrl: https://identity.example.net/keycloak
    asserts:
    - contains:
        path: spec.template.spec.containers[0].args
        content: --keycloak-base-url=https://identity.example.net/keycloak
    template: deployment.yaml
  - it: init-container uses the shared Keycloak endpoint
    set:
      keycloak.baseUrl: https://shared.example.net/keycloak
      initContainer.enabled: true
    asserts:
    - matchRegex:
        path: data["config.yaml"]
        pattern: 'keycloakBaseURL: "https://shared\.example\.net/keycloak"'
    template: init-container-config.yaml
  - it: init-container derives the endpoint using normalized exposure port
    set:
      exposure.port: 8443
      exposure.normalizedPort: ":8443"
      initContainer.enabled: true
    asserts:
    - matchRegex:
        path: data["config.yaml"]
        pattern: 'keycloakBaseURL: "https://example\.com:8443/keycloak"'
    template: init-container-config.yaml
