suite: access-vw
chart:
  appVersion: 0.1.1
release:
  name: access-vw
  namespace: platform-mesh-system
# What the platform-mesh operator supplies.
set:
  exposure:
    baseDomain: example.com
    port: 8443
tests:
  - it: matches snapshot (defaults, provider openfga)
    asserts:
      - matchSnapshot: {}

  - it: matches snapshot (provider rbac)
    set:
      provider: rbac
    asserts:
      - matchSnapshot: {}

  - it: defaults to the OpenFGA provider
    template: templates/virtualworkspace.yaml
    asserts:
      - contains:
          path: spec.extraArgs
          content: --provider=openfga

  - it: derives the external address from the exposure
    template: templates/virtualworkspace.yaml
    asserts:
      - equal:
          path: spec.external.hostname
          value: kcp.api.example.com
      - equal:
          path: spec.external.port
          value: 8443
      - contains:
          path: spec.extraArgs
          content: --endpoint-base=https://kcp.api.example.com:8443/clusters/

  - it: needs an external hostname or a base domain
    set:
      exposure:
        baseDomain: ""
    asserts:
      - failedTemplate:
          errorMessage: external.hostname or exposure.baseDomain is required

  - it: virtualworkspace has correct image
    template: templates/virtualworkspace.yaml
    asserts:
      - equal:
          path: spec.image.repository
          value: ghcr.io/platform-mesh/platform-mesh/access-virtual-workspaces
      - equal:
          path: spec.image.tag
          value: "0.1.1"

  - it: derives endpoint-base from external address
    template: templates/virtualworkspace.yaml
    set:
      external:
        hostname: kcp.portal.localhost
        port: 8443
    asserts:
      - contains:
          path: spec.extraArgs
          content: --endpoint-base=https://kcp.portal.localhost:8443/clusters/

  - it: explicit endpointBase wins
    template: templates/virtualworkspace.yaml
    set:
      server:
        endpointBase: https://elsewhere.example.com/clusters/
    asserts:
      - contains:
          path: spec.extraArgs
          content: --endpoint-base=https://elsewhere.example.com/clusters/

  - it: renders hostAliases into the deployment template
    template: templates/virtualworkspace.yaml
    set:
      hostAliases:
        enabled: true
        entries:
          - ip: 10.96.0.10
            hostnames: [kcp.portal.localhost]
    asserts:
      - equal:
          path: spec.deploymentTemplate.spec.template.spec.hostAliases[0].ip
          value: 10.96.0.10

  - it: renders no hostAliases unless enabled
    template: templates/virtualworkspace.yaml
    set:
      hostAliases:
        entries:
          - ip: 10.96.0.10
            hostnames: [kcp.portal.localhost]
    asserts:
      - notExists:
          path: spec.deploymentTemplate

  - it: provider openfga passes the OpenFGA flags and bootstraps nothing
    template: templates/virtualworkspace.yaml
    set:
      provider: openfga
      openfga:
        relation: update
        orgsWorkspace: root:tenants
    asserts:
      - contains:
          path: spec.extraArgs
          content: --provider=openfga
      - contains:
          path: spec.extraArgs
          content: --openfga-addr=openfga.platform-mesh-system.svc.cluster.local:8081
      - contains:
          path: spec.extraArgs
          content: --openfga-relation=update
      - contains:
          path: spec.extraArgs
          content: --openfga-object-type=core_platform-mesh_io_account
      - contains:
          path: spec.extraArgs
          content: --openfga-orgs-workspace=root:tenants
      - notContains:
          path: spec.extraArgs
          content: --apiexport-endpointslice=access.platform-mesh.io
      - notExists:
          path: spec.initContainers

  - it: provider openfga takes an explicit OpenFGA address
    template: templates/virtualworkspace.yaml
    set:
      provider: openfga
      openfga:
        addr: fga.example.com:8081
    asserts:
      - contains:
          path: spec.extraArgs
          content: --openfga-addr=fga.example.com:8081

  - it: provider openfga mints only the server identity, with groups and no target workspace
    template: templates/kubeconfig.yaml
    set:
      provider: openfga
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: access-vw-server
      - equal:
          path: spec.groups
          value: [system:kcp:admin]
      - notExists:
          path: spec.targetWorkspace

  - it: provider rbac keeps the server identity without groups
    template: templates/kubeconfig.yaml
    set:
      provider: rbac
    documentIndex: 1
    asserts:
      - equal:
          path: spec.targetWorkspace
          value: root:access:controllers
      - notExists:
          path: spec.groups

  - it: rejects an unknown provider
    set:
      provider: ldap
    asserts:
      - failedTemplate:
          errorMessage: provider must be rbac, openfga or both separated by a comma, got "ldap"

  - it: both providers pass the flags of both and bootstrap for rbac
    template: templates/virtualworkspace.yaml
    set:
      provider: rbac, openfga
    asserts:
      - contains:
          path: spec.extraArgs
          content: --provider=rbac,openfga
      - contains:
          path: spec.extraArgs
          content: --apiexport-endpointslice=access.platform-mesh.io
      - contains:
          path: spec.extraArgs
          content: --openfga-addr=openfga.platform-mesh-system.svc.cluster.local:8081
      - equal:
          path: spec.initContainers[0].name
          value: init

  - it: both providers give the server identity the target workspace and the groups
    template: templates/kubeconfig.yaml
    set:
      provider: rbac,openfga
    documentIndex: 1
    asserts:
      - equal:
          path: spec.targetWorkspace
          value: root:access:controllers
      - equal:
          path: spec.groups
          value: [system:kcp:admin]

  - it: registers the virtual workspace with the GraphQL gateway
    template: templates/clusteraccess.yaml
    asserts:
      - isKind:
          of: ClusterAccess
      - equal:
          path: metadata.name
          value: access
      - equal:
          path: spec.requestPathTemplate
          value: /clusters/{clusterTarget}
      - equal:
          path: spec.introspectionPath
          value: /clusters/*
      - equal:
          path: spec.auth.kubeconfigSecretRef
          value:
            name: access-vw-clusteraccess-kubeconfig
            namespace: platform-mesh-system
            key: kubeconfig
      - notExists:
          path: spec.path

  - it: renders no ClusterAccess when disabled
    template: templates/clusteraccess.yaml
    set:
      clusterAccess:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
