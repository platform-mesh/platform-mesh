image:
  # -- The image registry
  registry: ghcr.io
  # -- The image repository path (without registry)
  repository: platform-mesh/platform-mesh/iam-service
  # -- The image digest (when set, overrides tag: registry/repository@digest)
  digest: ""
  pullPolicy: IfNotPresent

log:
  # -- Disable JSON log formatting
  noJson: true

health:
  port: 8080

exposure:
  # -- Public hostname without protocol or port. Required for public resources; the platform-mesh operator supplies it from PlatformMesh.spec.exposure.
  baseDomain: ""
  protocol: https
  # -- Public port.
  port: 443
  # -- URL port string derived by the platform-mesh operator from protocol and port: empty for HTTP/80 or HTTPS/443, otherwise ":<port>".
  normalizedPort: ""

gatewayApi:
  httpRoute:
    # -- Explicit route hostnames; empty uses exposure.baseDomain and its wildcard.
    hostnames: []
    pathPrefix: /iam/graphql
    parentRefs:
      - name: k8sapi-gateway
    # -- list of HTTPRoute filters (default: URLRewrite only, no CORS)
    filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: /graphql

port: 8080

kcp:
  kubeconfig:
    secretName: iam-service-kubeconfig

caSecret: "domain-certificate"

hostAliases:
  enabled: false

openfga:
  endpoint: openfga.platform-mesh-system.svc.cluster.local:8081

idm:
  # -- Identity provider integration: keycloak, or none to run without a user directory. With none the keycloak values are ignored and the client secret is not needed.
  provider: keycloak

keycloak:
  # -- Explicit Keycloak base URL for an external identity provider; empty derives the public URL plus /keycloak when exposure.baseDomain is set. Required without a base domain.
  baseUrl: ""
  client:
    id: iam-service
    secret:
      name: iam-client-secret
      key: client_secret

# JWT configuration
jwt:
  userIdClaim: "email"

roles:
  raw:
    roles:
    - groupResource: core.platform-mesh.io/Account
      roles:
        - id: owner
          displayName: Owner
          description: Full access to all resources within the account.
        - id: member
          displayName: Member
          description: Limited access to resources within the account. Can view and interact with resources but cannot administrate them.
    - groupResource: Namespace
      roles:
        - id: owner
          displayName: Owner
          description: Full access to all resources within the account.
        - id: member
          displayName: Member
          description: Limited access to resources within the account. Can view and interact with resources but cannot administrate them.
