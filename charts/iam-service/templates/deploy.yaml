apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.entity.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "common.entity.name" . }}
spec:
  selector:
    matchLabels:
      app: {{ include "common.entity.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "common.entity.name" . }}
    spec:
      serviceAccountName: {{ include "common.entity.name" . }}
      {{- include "common.imagePullSecret" . | indent 6}}
      containers:
      - name: {{ include "common.entity.name" . }}
        {{- include "common.healthAndReadiness" . | indent 8 }}
        image: {{ include "common.image" .}}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.identityDirectory.enabled }}
        {{- if not .Values.identityDirectory.endpoint }}
        {{- fail "identityDirectory.endpoint is required when identityDirectory.enabled is true" }}
        {{- end }}
        {{- if not .Values.identityDirectory.clientTLSSecret }}
        {{- fail "identityDirectory.clientTLSSecret is required when identityDirectory.enabled is true" }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.port }}
          name: http
          protocol: TCP
        args:
          - serve
          - --keycloak-base-url={{ .Values.keycloak.baseUrl }}
          - --keycloak-client-id={{ .Values.keycloak.client.id }}
          {{- if .Values.identityDirectory.enabled }}
          - --identity-directory-endpoint={{ .Values.identityDirectory.endpoint }}
          - --identity-directory-client-cert-file=/identity-directory/tls.crt
          - --identity-directory-client-key-file=/identity-directory/tls.key
          - --identity-directory-timeout={{ .Values.identityDirectory.timeout }}
          {{- if .Values.identityDirectory.caSecret }}
          - --identity-directory-ca-file=/identity-directory-ca/ca.crt
          {{- end }}
          {{- end }}
          - --roles-file-path=/roles/roles.yaml
          - --jwt-user-id-claim={{ .Values.jwt.userIdClaim  }}
          - --openfga-grpc-addr={{ .Values.openfga.endpoint }}
          {{- include "common.extraArgs" . | indent 10 }}
        env:
          {{- include "common.basicEnvironment" . | nindent 10 }}
          - name: KUBECONFIG
            value: /api-kubeconfig/kubeconfig
          {{- if not .Values.identityDirectory.enabled }}
          - name: KEYCLOAK_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Values.keycloak.client.secret.name }}
                key: {{ .Values.keycloak.client.secret.key }}
          {{- end }}
        volumeMounts:
        {{- include "common.extraVolumeMounts" . | nindent 8 }}
          - name: external-api-server
            mountPath: /api-kubeconfig
          - name: roles
            mountPath: /roles
          {{- if .Values.identityDirectory.enabled }}
          - name: identity-directory-client
            mountPath: /identity-directory
            readOnly: true
          {{- if .Values.identityDirectory.caSecret }}
          - name: identity-directory-ca
            mountPath: /identity-directory-ca
            readOnly: true
          {{- end }}
          {{- end }}
          {{- if .Values.caSecret }}
          - name: domain-ca
            mountPath: /etc/ssl/certs/domain-ca.crt
            subPath: tls.crt
            readOnly: true
          {{- end }}
      {{- include "common.hostAliases" $ | nindent 6 }}
      volumes:
        {{- include "common.extraVolumes" . | nindent 8 }}
        - name: external-api-server
          secret:
            secretName: {{ .Values.kcp.kubeconfig.secretName }}
        - name: roles
          configMap:
            name: {{ include "common.entity.name" . }}-roles
        {{- if .Values.identityDirectory.enabled }}
        - name: identity-directory-client
          secret:
            secretName: {{ .Values.identityDirectory.clientTLSSecret }}
        {{- if .Values.identityDirectory.caSecret }}
        - name: identity-directory-ca
          secret:
            secretName: {{ .Values.identityDirectory.caSecret }}
        {{- end }}
        {{- end }}
        {{- if .Values.caSecret }}
        - name: domain-ca
          secret:
            secretName: {{ .Values.caSecret }}
        {{- end }}


