{{- $_ := required "exposure.baseDomain is required" .Values.exposure.baseDomain -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "common.entity.name" . }}
spec:
  hostnames:
  {{- if .Values.gatewayApi.httpRoute.hostnames }}
    {{- toYaml .Values.gatewayApi.httpRoute.hostnames | nindent 4 }}
  {{- else }}
    - {{ .Values.exposure.baseDomain | quote }}
    - "*.{{ .Values.exposure.baseDomain }}"
  {{- end }}
  parentRefs:
{{ toYaml .Values.gatewayApi.httpRoute.parentRefs | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "common.entity.name" . }}
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.port }}
      {{- if .Values.gatewayApi.httpRoute.filters }}
      filters:
      {{- with .Values.gatewayApi.httpRoute.filters }}
        {{ toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}
      matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gatewayApi.httpRoute.pathPrefix }}
