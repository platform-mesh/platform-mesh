suite: operator
chart:
  version: 1.0.0
  appVersion: 1.0.0
release:
  name: kro-composition-operator
tests:
  - it: match snapshot
    asserts:
      - matchSnapshot: {}
  - it: omits --feature-gates when none are set
    templates:
      - deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates
  - it: passes set feature gates through to the flag
    templates:
      - deployment.yaml
    set:
      featureGates: "InstanceConditionEvents=true,CELOmitFunction=false"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=InstanceConditionEvents=true,CELOmitFunction=false
