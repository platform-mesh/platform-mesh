components:
  - name: github.com/platform-mesh/helm-charts/pm-openfga-authz-webhook
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: chart
        type: helmChart
        relation: external
        version: ${PM_VERSION}
        access:
          type: ociArtifact
          imageReference: ${CHART_REPO}/pm-openfga-authz-webhook:${PM_VERSION}
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
  - name: github.com/platform-mesh/pm-openfga-authz-webhook
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
    componentReferences:
      - name: chart
        componentName: github.com/platform-mesh/helm-charts/pm-openfga-authz-webhook
        version: ${PM_VERSION}
      - name: image
        componentName: github.com/platform-mesh/images/pm-openfga-authz-webhook
        version: ${PM_VERSION}
