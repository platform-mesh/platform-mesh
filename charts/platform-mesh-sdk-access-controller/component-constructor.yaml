components:
  - name: github.com/platform-mesh/helm-charts/platform-mesh-sdk-access-controller
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: chart
        type: helmChart
        relation: external
        version: ${PM_VERSION}
        access:
          type: OCIImage/v1
          imageReference: ${CHART_REPO}/platform-mesh-sdk-access-controller:${PM_VERSION}
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: Git/v1
          repository: ${REPO_URL}
          commit: ${COMMIT}
  - name: github.com/platform-mesh/platform-mesh-sdk-access-controller
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: Git/v1
          repository: ${REPO_URL}
          commit: ${COMMIT}
    componentReferences:
      - name: chart
        componentName: github.com/platform-mesh/helm-charts/platform-mesh-sdk-access-controller
        version: ${PM_VERSION}
      - name: image
        componentName: github.com/platform-mesh/images/platform-mesh-sdk-access
        version: ${PM_VERSION}
