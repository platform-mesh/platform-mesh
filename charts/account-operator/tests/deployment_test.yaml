suite: operator
chart:
  appVersion: 0.0.0
release:
  name: account-operator
tests:
  - it: operator match the snapshot
    set:
      webhooks:
        additionalAccountTypes: my-type,my-other-type
      # health:
      #   portOverride: 8080
      deployment:
        resources:
          limits:
            cpuOverride: 260m
            memoryOverride: 512Mi
          requests:
            cpuOverride: 150m
            memoryOverride: 128Mi
        hostAliases:
          - hostnames:
              - kcp.dev.local
            ip: 10.96.0.100
    asserts:
      - matchSnapshot: {}
  - it: operator match the snapshot (with kubeconfigSecret)
    set:
      kubeconfigSecret: "kubeconfig"
    asserts:
      - matchSnapshot: {}
  - it: operator match the snapshot with webhook enabled
    set:
      health:
        # portOverride: 8081
        liveness:
          pathOverride: "/healthz"
          # failureThreshold: 1
        startup:
          pathOverride: "/healthz"
        readiness:
          initialDelaySecondsOverride: 45
      webhooks:
        enabled: true
        certDir: /certs
      deployment:
        resources:
          limits:
            cpuOverride: 260m
            memoryOverride: 512Mi
          requests:
            cpuOverride: 150m
            memoryOverride: 128Mi
    asserts:
      - matchSnapshot: {}
  - it: deployment with security context
    template: deployment.yaml
    set:
      security:
        mountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.serviceAccountName
          value: account-operator
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
  - it: deployment with tracing
    template: deployment.yaml
    set:
      tracing:
        enabled: true
        collector:
          endpoint: test:4317
    asserts:
      - matchSnapshot: {}
  - it: multi-pod leader election
    template: deployment.yaml
    set:
      deployment:
        replicas: 2
      operator:
        leaderElect: true
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[0].args[1]
          value: "--leader-elect"
  - it: disable istio
    set:
      istio:
        enabled: false
    asserts:
      - matchSnapshot: {}
  - it: no oidc flags without an issuer
    template: deployment.yaml
    set:
      oidc:
        clients:
          kubectl: platform-mesh
        scopes: [email]
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --oidc-clients=kubectl=platform-mesh
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --oidc-scopes=email
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --oidc-ca-file=/oidc-ca/tls.crt
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: oidc-ca
          any: true
  - it: external oidc issuer
    template: deployment.yaml
    set:
      oidc:
        issuerUrl: https://issuer.example/dex
        clients:
          kubectl: platform-mesh
        scopes: [email, groups]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oidc-issuer-url=https://issuer.example/dex
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oidc-clients=kubectl=platform-mesh
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oidc-scopes=email,groups
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oidc-ca-file=/oidc-ca/tls.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: oidc-ca
            mountPath: /oidc-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: oidc-ca
            secret:
              secretName: domain-certificate-ca
  - it: external oidc issuer with a public client has no client secret flag
    template: deployment.yaml
    set:
      oidc:
        issuerUrl: https://issuer.example/dex
        clients:
          kubectl: kubectl
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --oidc-client-secrets=
          any: true
  - it: external oidc issuer with a confidential client
    template: deployment.yaml
    set:
      oidc:
        issuerUrl: https://issuer.example/dex
        clients:
          kubectl: platform-mesh
        clientSecrets:
          kubectl: not-a-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oidc-clients=kubectl=platform-mesh
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oidc-client-secrets=kubectl=not-a-secret
  - it: external oidc issuer with a publicly trusted certificate
    template: deployment.yaml
    set:
      oidc:
        issuerUrl: https://issuer.example
        clients:
          kubectl: platform-mesh
        caFileRef:
          name: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --oidc-ca-file=/oidc-ca/tls.crt
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: oidc-ca
          any: true
