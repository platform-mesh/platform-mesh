image:
  # -- The image registry
  registry: ghcr.io
  # -- The image repository path (without registry)
  repository: platform-mesh/platform-mesh/account-operator
  # -- The image digest (when set, overrides tag: registry/repository@digest)
  digest: ""
  # Overwrite image.tag to use a different image tag then .chart.appVersion
  #  tag: latest

webhooks:
  # -- Enable webhooks
  enabled: true

  # -- Register webhooks, flag to toggle if webhooks should be registered on the runtime cluster
  register: false
  # -- The directory for webhook certificates
  certDir: /certs
  # -- List of denied organization names
  denyList: ["admin", "root", "system", "www"]
  additionalAccountTypes: ["account"]

  # -- CA certificate duration (default: 3 months)
  caDuration: 2160h
  # -- CA certificate renewal time before expiration (default: 30 days)
  caRenewBefore: 720h
  # -- Serving certificate duration (default: 3 months)
  certDuration: 2160h
  # -- Serving certificate renewal time before expiration (default: 30 days)
  certRenewBefore: 720h

# -- The kcp configuration
kcp:
  # -- kcp APIExportEndpointSliceName which is used for reconciliation
  apiExportEndpointSliceName: "core.platform-mesh.io"

# -- An OIDC issuer that is the same for every account: an external issuer, used instead of Keycloak. The operator publishes it in every AccountInfo, where the portal reads it for the kubeconfigs it hands out. Leave the issuer empty with Keycloak, whose operator publishes the realm of each organization
oidc:
  # -- The issuer URL, as it appears in the iss claim
  issuerUrl: ""
  # -- Clients of the issuer, client name to client ID. The portal looks the client of kubeconfigs up as `kubectl`
  clients: {}
  # -- Secrets of the clients that are not public: client name to the `name` and `key` of a Secret in the release namespace that holds the client secret. The operator publishes them in every AccountInfo and the portal puts the one of `kubectl` into the kubeconfigs it hands out, so they protect nothing: only for an issuer whose clients cannot be public. Read at startup: restart the operator after changing a Secret
  clientSecretRefs: {}
  # -- Scopes clients request besides openid, e.g. email and groups
  scopes: []
  # -- Secret with the CA of the issuer, published for clients to verify the issuer with. The default is the CA of the domain certificate, as for kcp. Set the name to "" for an issuer whose certificate is publicly trusted
  caFileRef:
    name: domain-certificate-ca
    key: tls.crt

subroutines:
  workspaceType:
    # -- Enable workspace type subroutine
    enabled: true
  accountInfo:
    # -- Enable AccountInfo subroutine
    enabled: true
  workspace:
    # -- Enable workspace subroutine
    enabled: true
  workspaceReady:
    # -- Enable workspace ready subroutine
    enabled: true
  fga:
    # -- gRPC address of the OpenFGA service
    grpcAddr: openfga.platform-mesh-system.svc.cluster.local:8081

log:
  # -- Log level
  level: debug
  # -- Disable JSON log formatting
  noJson: true

controllers:
  accountInfo:
    # -- Enable AccountInfo controller
    enabled: true

# -- Name of the Secret holding the kubeconfig used to reach the API server.
# This Secret is not created by this Helm chart and is not meant to be created by the
# user: in a regular Platform Mesh installation it is created and managed by the PM
# Operator, which provisions a `<component>-kubeconfig` Secret for each PM component.
kubeconfigSecret: "account-operator-kubeconfig"

security:
  # -- Mount the service account token
  mountServiceAccountToken: true

deployment:
  specTemplate:
    # -- The annotations for the deployment
    annotations: {}
    # -- The labels for the deployment
    labels: {}
  replicas: 1

hostAliases:
  enabled: false

operator:
  leaderElect: true

istio:
  enabled: false

tracing:
  # -- Toggle to enable/disable OpenTelemetry tracing
  enabled: false
  collector:
    # -- OpenTelemetry collector endpoint
    endpoint: observability-opentelemetry-collector.observability.svc.cluster.local:4317

clusterScopedName:
  # -- Prefix for the names of cluster-scoped resources (ClusterRoles, ClusterRoleBindings, webhook configurations), so several installations can share a cluster. A global.clusterScopedName value takes precedence over this one
  prefix: ""
  # -- Suffix for the names of cluster-scoped resources
  suffix: ""
