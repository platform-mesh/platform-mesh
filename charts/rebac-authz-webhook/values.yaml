certManager:
  enabled: true
  dnsNames: []
  ipAddresses: []
  caSecretName: rebac-authz-webhook-webhook-ca

deployment:
  resources:
    limits:
      cpu: "500m"
      memory: "128Mi"
    requests:
      cpu: "40m"
      memory: "50Mi"

image:
  # -- The image registry
  registry: ghcr.io
  # -- The image repository path (without registry)
  repository: platform-mesh/platform-mesh/rebac-authz-webhook
  # -- The image digest (when set, overrides tag: registry/repository@digest)
  digest: ""
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Set the openfga service URL and store name
# openfga:
#   url: your-domain-of-the-fga-service:443
#   storeName: a-store-name

healthProbeBindAddress: ":8081"

health:
  port: 8081

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  # name:

kcp:
  kubeconfig:
    secret: rebac-authz-webhook-kubeconfig
  # -- kcp APIExportEndpointSliceName to watch. Empty string means auto-discover all slices
  apiExportEndpointSliceName: ""

service:
  clusterIP: ""
  type: ClusterIP
  port: 9443
  metricsPort: 8080
  annotations: {}

openfga:
  endpoint: openfga.platform-mesh-system.svc.cluster.local:8081

webhook:
  cacheMissMaxRetries: 1
  cacheMissTTL: 5m
  cacheMissCleanupInterval: 2m
  cacheMissRetryAfter: 1s

istio:
  enabled: false
  dnsNames: []

# Horizontal Pod Autoscaler configuration
# hpa:
#   enabled: true
#   minReplicas: 1
#   maxReplicas: 10
#   metrics:
#     - type: Resource
#       resource:
#         name: cpu
#         target:
#           type: Utilization
#           averageUtilization: 80
clusterScopedName:
  # -- Prefix for the names of cluster-scoped resources (ClusterRoles, ClusterRoleBindings, webhook configurations), so several installations can share a cluster. A global.clusterScopedName value takes precedence over this one
  prefix: ""
  # -- Suffix for the names of cluster-scoped resources
  suffix: ""
