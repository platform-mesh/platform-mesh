components:
  - name: github.com/platform-mesh/helm-charts/keycloak-operator
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: chart
        type: helmChart
        relation: external
        version: ${PM_VERSION}
        access:
          type: ociArtifact
          imageReference: ${CHART_REPO}/keycloak-operator:${PM_VERSION}
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
  - name: github.com/platform-mesh/images/keycloak-operator
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: keycloak-image
        type: ociImage
        version: v26.8.1
        access:
          type: ociArtifact
          imageReference: ghcr.io/platform-mesh/custom-images/keycloak:v26.8.1
        relation: external
      - name: manager-image
        type: ociImage
        version: 26.8.1
        access:
          type: ociArtifact
          imageReference: quay.io/keycloak/keycloak-operator:26.8.1
        relation: external
  - name: github.com/platform-mesh/keycloak-operator
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
    componentReferences:
      - name: chart
        componentName: github.com/platform-mesh/helm-charts/keycloak-operator
        version: ${PM_VERSION}
      - name: image
        componentName: github.com/platform-mesh/images/keycloak-operator
        version: ${PM_VERSION}
