suite: declarative installation
templates:
  - installation.yaml
  - installation-profile.yaml
  - installation-signing-certificate.yaml
  - certificates-selfsigned.yaml
tests:
  - it: creates the operator-managed Platform Mesh installation
    template: installation.yaml
    set:
      ocm:
        enabled: true
        version: 0.5.2
      gateway:
        baseDomain: platform.example.com
    asserts:
      - equal:
          path: spec.repositorySpec.baseUrl
          value: ghcr.io/platform-mesh
        documentIndex: 0
      - equal:
          path: spec.verify[0].signature
          value: platform-mesh.platform-mesh
        documentIndex: 1
      - equal:
          path: spec.exposure.baseDomain
          value: platform.example.com
        documentIndex: 3
      - equal:
          path: spec.exposure.port
          value: 8443
        documentIndex: 3
  - it: supports mirrored repositories and their signing identities
    template: installation.yaml
    set:
      ocm:
        enabled: true
        repository: ghcr.io/example/platform-mesh
        signatureName: example.platform-mesh
      gateway:
        baseDomain: platform.example.com
    asserts:
      - equal:
          path: spec.repositorySpec.baseUrl
          value: ghcr.io/example/platform-mesh
        documentIndex: 0
      - equal:
          path: spec.verify[0].signature
          value: example.platform-mesh
        documentIndex: 1
  - it: bundles the production profile by default
    template: installation-profile.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
    asserts:
      - equal:
          path: metadata.name
          value: platform-mesh-profile
      - notExists:
          path: metadata.annotations
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'hostAliasesEntries: &hostAliasesEntries \[\]'
      - matchRegex:
          path: data["profile.yaml"]
          pattern: '(?s)openfga:.*?telemetry:\s+trace:\s+enabled: false'
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'cat /domain-ca/ca\.crt /webhook-ca/ca\.crt'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: 'cat /domain-ca/tls\.crt'
      # The operator renders the external port; quoted, as the profile has
      # to be YAML before it is rendered. The infra chart turns the listener
      # ports back into integers.
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'port: "\{\{ \.port \}\}"'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: '__[A-Z_]+__'
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'allowUnverifiedEmails: false'
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'setDefaultPassword: false'
  - it: bundles the kind profile, the operator renders the gateway ClusterIP
    template: installation-profile.yaml
    set:
      ocm:
        enabled: true
        profile: kind
      gateway:
        baseDomain: platform.example.com
        clusterIP: 10.96.188.4
    asserts:
      - notExists:
          path: metadata.annotations
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'ip: "\{\{ \.gatewayServiceClusterIP \}\}"'
      - matchRegex:
          path: data["profile.yaml"]
          pattern: '(?s)openfga:.*?telemetry:\s+trace:\s+enabled: false'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: '__[A-Z_]+__'
  - it: renders the profile on upgrade too
    template: installation-profile.yaml
    release:
      upgrade: true
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
    asserts:
      - hasDocuments:
          count: 1
  - it: renders no profile when ocm.profile is empty
    template: installation-profile.yaml
    set:
      ocm:
        enabled: true
        profile: ""
      gateway:
        baseDomain: platform.example.com
    asserts:
      - hasDocuments:
          count: 0
  - it: renders no profile when installation resources are disabled
    template: installation-profile.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: fails when ocm.profile has no bundled profile file
    template: installation-profile.yaml
    set:
      ocm:
        enabled: true
        profile: bogus
      gateway:
        baseDomain: platform.example.com
        clusterIP: 10.96.188.4
    asserts:
      - failedTemplate:
          errorMessage: 'unknown ocm.profile "bogus": no files/bogus-profile.yaml exists'
  - it: does not install platform resources by default
    template: installation.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: creates the gateway certificate from the installation base domain
    template: certificates-selfsigned.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
      certificates:
        selfSigned:
          enabled: true
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: platform-mesh-domain-selfsigned
        documentIndex: 0
      - equal:
          path: metadata.name
          value: platform-mesh-domain-ca
        documentIndex: 1
      - equal:
          path: metadata.name
          value: platform-mesh-domain-ca
        documentIndex: 2
      - equal:
          path: metadata.name
          value: platform-mesh-domain
        documentIndex: 3
      - equal:
          path: spec.commonName
          value: platform.example.com
        documentIndex: 3
      - equal:
          path: spec.dnsNames
          value:
            - platform.example.com
            - "*.platform.example.com"
        documentIndex: 3
      - equal:
          path: spec.secretName
          value: domain-certificate
        documentIndex: 3
  - it: does not create certificates unless explicitly enabled
    template: certificates-selfsigned.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
    asserts:
      - hasDocuments:
          count: 0
  - it: requires the gateway ClusterIP for the kind profile
    template: installation.yaml
    set:
      ocm:
        enabled: true
        profile: kind
      gateway:
        baseDomain: platform.example.com
    asserts:
      - failedTemplate:
          errorMessage: gateway.clusterIP must be set to the ClusterIP of the gateway controller Service when using the kind profile
  - it: leaves the profile alone by default
    template: installation.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
    asserts:
      - equal:
          path: spec.featureToggles
          value:
            - name: feature-accounts-in-accounts
        documentIndex: 3
      - notExists:
          path: spec.values
        documentIndex: 3
  - it: selects the GatewayClass through spec.values
    template: installation.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
        className: envoy
    asserts:
      - equal:
          path: spec.values
          value:
            services:
              infra:
                values:
                  gatewayApi:
                    gatewayClassName: envoy
        documentIndex: 3
  - it: allows unverified emails on request
    template: installation.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
      idp:
        allowUnverifiedEmails: true
    asserts:
      - contains:
          path: spec.featureToggles
          content:
            name: feature-disable-email-verification
        documentIndex: 3
      - equal:
          path: spec.values
          value:
            services:
              pm-keycloak-operator:
                values:
                  idp:
                    allowUnverifiedEmails: true
        documentIndex: 3
  - it: sets a default password on request
    template: installation.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
      idp:
        setDefaultPassword: true
    asserts:
      - equal:
          path: spec.values
          value:
            services:
              pm-keycloak-operator:
                values:
                  idp:
                    setDefaultPassword: true
        documentIndex: 3
