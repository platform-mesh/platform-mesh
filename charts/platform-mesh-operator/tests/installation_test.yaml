suite: declarative installation
templates:
  - installation.yaml
  - installation-profile.yaml
  - installation-signing-certificate.yaml
  - certificates-selfsigned.yaml
tests:
  - it: creates the operator-managed Platform Mesh installation
    template: installation.yaml
    set:
      ocm:
        enabled: true
        version: 0.5.2
      gateway:
        baseDomain: platform.example.com
    asserts:
      - equal:
          path: spec.repositorySpec.baseUrl
          value: ghcr.io/platform-mesh
        documentIndex: 0
      - contains:
          path: spec.ocmConfig
          content:
            kind: Secret
            apiVersion: v1
            name: ocm-signing-public-cert
        documentIndex: 1
      - equal:
          path: spec.exposure.baseDomain
          value: platform.example.com
        documentIndex: 3
      - equal:
          path: spec.exposure.port
          value: 8443
        documentIndex: 3
  - it: leaves the PlatformMesh resource alone without additions
    template: installation.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
    asserts:
      - equal:
          path: spec.featureToggles
          value:
            - name: feature-accounts-in-accounts
        documentIndex: 3
      - notExists:
          path: spec.authentication
        documentIndex: 3
      - notExists:
          path: spec.values
        documentIndex: 3
  - it: adds feature toggles, authentication and values to the PlatformMesh resource
    template: installation.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
      platformMesh:
        extraFeatureToggles:
          - feature-disable-keycloak
        authentication:
          oidc:
            issuerURL: https://platform.example.com/dex
            clientID: platform-mesh
        values:
          services:
            iam-ui:
              enabled: false
            portal:
              values:
                extraEnvVars:
                  - name: URL
                    value: "https://{{ .baseDomainPort }}/"
    asserts:
      - equal:
          path: spec.featureToggles
          value:
            - name: feature-accounts-in-accounts
            - name: feature-disable-keycloak
        documentIndex: 3
      - equal:
          path: spec.authentication.oidc
          value:
            issuerURL: https://platform.example.com/dex
            clientID: platform-mesh
        documentIndex: 3
      - equal:
          path: spec.values.services["iam-ui"].enabled
          value: false
        documentIndex: 3
      # Templates in the values are for the operator: Helm passes them on.
      - equal:
          path: spec.values.services.portal.values.extraEnvVars[0].value
          value: "https://{{ .baseDomainPort }}/"
        documentIndex: 3
  - it: supports mirrored repositories and their signing identities
    template: installation.yaml
    set:
      ocm:
        enabled: true
        repository: ghcr.io/example/platform-mesh
        signatureName: example.platform-mesh
        installSigningCertificate: false
      gateway:
        baseDomain: platform.example.com
    asserts:
      - equal:
          path: spec.repositorySpec.baseUrl
          value: ghcr.io/example/platform-mesh
        documentIndex: 0
      - contains:
          path: spec.ocmConfig
          content:
            kind: Secret
            apiVersion: v1
            name: ocm-signing-public-cert
        documentIndex: 1
      - hasDocuments:
          count: 0
        template: installation-signing-certificate.yaml

  - it: verifies the configured signature with the bundled certificate
    template: installation-signing-certificate.yaml
    set:
      ocm:
        enabled: true
        signatureName: ocm.platform-mesh
      gateway:
        baseDomain: platform.example.com
    asserts:
      - equal:
          path: metadata.name
          value: ocm-signing-public-cert
      - matchRegex:
          path: stringData[".ocmconfig"]
          pattern: '(?s)type: signing\.config\.ocm\.software/v1alpha1\n\s+signature: "ocm\.platform-mesh".*type: RSACredentials/v1\n\s+publicKeyPEM: \|\n\s+-----BEGIN CERTIFICATE-----\n\s+MIIDHDCCAgSgAwIBAgIQTBfx'

  # Each signature name has exactly one certificate: the verifier uses a
  # single public key, so a second certificate in an entry would be ignored.
  - it: verifies the default signature with the current signing certificate only
    template: installation-signing-certificate.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
    asserts:
      - matchRegex:
          path: stringData[".ocmconfig"]
          pattern: '(?s)signature: "v26\.11\.platform-mesh\.platform-mesh".*publicKeyPEM: \|\n\s+-----BEGIN CERTIFICATE-----\n\s+MIIDvDCCA0GgAwIBAgIUPsmO'
      - notMatchRegex:
          path: stringData[".ocmconfig"]
          pattern: '(?s)BEGIN CERTIFICATE.*BEGIN CERTIFICATE'

  - it: keeps the certificate of the previous signing key for older releases
    template: installation-signing-certificate.yaml
    set:
      ocm:
        enabled: true
        signatureName: platform-mesh.platform-mesh
      gateway:
        baseDomain: platform.example.com
    asserts:
      - matchRegex:
          path: stringData[".ocmconfig"]
          pattern: '(?s)signature: "platform-mesh\.platform-mesh".*publicKeyPEM: \|\n\s+-----BEGIN CERTIFICATE-----\n\s+MIIDJjCCAg6gAwIBAgIQD/Ei'
      - notMatchRegex:
          path: stringData[".ocmconfig"]
          pattern: '(?s)BEGIN CERTIFICATE.*BEGIN CERTIFICATE'

  - it: does not create the Secret when the key comes from elsewhere
    template: installation-signing-certificate.yaml
    set:
      ocm:
        enabled: true
        installSigningCertificate: false
      gateway:
        baseDomain: platform.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses a signature name without a bundled certificate
    template: installation-signing-certificate.yaml
    set:
      ocm:
        enabled: true
        signatureName: nosuch.platform-mesh
      gateway:
        baseDomain: platform.example.com
    asserts:
      - failedTemplate:
          errorMessage: 'ocm.signatureName "nosuch.platform-mesh" has no certificate in files/ocm-signing-public-cert.yaml'
  - it: bundles the default profile
    template: installation-profile.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
        clusterIP: 10.96.188.4
    asserts:
      - equal:
          path: metadata.name
          value: platform-mesh-profile
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - matchRegex:
          path: data["profile.yaml"]
          pattern: '(?s)openfga:.*?telemetry:\s+trace:\s+enabled: false'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: 'webhookCaSecret:'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: 'cat /domain-ca/ca\.crt'
      # The external port must be substituted by Helm at template time; the
      # __EXTERNAL_PORT__ placeholder must not leak into the ConfigMap, and
      # PMO's template context does not define `.port`.
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'port: 8443'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: '__EXTERNAL_PORT__'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: '\{\{ \.port \}\}'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: '__GATEWAY_CLASS_NAME__'
  - it: disables OpenFGA tracing in the kind profile
    template: installation-profile.yaml
    set:
      ocm:
        enabled: true
        profile: kind
      gateway:
        baseDomain: platform.example.com
        clusterIP: 10.96.188.4
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - matchRegex:
          path: data["profile.yaml"]
          pattern: '(?s)openfga:.*?telemetry:\s+trace:\s+enabled: false'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: 'cat /domain-ca/tls\.crt'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: '__GATEWAY_SERVICE_CLUSTER_IP__'
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'ip: "?10\.96\.188\.4"?'
  - it: fails when ocm.profile has no bundled profile file
    template: installation-profile.yaml
    set:
      ocm:
        enabled: true
        profile: bogus
      gateway:
        baseDomain: platform.example.com
        clusterIP: 10.96.188.4
    asserts:
      - failedTemplate:
          errorMessage: 'unknown ocm.profile "bogus": no files/bogus-profile.yaml exists'
  - it: does not install platform resources by default
    template: installation.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: creates the gateway certificate from the installation base domain
    template: certificates-selfsigned.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
      certificates:
        selfSigned:
          enabled: true
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: platform-mesh-domain-selfsigned
        documentIndex: 0
      - equal:
          path: metadata.name
          value: platform-mesh-domain-ca
        documentIndex: 1
      - equal:
          path: metadata.name
          value: platform-mesh-domain-ca
        documentIndex: 2
      - equal:
          path: metadata.name
          value: platform-mesh-domain
        documentIndex: 3
      - equal:
          path: spec.commonName
          value: platform.example.com
        documentIndex: 3
      - equal:
          path: spec.dnsNames
          value:
            - platform.example.com
            - "*.platform.example.com"
        documentIndex: 3
      - equal:
          path: spec.secretName
          value: domain-certificate
        documentIndex: 3
  - it: does not create certificates unless explicitly enabled
    template: certificates-selfsigned.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
    asserts:
      - hasDocuments:
          count: 0
  - it: renders the gateway ClusterIP into the kind profile host aliases
    template: installation-profile.yaml
    set:
      ocm:
        enabled: true
        profile: kind
      gateway:
        baseDomain: platform.example.com
        clusterIP: 10.96.188.4
    asserts:
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'ip: "10\.96\.188\.4"'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: '__GATEWAY_SERVICE_CLUSTER_IP__'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: '(?i)traefik(ClusterIP|CRDs)?:'
  - it: requires the gateway ClusterIP for the kind profile
    template: installation.yaml
    set:
      ocm:
        enabled: true
        profile: kind
      gateway:
        baseDomain: platform.example.com
    asserts:
      - failedTemplate:
          errorMessage: gateway.clusterIP must be set to the ClusterIP of the gateway controller Service when using the kind profile
  - it: requires verified emails by default
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
    asserts:
      - equal:
          path: spec.featureToggles
          value:
            - name: feature-accounts-in-accounts
        template: installation.yaml
        documentIndex: 3
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'allowUnverifiedEmails: false'
        template: installation-profile.yaml
  - it: allows unverified emails on request
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
      idp:
        allowUnverifiedEmails: true
    asserts:
      - contains:
          path: spec.featureToggles
          content:
            name: feature-disable-email-verification
        template: installation.yaml
        documentIndex: 3
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'allowUnverifiedEmails: true'
        template: installation-profile.yaml
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: 'allowUnverifiedEmails: false'
        template: installation-profile.yaml
  - it: sends invitations by default
    template: installation-profile.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
    asserts:
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'setDefaultPassword: false'
  - it: sets a default password on request
    template: installation-profile.yaml
    set:
      ocm:
        enabled: true
      gateway:
        baseDomain: platform.example.com
      idp:
        setDefaultPassword: true
    asserts:
      - matchRegex:
          path: data["profile.yaml"]
          pattern: 'setDefaultPassword: true'
      - notMatchRegex:
          path: data["profile.yaml"]
          pattern: 'setDefaultPassword: false'
