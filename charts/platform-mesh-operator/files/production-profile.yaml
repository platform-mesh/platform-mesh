apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-mesh-profile
  namespace: platform-mesh-system
data:
  profile.yaml: |
    infra:
      deploymentTechnology: fluxcd
      ocm:
        component:
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          name: platform-mesh
        skipVerify: false
      certManager:
        # Installed or supplied by the target cluster.
        enabled: false
      etcdDruid:
        # Installed or supplied by the target cluster.
        enabled: false
      prometheusOperatorCRDs:
        # Enable when components.observability.enabled is true
        enabled: false
        interval: 1m
        name: prometheus-operator-crds
        ocmResourceName: chart
        ocmComponentName: prometheus-operator-crds
        targetNamespace: observability
        values: {}
      opentelemetryOperator:
        # Enable when components.observability.enabled is true
        enabled: false
    components:
      # Production workloads resolve public Platform Mesh hostnames through DNS.
      # Do not route them to an implementation-specific Service ClusterIP.
      deploymentTechnology: fluxcd
      ocm:
        component:
          create: true
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          create: true
          name: platform-mesh
        skipVerify: false
      services:
        account-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: account-operator
          syncWave: 4
          dependsOn: []
          values:
            crds:
              enabled: false
            kcp:
              apiExportEndpointSliceName: "core.platform-mesh.io"
            kubeconfigSecret: account-operator-kubeconfig
            log:
              level: debug
              noJson: true
            subroutines:
              fga:
                grpcAddr: openfga:8081
            tracing:
              collector:
                host: observability-opentelemetry-collector.observability.svc.cluster.local:4317
              enabled: false
        extension-manager-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: extension-manager-operator
          syncWave: 4
          dependsOn: []
          values:
            crds:
              enabled: false
            kcp:
              enabled: true
              kubeconfigSecret: extension-manager-operator-kubeconfig
            tracing:
              collector:
                host: observability-opentelemetry-collector.observability.svc.cluster.local:4317
              enabled: false
        infra:
          imageResources:
          - name: keycloak-image
            resource: keycloak-image
            resourceName: keycloak-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: keycloak.operator.image.tag
          - name: busybox-image
            resource: busybox-image
            resourceName: busybox-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: keycloak.operator.waitForDb.image.tag
          - name: postgres-image
            resource: postgres-image
            resourceName: postgres-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: cnpg.cluster.image.tag
          - name: kcp-server-image
            resource: image
            absoluteReferencePath:
            - name: kcp
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.image.tag
              image-ref: combined
          - name: etcd-wrapper-image
            resource: etcd-wrapper-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.etcd.image.tag
              image-ref: combined
          - name: etcdbrctl-image
            resource: etcdbrctl-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.etcd.backup.image.tag
              image-ref: combined
          dependsOn: []
          values:
            keycloak:
              operator:
                enabled: true
                # cert-manager writes the issuing CA as ca.crt in the leaf certificate Secret.
                caSecret: domain-certificate
                httpEnabled: true
                db:
                  password: keycloak-password
                admin:
                  password: admin
                  secret: admin
                health:
                  port: 9000
                  periodSeconds: 10
                  liveness:
                    path: /keycloak/health/live
                    failureThreshold: 3
                  readiness:
                    path: /keycloak/health/ready
                    initialDelaySeconds: 0
                    periodSeconds: 10
                  startup:
                    path: /keycloak/health
                    failureThreshold: 600
              service:
                name: keycloak-service
                port: 8080
              keycloakConfig:
                url: http://keycloak-service.platform-mesh-system.svc.cluster.local:8080/keycloak
                redirectUrls: ["http://localhost:8000/callback*"]
            dex:
              enabled: false
            cnpg:
              enabled: true
              roles:
                keycloak:
                  password: keycloak-password
                openfga:
                  password: openfga-password
            gatewayApi:
              enabled: true
            kcp:
              auth:
                serviceAccount:
                  enabled: true
              rootShard:
                extraArgs:
                - --feature-gates=WorkspaceAuthentication=true,CacheAPIs=true
              shards:
                - name: nereus
                - name: triton
              webhook:
                enabled: true
        iam-ui:
          dependsOn: []
          syncWave: 4
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: iam-ui
          values: {}
        iam-service:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: iam-service
          syncWave: 4
          dependsOn: []
          values:
            caSecret: domain-certificate
            extraArgs:
            - --no-json
        kcp:
          external: true
          dependsOn: []
        kcp-operator:
          syncWave: 1
          external: true
          # The chart comes from kcp's Helm repository, not from an OCI registry
          # (third_party/kcp-operator/component-constructor.yaml).
          helmRepo: true
          dependsOn: []
          imageResources:
          - name: kcp-operator-image
            annotations:
              repo: oci
              artifact: image
              for: kcp-operator
              image-ref: combined
          targetNamespace: platform-mesh-system
          values: {}
        keycloak-operator: {}
        cnpg-operator: {}
        kubernetes-graphql-gateway:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: kubernetes-graphql-gateway
          syncWave: 4
          dependsOn: []
          values:
            gateway:
              playground: true
              logLevel: trace
            gatewayApi:
              enabled: true
            kubeConfig:
              enabled: true
              secretName: kubernetes-graphql-gateway-kubeconfig
            sentry:
              environment: dev
            tracing:
              enabled: false
        openfga:
          external: true
          dependsOn: []
          syncWave: 2
          suspend: true
          imageResources:
          - name: openfga-image
            annotations:
              repo: oci
              artifact: image
              for: openfga
              image-ref: combined
              unsuspend: "true"
          values:
            autoscaling:
              enabled: false
            checkQueryCache:
              enabled: true
              limit: 10000
              ttl: 10s
            datastore:
              applyMigrations: true
              engine: postgres
              existingSecret: cnpg-openfga-user
              maxOpenConns: 30
              migrationType: initContainer
              migrations:
                image:
                  pullPolicy: Always
                  repository: groundnuty/k8s-wait-for
                  tag: v2.0
              secretKeys:
                passwordKey: password
                usernameKey: username
              uri: postgres://platform-mesh-pg-rw.platform-mesh-system.svc.cluster.local:5432/openfga?sslmode=verify-full&sslrootcert=/etc/openfga/cnpg-ca/ca.crt
            extraEnvVars:
            - name: OPENFGA_EXPERIMENTALS
              value: enable-list-users
            extraVolumeMounts:
            - mountPath: /etc/openfga/cnpg-ca
              name: cnpg-ca
              readOnly: true
            extraVolumes:
            - name: cnpg-ca
              secret:
                secretName: platform-mesh-pg-ca
                items:
                  - key: ca.crt
                    path: ca.crt
            image:
              tag: v1.11.2
            log:
              level: info
            migrate:
              repository: openfga/openfga
              annotations:
                sidecar.istio.io/inject: "false"
              extraVolumeMounts:
              - mountPath: /etc/openfga/cnpg-ca
                name: cnpg-ca
                readOnly: true
              extraVolumes:
              - name: cnpg-ca
                secret:
                  secretName: platform-mesh-pg-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
            podAnnotations:
              traffic.sidecar.istio.io/excludeInboundPorts: "2112"
            postgresql:
              enabled: false
            replicaCount: 1
            telemetry:
              trace:
                enabled: false
                otlp:
                  endpoint: observability-opentelemetry-collector.openmfp-observability.svc.cluster.local:4317
                  tls:
                    enabled: false
        portal:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: portal
          syncWave: 4
          dependsOn: []
          values:
            auth:
              default:
                clientId: welcome
                clientSecretKey: attribute.client_secret
                clientSecretName: portal-client-secret-welcome
            environment: kind
            extraEnvVars:
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-bundle.crt
            - name: OPENMFP_PORTAL_CONTEXT_AUTHZ_WEBHOOK_URL
              value: https://pm-openfga-authz-webhook.platform-mesh-system.svc.cluster.local:9443
            initContainers:
            - name: combine-ca
              image: busybox:1.36
              command:
              - sh
              - -c
              - cat /domain-ca/ca.crt /webhook-ca/ca.crt > /combined-ca/ca-bundle.crt
              # busybox runs as root by default, but pod has runAsNonRoot
              securityContext:
                runAsUser: 1000
              volumeMounts:
              - name: domain-ca
                mountPath: /domain-ca
                readOnly: true
              - name: webhook-ca
                mountPath: /webhook-ca
                readOnly: true
              - name: combined-ca
                mountPath: /combined-ca
            extraVolumes:
            - name: domain-ca
              secret:
                secretName: domain-certificate
            - name: webhook-ca
              secret:
                secretName: pm-openfga-authz-webhook-cert
            - name: combined-ca
              emptyDir: {}
            extraVolumeMounts:
            - name: combined-ca
              mountPath: /etc/ssl/certs/ca-bundle.crt
              subPath: ca-bundle.crt
              readOnly: true
            gatewayApi:
              enabled: true
              httpRoute:
                parentRefs:
                - name: k8sapi-gateway
                  kind: Gateway
            kcp:
              kubeconfigSecret: portal-kubeconfig
        pm-openfga-authz-webhook:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: pm-openfga-authz-webhook
          syncWave: 4
          dependsOn: []
          values:
            certManager:
              enabled: false
            istio:
              dnsNames:
              - pm-openfga-authz-webhook.platform-mesh-system.svc.cluster.local
              exposed: false
            log:
              level: debug
            openfga:
              url: openfga:8081
        pm-keycloak-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: pm-keycloak-operator
          syncWave: 4
          dependsOn: []
          values:
            caSecret: domain-certificate
            crds:
              enabled: false
            idp:
              smtp:
                # REQUIRED: configure a production SMTP server
                server: ""
                port: ""
                fromAddress: ""
              # Production defaults: invite-only, require email verification
              registrationAllowed: false
              allowUnverifiedEmails: false
              setDefaultPassword: false
            initializer:
              kubeconfigSecret: keycloak-initializer-kubeconfig
            kubeconfigSecret: pm-keycloak-operator-kubeconfig
            log:
              level: debug
              noJson: true
            terminator:
              kubeconfigSecret: keycloak-terminator-kubeconfig
        pm-openfga-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: pm-openfga-operator
          syncWave: 4
          dependsOn: []
          values:
            caSecret: domain-certificate
            crds:
              enabled: false
            openfga:
              endpoint: openfga.platform-mesh-system.svc.cluster.local:8081
            initializer:
              kubeconfigSecret: openfga-initializer-kubeconfig
            kubeconfigSecret: pm-openfga-operator-kubeconfig
            log:
              level: debug
              noJson: true
            terminator:
              kubeconfigSecret: openfga-terminator-kubeconfig
        extension-manager-virtual-workspace:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: extension-manager-virtual-workspace
          syncWave: 4
          dependsOn: []
          targetNamespace: platform-mesh-system
          values:
            deployment:
              resourceSchemaName: "v250704-6d57f16.contentconfigurations.ui.platform-mesh.io"
              resourceSchemaWorkspace: "root:platform-mesh-system"
        marketplace:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: marketplace
          syncWave: 4
          dependsOn: []
          targetNamespace: platform-mesh-system
          values: {}
        marketplace-ui:
          dependsOn: []
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: marketplace-ui
          values:
            gatewayApi:
              enabled: true
            http:
              protocol: https
            istio:
              enabled: false
        terminal-controller-manager: {}
        observability:
          syncWave: 4
          # when enabled, enable opentelemetryOperator and prometheusOperatorCRDs component as well
      targetNamespace: platform-mesh-system
