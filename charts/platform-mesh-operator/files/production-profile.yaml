apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-mesh-profile
  namespace: platform-mesh-system
data:
  profile.yaml: |
    infra:
      deploymentTechnology: fluxcd
      ocm:
        component:
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          name: platform-mesh
        skipVerify: false
      certManager:
        # Installed or supplied by the target cluster.
        enabled: false
      gatewayApi:
        # Installed or supplied by the target cluster.
        enabled: false
      traefik:
        # Installed or supplied by the target cluster.
        enabled: false
      etcdDruid:
        # Installed or supplied by the target cluster.
        enabled: false
      traefikCRDs:
        # Installed or supplied by the target cluster.
        enabled: false
      prometheusOperatorCRDs:
        # Enable when components.observability.enabled is true
        enabled: false
        interval: 1m
        name: prometheus-operator-crds
        ocmResourceName: chart
        ocmComponentName: prometheus-operator-crds
        targetNamespace: observability
        values: {}
      opentelemetryOperator:
        # Enable when components.observability.enabled is true
        enabled: false
    components:
      # Production workloads resolve public Platform Mesh hostnames through DNS.
      # Do not route them to an implementation-specific Service ClusterIP.
      hostAliasesEntries: &hostAliasesEntries []
      deploymentTechnology: fluxcd
      ocm:
        component:
          create: true
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          create: true
          name: platform-mesh
        skipVerify: false
      services:
        account-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: account-operator
          syncWave: 4
          enabled: true
          dependsOn: []
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            crds:
              enabled: false
            kcp:
              apiExportEndpointSliceName: "core.platform-mesh.io"
            kubeconfigSecret: account-operator-kubeconfig
            log:
              level: debug
              noJson: true
            subroutines:
              fga:
                grpcAddr: openfga:8081
            tracing:
              collector:
                host: observability-opentelemetry-collector.observability.svc.cluster.local:4317
              enabled: false
        extension-manager-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: extension-manager-operator
          syncWave: 4
          enabled: true
          dependsOn: []
          values:
            crds:
              enabled: false
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            kcp:
              enabled: true
              kubeconfigSecret: extension-manager-operator-kubeconfig
            tracing:
              collector:
                host: observability-opentelemetry-collector.observability.svc.cluster.local:4317
              enabled: false
        infra:
          enabled: true
          imageResources:
          - name: keycloak-image
            resource: keycloak-image
            resourceName: keycloak-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: keycloak.operator.image.tag
          - name: busybox-image
            resource: busybox-image
            resourceName: busybox-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: keycloak.operator.waitForDb.image.tag
          - name: postgres-image
            resource: postgres-image
            resourceName: postgres-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: cnpg.cluster.image.tag
          - name: kcp-server-image
            resource: image
            absoluteReferencePath:
            - name: kcp
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.image.tag
              image-ref: combined
          - name: etcd-wrapper-image
            resource: etcd-wrapper-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.etcd.image.tag
              image-ref: combined
          - name: etcdbrctl-image
            resource: etcdbrctl-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.etcd.backup.image.tag
              image-ref: combined
          dependsOn: []
          values:
            keycloak:
              operator:
                hostname: https://{{ .baseDomainPort }}/keycloak/
                enabled: true
                # cert-manager writes the issuing CA as ca.crt in the leaf certificate Secret.
                caSecret: domain-certificate
                httpEnabled: true
                db:
                  password: keycloak-password
                admin:
                  password: admin
                  secret: admin
                health:
                  port: 9000
                  periodSeconds: 10
                  liveness:
                    path: /keycloak/health/live
                    failureThreshold: 3
                  readiness:
                    path: /keycloak/health/ready
                    initialDelaySeconds: 0
                    periodSeconds: 10
                  startup:
                    path: /keycloak/health
                    failureThreshold: 600
              gatewayApi:
                hostnames:
                  - "{{ .baseDomain }}"
              service:
                name: keycloak-service
                port: 8080
              keycloakConfig:
                url: http://keycloak-service.platform-mesh-system.svc.cluster.local:8080/keycloak
                redirectUrls: ["http://localhost:8000/callback*"]
            dex:
              enabled: false
            cnpg:
              enabled: true
              roles:
                keycloak:
                  password: keycloak-password
                openfga:
                  password: openfga-password
            gatewayApi:
              enabled: true
              gatewayClassName: __GATEWAY_CLASS_NAME__
              listeners:
                - name: terminate
                  hostname: "{{ .baseDomain }}"
                  port: __EXTERNAL_PORT__
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: domain-certificate
                        namespace: platform-mesh-system
                - name: terminate-wildstar
                  hostname: "*.{{ .baseDomain }}"
                  port: __EXTERNAL_PORT__
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: domain-certificate
                        namespace: platform-mesh-system
                - name: passthrough
                  port: __EXTERNAL_PORT__
                  protocol: TLS
                  tls:
                    mode: Passthrough
                  allowedRoutes:
                    namespaces:
                      from: All
              # Traefik accepts the hostname-less passthrough listener above, so keep it instead of the generated ones.
              passthrough:
                enabled: false
              listenersExtra:
                - name: terminate-services
                  hostname: "*.services.{{ .baseDomain }}"
                  port: __EXTERNAL_PORT__
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: domain-certificate
                        namespace: platform-mesh-system
                  allowedRoutes:
                    namespaces:
                      from: All
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            kcp:
              external:
                hostname: kcp.api.{{ .baseDomain }}
                port: __EXTERNAL_PORT__
              auth:
                serviceAccount:
                  enabled: true
              frontProxy:
                port: __EXTERNAL_PORT__
              image:
                tag: v0.33.4
              rootShard:
                hostname: "root.kcp.{{ .baseDomain }}"
                shardBaseURL: https://root.kcp.{{ .baseDomain }}:__EXTERNAL_PORT__/
                extraArgs:
                - --feature-gates=WorkspaceAuthentication=true,CacheAPIs=true
              shards:
                - name: nereus
                  hostname: nereus.kcp.{{ .baseDomain }}
                - name: triton
                  hostname: triton.kcp.{{ .baseDomain }}
              webhook:
                enabled: true
        iam-ui:
          enabled: true
          dependsOn: []
          syncWave: 4
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: iam-ui
          values:
            exposure:
              hostnames:
              - "{{ .baseDomain }}"
              - "*.{{ .baseDomain }}"
        iam-service:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: iam-service
          syncWave: 4
          enabled: true
          dependsOn: []
          values:
            caSecret: domain-certificate
            extraArgs:
            - --no-json
            keycloak:
              baseUrl: "https://{{ .baseDomainPort }}/keycloak"
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        init-agent:
          enabled: false
        kcp:
          external: true
          dependsOn: []
        kcp-operator:
          syncWave: 1
          external: true
          enabled: true
          dependsOn: []
          imageResources:
          - name: kcp-operator-image
            annotations:
              repo: oci
              artifact: image
              for: kcp-operator
              image-ref: combined
          targetNamespace: platform-mesh-system
          values: {}
        keycloak-operator:
          enabled: false
        cnpg-operator:
          enabled: false
        kubernetes-graphql-gateway:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: kubernetes-graphql-gateway
          syncWave: 4
          enabled: true
          dependsOn: []
          values:
            gateway:
              playground: true
              logLevel: trace
            gatewayApi:
              enabled: true
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            kubeConfig:
              enabled: true
              secretName: kubernetes-graphql-gateway-kubeconfig
            listener:
              virtualWorkspacesConfig:
                content:
                  virtualWorkspaces:
                  - kubeconfig: /app/kubeconfig/kubeconfig
                    name: contentconfigurations
                    url: "{{ .internalFrontProxyUrl }}/services/contentconfigurations"
                  - kubeconfig: /app/kubeconfig/kubeconfig
                    name: marketplace
                    url: "{{ .internalFrontProxyUrl }}/services/marketplace"
                enabled: true
            sentry:
              environment: dev
            tracing:
              enabled: false
            trust:
              default:
                audience: default
                jwksUrl: http://keycloak-headless.platform-mesh-system:8080/keycloak/realms/default/protocol/openid-connect/certs
                trustedIssuer: 'https://{{ .baseDomainPort }}/keycloak/realms/default'
        openfga:
          enabled: true
          external: true
          dependsOn: []
          syncWave: 2
          suspend: true
          imageResources:
          - name: openfga-image
            annotations:
              repo: oci
              artifact: image
              for: openfga
              image-ref: combined
          - name: openfga-postgresql-image
            resource: postgresql-image
            resourceName: postgresql-image
            annotations:
              repo: oci
              artifact: image
              for: openfga
              path: postgresql.image.tag
              unsuspend: "true"
          values:
            autoscaling:
              enabled: false
            checkQueryCache:
              enabled: true
              limit: 10000
              ttl: 10s
            datastore:
              applyMigrations: true
              engine: postgres
              maxOpenConns: 30
              migrationType: initContainer
              migrations:
                image:
                  pullPolicy: Always
                  repository: groundnuty/k8s-wait-for
                  tag: v2.0
              uri: postgres://postgres:openfga-password@openfga-postgres.platform-mesh-system.svc.cluster.local:5432/postgres?sslmode=disable
            extraEnvVars:
            - name: OPENFGA_EXPERIMENTALS
              value: enable-list-users
            log:
              level: info
            migrate:
              repository: openfga/openfga
              annotations:
                sidecar.istio.io/inject: "false"
            podAnnotations:
              traffic.sidecar.istio.io/excludeInboundPorts: "2112"
            postgresql:
              enabled: true
              auth:
                password: openfga-password
              image:
                registry: ghcr.io/platform-mesh
                repository: upstream-images/postgresql
                tag: 17.6.0-debian-12-r4
              nameOverride: postgres
            replicaCount: 1
            telemetry:
              trace:
                enabled: false
                otlp:
                  endpoint: observability-opentelemetry-collector.openmfp-observability.svc.cluster.local:4317
                  tls:
                    enabled: false
        portal:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: portal
          syncWave: 4
          enabled: true
          dependsOn: []
          values:
            auth:
              default:
                baseDomain: '{{ .baseDomain }}'
                clientId: welcome
                clientSecretKey: attribute.client_secret
                clientSecretName: portal-client-secret-welcome
                discoveryUrl: 'https://{{ .baseDomainPort }}/keycloak/realms/${org-name}/.well-known/openid-configuration'
            cookieDomain: '{{ .baseDomain }}'
            crdGatewayApiUrl: 'https://${org-subdomain}{{ .baseDomain }}/api/kubernetes-graphql-gateway/root:orgs:${org-name}/graphql'
            environment: kind
            extraEnvVars:
            - name: OPENMFP_PORTAL_CONTEXT_IAM_SERVICE_API_URL
              value: https://${org-subdomain}{{ .baseDomainPort }}/iam/graphql
            - name: OPENMFP_PORTAL_CONTEXT_CRD_GATEWAY_API_URL
              value: https://${org-subdomain}{{ .baseDomainPort }}/gateway/api/clusters/root:orgs:${org-name}/graphql
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-bundle.crt
            - name: OPENMFP_PORTAL_CONTEXT_AUTHZ_WEBHOOK_URL
              value: https://rebac-authz-webhook.platform-mesh-system.svc.cluster.local:9443
            initContainers:
            - name: combine-ca
              image: busybox:1.36
              command:
              - sh
              - -c
              - cat /domain-ca/ca.crt /webhook-ca/ca.crt > /combined-ca/ca-bundle.crt
              # busybox runs as root by default, but pod has runAsNonRoot
              securityContext:
                runAsUser: 1000
              volumeMounts:
              - name: domain-ca
                mountPath: /domain-ca
                readOnly: true
              - name: webhook-ca
                mountPath: /webhook-ca
                readOnly: true
              - name: combined-ca
                mountPath: /combined-ca
            extraVolumes:
            - name: domain-ca
              secret:
                secretName: domain-certificate
            - name: webhook-ca
              secret:
                secretName: rebac-authz-webhook-cert
            - name: combined-ca
              emptyDir: {}
            extraVolumeMounts:
            - name: combined-ca
              mountPath: /etc/ssl/certs/ca-bundle.crt
              subPath: ca-bundle.crt
              readOnly: true
            frontendPort: '__EXTERNAL_PORT__'
            gatewayApi:
              enabled: true
              httpRoute:
                hostnames:
                - "{{ .baseDomain }}"
                - "*.{{ .baseDomain }}"
                parentRefs:
                - name: k8sapi-gateway
                  kind: Gateway
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            http:
              protocol: https
            kcp:
              kubeconfigSecret: portal-kubeconfig
        rebac-authz-webhook:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: rebac-authz-webhook
          syncWave: 4
          enabled: true
          dependsOn: []
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            # The operator manages the webhook's Issuer and Certificate (stable
            # CA, kcp trusts it); the chart must not render its own.
            certManager:
              enabled: false
            istio:
              dnsNames:
              - rebac-authz-webhook.platform-mesh-system.svc.cluster.local
              exposed: false
            log:
              level: debug
            openfga:
              url: openfga:8081
        security-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: security-operator
          syncWave: 4
          enabled: true
          dependsOn: []
          values:
            baseDomain: '{{ .baseDomainPort }}'
            caSecret: domain-certificate
            crds:
              enabled: false
            openfga:
              endpoint: openfga.platform-mesh-system.svc.cluster.local:8081
            keycloak:
              baseUrl: 'https://{{ .baseDomainPort }}/keycloak'
            idp:
              smtp:
                # REQUIRED: configure a production SMTP server
                server: ""
                port: ""
                fromAddress: ""
              # Production defaults: invite-only, require email verification
              registrationAllowed: false
              allowUnverifiedEmails: false
              setDefaultPassword: false
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            initializer:
              kubeconfigSecret: security-initializer-kubeconfig
            kubeconfigSecret: security-operator-kubeconfig
            log:
              level: debug
              noJson: true
            terminator:
              kubeconfigSecret: security-terminator-kubeconfig
        virtual-workspaces:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: virtual-workspaces
          syncWave: 4
          enabled: true
          dependsOn: []
          targetNamespace: platform-mesh-system
          values:
            virtualWorkspaceSecretName: virtual-workspaces-cert
            # The KCP operator's in-cluster front-proxy Service exposes 443.
            serverUrl: https://frontproxy-front-proxy.platform-mesh-system:443
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            deployment:
              serverUrl: "{{ .internalFrontProxyUrl }}"
              resourceSchemaName: "v250704-6d57f16.contentconfigurations.ui.platform-mesh.io"
              resourceSchemaWorkspace: "root:platform-mesh-system"
        marketplace-ui:
          enabled: true
          dependsOn: []
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: marketplace-ui
          values:
            contentConfig:
              baseDomain: '{{ .baseDomain }}'
              protocol: https
            exposure:
              hostnames:
              - "{{ .baseDomain }}"
              - "*.{{ .baseDomain }}"
            gatewayApi:
              enabled: true
            http:
              protocol: https
            istio:
              enabled: false
        terminal-controller-manager:
          enabled: false
        observability:
          syncWave: 4
          # when enabled, enable opentelemetryOperator and prometheusOperatorCRDs component as well
          enabled: false
      targetNamespace: platform-mesh-system
