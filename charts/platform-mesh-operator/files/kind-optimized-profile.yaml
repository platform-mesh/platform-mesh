# Backend-only overrides merged into kind-profile.yaml at installation.
# Keep shared configuration in the base profile.
components:
  services:
    portal:
      enabled: false
    extension-manager-operator:
      enabled: false
    iam-ui:
      enabled: false
    iam-service:
      enabled: false
    marketplace-ui:
      enabled: false
    virtual-workspaces:
      enabled: false
    kubernetes-graphql-gateway:
      enabled: false
    infra:
      values:
        keycloak:
          operator:
            resources:
              requests:
                memory: 1Gi
              limits:
                memory: 2Gi
        kcp:
          cacheServer:
            replicas: 1
          proxy:
            replicas: 1
          frontProxy:
            # These mappings target virtual-workspaces, disabled above.
            additionalPathMappings: []
          rootShard:
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 2Gi
          etcd:
            resources:
              requests:
                memory: 128Mi
            backup:
              resources:
                requests:
                  memory: 64Mi
    security-operator:
      values:
        deployment:
          resources:
            requests:
              cpu: 75m
              memory: 64Mi
