apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-mesh-profile
  namespace: platform-mesh-system
data:
  profile.yaml: |
    infra:
      deploymentTechnology: fluxcd
      ocm:
        component:
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          name: platform-mesh
        skipVerify: true
    components:
      # -- Change hostaliases here and all involved components will get the same hostaliases
      hostAliasesEntries: &hostAliasesEntries
        # REQUIRED: set the host aliases for kcp shards
        - ip: "__GATEWAY_SERVICE_CLUSTER_IP__"
          hostnames:
            - "{{ .baseDomain }}"
            - "kcp.api.{{ .baseDomain }}"
            - "root.kcp.{{ .baseDomain }}"
      deploymentTechnology: fluxcd
      ocm:
        component:
          create: true
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          create: true
          name: platform-mesh
        skipVerify: true
      services:
        account-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: account-operator
          syncWave: 4
          enabled: true
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        extension-manager-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: extension-manager-operator
          syncWave: 4
          enabled: true
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        infra:
          enabled: true
          imageResources:
          - name: keycloak-image
            resource: keycloak-image
            resourceName: keycloak-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: keycloak.operator.image.tag
          - name: busybox-image
            resource: busybox-image
            resourceName: busybox-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: keycloak.operator.waitForDb.image.tag
          - name: postgres-image
            resource: postgres-image
            resourceName: postgres-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: cnpg.cluster.image.tag
          - name: kcp-server-image
            resource: image
            absoluteReferencePath:
            - name: kcp
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.image.tag
              image-ref: combined
          - name: etcd-wrapper-image
            resource: etcd-wrapper-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.etcd.image.tag
              image-ref: combined
          - name: etcdbrctl-image
            resource: etcdbrctl-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.etcd.backup.image.tag
              image-ref: combined
          values:
            keycloak:
              operator:
                hostname: https://{{ .baseDomainPort }}/keycloak/
                enabled: true
              gatewayApi:
                hostnames:
                  - "{{ .baseDomain }}"
            cnpg:
              enabled: true
            gatewayApi:
              enabled: true
              gatewayClassName: __GATEWAY_CLASS_NAME__
              port: 8443
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            kcp:
              external:
                hostname: kcp.api.{{ .baseDomain }}
                port: 8443
              auth:
                serviceAccount:
                  enabled: true
              frontProxy:
                port: 8443
              rootShard:
                hostname: "root.kcp.{{ .baseDomain }}"
                shardBaseURL: https://root.kcp.{{ .baseDomain }}:8443/
                extraArgs:
                - --feature-gates=WorkspaceAuthentication=true,CacheAPIs=true
              shards: []
              webhook:
                enabled: true
        iam-ui:
          enabled: true
          syncWave: 4
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: iam-ui
          values:
            exposure:
              hostnames:
              - "{{ .baseDomain }}"
              - "*.{{ .baseDomain }}"
        iam-service:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: iam-service
          syncWave: 4
          enabled: true
          values:
            keycloak:
              baseUrl: "https://{{ .baseDomainPort }}/keycloak"
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        kcp:
          external: true
        kcp-operator:
          syncWave: 1
          external: true
          enabled: true
          imageResources:
          - name: kcp-operator-image
            annotations:
              repo: oci
              artifact: image
              for: kcp-operator
              image-ref: combined
          targetNamespace: platform-mesh-system
        kubernetes-graphql-gateway:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: kubernetes-graphql-gateway
          syncWave: 4
          enabled: true
          values:
            gateway:
              playground: true
              logLevel: trace
            gatewayApi:
              enabled: true
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            kubeConfig:
              enabled: true
              secretName: kubernetes-graphql-gateway-kubeconfig
            listener:
              virtualWorkspacesConfig:
                content:
                  virtualWorkspaces:
                  - kubeconfig: /app/kubeconfig/kubeconfig
                    name: contentconfigurations
                    url: "{{ .internalFrontProxyUrl }}/services/contentconfigurations"
                  - kubeconfig: /app/kubeconfig/kubeconfig
                    name: marketplace
                    url: "{{ .internalFrontProxyUrl }}/services/marketplace"
                enabled: true
            sentry:
              environment: dev
            trust:
              default:
                audience: default
                jwksUrl: http://keycloak-headless.platform-mesh-system:8080/keycloak/realms/default/protocol/openid-connect/certs
                trustedIssuer: 'https://{{ .baseDomainPort }}/keycloak/realms/default'
        openfga:
          enabled: true
          external: true
          syncWave: 2
          suspend: true
          imageResources:
          - name: openfga-image
            annotations:
              repo: oci
              artifact: image
              for: openfga
              image-ref: combined
          - name: openfga-postgresql-image
            resource: postgresql-image
            resourceName: postgresql-image
            annotations:
              repo: oci
              artifact: image
              for: openfga
              path: postgresql.image.tag
              unsuspend: "true"
          values:
            autoscaling:
              enabled: false
            checkQueryCache:
              enabled: true
              limit: 10000
              ttl: 10s
            datastore:
              applyMigrations: true
              engine: postgres
              existingSecret: cnpg-openfga-user
              maxOpenConns: 30
              migrationType: initContainer
              migrations:
                image:
                  pullPolicy: Always
                  repository: groundnuty/k8s-wait-for
                  tag: v2.0
              secretKeys:
                passwordKey: password
                usernameKey: username
              uri: postgres://platform-mesh-pg-rw.platform-mesh-system.svc.cluster.local:5432/openfga?sslmode=verify-full&sslrootcert=/etc/openfga/cnpg-ca/ca.crt
            extraEnvVars:
            - name: OPENFGA_EXPERIMENTALS
              value: enable-list-users
            extraVolumeMounts:
            - mountPath: /etc/openfga/cnpg-ca
              name: cnpg-ca
              readOnly: true
            extraVolumes:
            - name: cnpg-ca
              secret:
                secretName: platform-mesh-pg-ca
                items:
                  - key: ca.crt
                    path: ca.crt
            image:
              tag: v1.11.2
            log:
              level: info
            migrate:
              repository: openfga/openfga
              annotations:
                sidecar.istio.io/inject: "false"
              extraVolumeMounts:
              - mountPath: /etc/openfga/cnpg-ca
                name: cnpg-ca
                readOnly: true
              extraVolumes:
              - name: cnpg-ca
                secret:
                  secretName: platform-mesh-pg-ca
                  items:
                  - key: ca.crt
                    path: ca.crt
            podAnnotations:
              traffic.sidecar.istio.io/excludeInboundPorts: "2112"
            postgresql:
              enabled: false
            replicaCount: 1
            telemetry:
              trace:
                enabled: false
                otlp:
                  endpoint: observability-opentelemetry-collector.openmfp-observability.svc.cluster.local:4317
                  tls:
                    enabled: false
        portal:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: portal
          syncWave: 4
          enabled: true
          values:
            baseDomain: '{{ .baseDomain }}'
            auth:
              default:
                baseDomain: '{{ .baseDomain }}'
                discoveryUrl: 'https://{{ .baseDomainPort }}/keycloak/realms/${org-name}/.well-known/openid-configuration'
            cookieDomain: '{{ .baseDomain }}'
            crdGatewayApiUrl: 'https://${org-subdomain}{{ .baseDomain }}/api/kubernetes-graphql-gateway/root:orgs:${org-name}/graphql'
            environment: kind
            extraEnvVars:
            - name: OPENMFP_PORTAL_CONTEXT_IAM_SERVICE_API_URL
              value: https://${org-subdomain}{{ .baseDomainPort }}/iam/graphql
            - name: OPENMFP_PORTAL_CONTEXT_CRD_GATEWAY_API_URL
              value: https://${org-subdomain}{{ .baseDomainPort }}/gateway/api/clusters/root:orgs:${org-name}/graphql
            - name: OPENMFP_PORTAL_CONTEXT_AUTHZ_WEBHOOK_URL
              value: https://rebac-authz-webhook.platform-mesh-system.svc.cluster.local:9443
            frontendPort: '8443'
            gatewayApi:
              httpRoute:
                hostnames:
                - "{{ .baseDomain }}"
                - "*.{{ .baseDomain }}"
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        rebac-authz-webhook:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: rebac-authz-webhook
          syncWave: 4
          enabled: true
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        security-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: security-operator
          syncWave: 4
          enabled: true
          values:
            baseDomain: '{{ .baseDomainPort }}'
            keycloak:
              baseUrl: 'https://{{ .baseDomainPort }}/keycloak'
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        virtual-workspaces:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: virtual-workspaces
          syncWave: 4
          enabled: true
          targetNamespace: platform-mesh-system
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            deployment:
              serverUrl: "{{ .internalFrontProxyUrl }}"
        marketplace-ui:
          enabled: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: marketplace-ui
          values:
            contentConfig:
              baseDomain: '{{ .baseDomain }}'
            exposure:
              hostnames:
              - "{{ .baseDomain }}"
              - "*.{{ .baseDomain }}"
            gatewayApi:
              enabled: true
        terminal-controller-manager:
          enabled: false
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: terminal-controller-manager
          - name: terminal-image
            annotations:
              path: terminal.image.tag
              for: terminal-controller-manager
              repo: oci
              artifact: image
            resource: terminal-image
            referencePath:
            - name: terminal-controller-manager
      targetNamespace: platform-mesh-system
