apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-mesh-profile
  namespace: platform-mesh-system
data:
  profile.yaml: |
    infra:
      deploymentTechnology: fluxcd
      ocm:
        component:
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          name: platform-mesh
        skipVerify: true
      certManager:
        # Installed by platform-mesh-prerequisites.
        enabled: false
      etcdDruid:
        # Installed by platform-mesh-prerequisites.
        enabled: false
      prometheusOperatorCRDs:
        enabled: false
      opentelemetryOperator:
        enabled: false
    components:
      # -- Change hostaliases here and all involved components will get the same hostaliases
      hostAliasesEntries: &hostAliasesEntries
        # REQUIRED: set the host aliases for kcp shards
        - ip: "__GATEWAY_SERVICE_CLUSTER_IP__"
          hostnames:
            - "{{ .baseDomain }}"
            - "kcp.api.{{ .baseDomain }}"
            - "root.kcp.{{ .baseDomain }}"
      deploymentTechnology: fluxcd
      ocm:
        component:
          create: true
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          create: true
          name: platform-mesh
        skipVerify: true
      services:
        account-operator:
          # Installed once its image is known: a HelmRelease applied before the
          # operator has filled in the image runs the chart's default, and Flux
          # then waits out the install timeout on an image that may not exist.
          # The same goes for the services below.
          suspend: true
          syncWave: 4
          dependsOn: []
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            crds:
              enabled: false
            kcp:
              apiExportEndpointSliceName: "core.platform-mesh.io"
            kubeconfigSecret: account-operator-kubeconfig
            log:
              level: debug
              noJson: true
            subroutines:
              fga:
                grpcAddr: openfga:8081
            tracing:
              collector:
                host: observability-opentelemetry-collector.observability.svc.cluster.local:4317
              enabled: false
        extension-manager-operator:
          suspend: true
          syncWave: 4
          dependsOn: []
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            kcp:
              enabled: true
              kubeconfigSecret: extension-manager-operator-kubeconfig
            tracing:
              collector:
                host: observability-opentelemetry-collector.observability.svc.cluster.local:4317
              enabled: false
        infra:
          # The chart creates kcp-operator resources (RootShard, CacheServer,
          # FrontProxy). Without their CRDs its install fails, and the retry
          # can starve: the other installs take every worker of the
          # helm-controller while they wait for kcp.
          dependsOn:
          - name: kcp-operator
          values:
            keycloak:
              operator:
                enabled: true
                # cert-manager writes the issuing CA as ca.crt in the leaf certificate Secret.
                caSecret: domain-certificate
                httpEnabled: true
                db:
                  password: keycloak-password
                admin:
                  password: admin
                  secret: admin
                health:
                  port: 9000
                  periodSeconds: 10
                  liveness:
                    path: /keycloak/health/live
                    failureThreshold: 3
                  readiness:
                    path: /keycloak/health/ready
                    initialDelaySeconds: 0
                    periodSeconds: 10
                  startup:
                    path: /keycloak/health
                    failureThreshold: 600
              service:
                name: keycloak-service
                port: 8080
              keycloakConfig:
                url: http://keycloak-service.platform-mesh-system.svc.cluster.local:8080/keycloak
                redirectUrls: ["http://localhost:8000/callback*"]
            dex:
              enabled: false
            cnpg:
              enabled: true
              cluster:
                instances: 1
              roles:
                keycloak:
                  password: keycloak-password
                openfga:
                  password: openfga-password
            gatewayApi:
              enabled: true
              passthrough:
                enabled: true
            kcp:
              auth:
                serviceAccount:
                  enabled: true
              proxy:
                replicas: 1
              # One kind node: a single cache server, and CPU requests far
              # below what kcp-operator defaults to (1 CPU per shard, 500m
              # per cache server), so the installation fits on 4 CPUs.
              cacheServer:
                replicas: 1
                resources:
                  requests:
                    cpu: 50m
                    memory: 256Mi
              rootShard:
                extraArgs:
                - --feature-gates=WorkspaceAuthentication=true,CacheAPIs=true
                resources:
                  requests:
                    cpu: 100m
                    memory: 512Mi
              shards: []
              webhook:
                enabled: true
        iam-ui:
          dependsOn: []
          syncWave: 4
          suspend: true
          values: {}
        iam-service:
          suspend: true
          syncWave: 4
          dependsOn: []
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            caSecret: domain-certificate
            extraArgs:
            - --no-json
        kcp:
          external: true
          dependsOn: []
        kcp-operator:
          syncWave: 1
          external: true
          # The chart comes from kcp's Helm repository, not from an OCI registry
          # (third_party/kcp-operator/component-constructor.yaml).
          helmRepo: true
          dependsOn: []
          targetNamespace: platform-mesh-system
          values: {}
        keycloak-operator:
          # Installed by platform-mesh-prerequisites.
          external: true
          dependsOn: []
          absoluteReferencePath:
            - name: keycloak-operator
            - name: chart
          values:
            watchNamespaces: platform-mesh-system
        cnpg-operator:
          # Installed by platform-mesh-prerequisites.
          external: true
          dependsOn: []
          targetNamespace: platform-mesh-system
          absoluteReferencePath:
          - name: cnpg-operator
          values: {}
        kubernetes-graphql-gateway:
          suspend: true
          syncWave: 4
          dependsOn: []
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            gateway:
              playground: true
              logLevel: trace
              resources:
                requests:
                  cpu: 50m
            gatewayApi:
              enabled: true
            kubeConfig:
              enabled: true
              secretName: kubernetes-graphql-gateway-kubeconfig
            listener:
              resources:
                requests:
                  cpu: 50m
            sentry:
              environment: dev
            tracing:
              enabled: false
        openfga:
          external: true
          dependsOn: []
          syncWave: 2
          suspend: true
          values:
            autoscaling:
              enabled: false
            checkQueryCache:
              enabled: true
              limit: 10000
              ttl: 10s
            datastore:
              applyMigrations: true
              engine: postgres
              existingSecret: cnpg-openfga-user
              maxOpenConns: 30
              migrationType: initContainer
              migrations:
                image:
                  pullPolicy: Always
                  repository: groundnuty/k8s-wait-for
                  tag: v2.0
              secretKeys:
                passwordKey: password
                usernameKey: username
              uri: postgres://platform-mesh-pg-rw.platform-mesh-system.svc.cluster.local:5432/openfga?sslmode=verify-full&sslrootcert=/etc/openfga/cnpg-ca/ca.crt
            extraEnvVars:
            - name: OPENFGA_EXPERIMENTALS
              value: enable-list-users
            extraVolumeMounts:
            - mountPath: /etc/openfga/cnpg-ca
              name: cnpg-ca
              readOnly: true
            extraVolumes:
            - name: cnpg-ca
              secret:
                secretName: platform-mesh-pg-ca
                items:
                  - key: ca.crt
                    path: ca.crt
            image:
              tag: v1.11.2
            log:
              level: info
            migrate:
              repository: openfga/openfga
              annotations:
                sidecar.istio.io/inject: "false"
              extraVolumeMounts:
              - mountPath: /etc/openfga/cnpg-ca
                name: cnpg-ca
                readOnly: true
              extraVolumes:
              - name: cnpg-ca
                secret:
                  secretName: platform-mesh-pg-ca
                  items:
                  - key: ca.crt
                    path: ca.crt
            podAnnotations:
              traffic.sidecar.istio.io/excludeInboundPorts: "2112"
            postgresql:
              enabled: false
            replicaCount: 1
            telemetry:
              trace:
                enabled: false
                otlp:
                  endpoint: observability-opentelemetry-collector.openmfp-observability.svc.cluster.local:4317
                  tls:
                    enabled: false
        portal:
          suspend: true
          syncWave: 4
          dependsOn: []
          values:
            auth:
              default:
                clientId: welcome
                clientSecretKey: attribute.client_secret
                clientSecretName: portal-client-secret-welcome
            environment: kind
            extraEnvVars:
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-bundle.crt
            - name: OPENMFP_PORTAL_CONTEXT_AUTHZ_WEBHOOK_URL
              value: https://pm-openfga-authz-webhook.platform-mesh-system.svc.cluster.local:9443
            initContainers:
            - name: combine-ca
              image: busybox:1.36
              command:
              - sh
              - -c
              - cat /domain-ca/ca.crt /webhook-ca/ca.crt > /combined-ca/ca-bundle.crt
              # busybox runs as root by default, but pod has runAsNonRoot
              securityContext:
                runAsUser: 1000
              volumeMounts:
              - name: domain-ca
                mountPath: /domain-ca
                readOnly: true
              - name: webhook-ca
                mountPath: /webhook-ca
                readOnly: true
              - name: combined-ca
                mountPath: /combined-ca
            extraVolumes:
            - name: domain-ca
              secret:
                secretName: domain-certificate
            - name: webhook-ca
              secret:
                secretName: pm-openfga-authz-webhook-cert
            - name: combined-ca
              emptyDir: {}
            extraVolumeMounts:
            - name: combined-ca
              mountPath: /etc/ssl/certs/ca-bundle.crt
              subPath: ca-bundle.crt
              readOnly: true
            gatewayApi:
              enabled: true
              httpRoute:
                parentRefs:
                - name: k8sapi-gateway
                  kind: Gateway
            kcp:
              kubeconfigSecret: portal-kubeconfig
        pm-openfga-authz-webhook:
          suspend: true
          syncWave: 4
          dependsOn: []
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            certManager:
              enabled: false
            istio:
              dnsNames:
              - pm-openfga-authz-webhook.platform-mesh-system.svc.cluster.local
              exposed: false
            log:
              level: debug
            openfga:
              url: openfga:8081
        pm-keycloak-operator:
          suspend: true
          syncWave: 4
          dependsOn: []
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            caSecret: domain-certificate
            crds:
              enabled: false
            # Each of the chart's three Deployments requests this.
            deployment:
              resources:
                requests:
                  cpu: 50m
            idp:
              smtp:
                # REQUIRED: configure a production SMTP server
                server: ""
                port: ""
                fromAddress: ""
              # Production defaults: invite-only, require email verification
              registrationAllowed: false
              allowUnverifiedEmails: false
              setDefaultPassword: false
            initializer:
              kubeconfigSecret: keycloak-initializer-kubeconfig
            kubeconfigSecret: pm-keycloak-operator-kubeconfig
            log:
              level: debug
              noJson: true
            terminator:
              kubeconfigSecret: keycloak-terminator-kubeconfig
        pm-openfga-operator:
          suspend: true
          syncWave: 4
          dependsOn: []
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            caSecret: domain-certificate
            crds:
              enabled: false
            # Each of the chart's five Deployments requests this.
            deployment:
              resources:
                requests:
                  cpu: 50m
            openfga:
              endpoint: openfga.platform-mesh-system.svc.cluster.local:8081
            initializer:
              kubeconfigSecret: openfga-initializer-kubeconfig
            kubeconfigSecret: pm-openfga-operator-kubeconfig
            log:
              level: debug
              noJson: true
            terminator:
              kubeconfigSecret: openfga-terminator-kubeconfig
        extension-manager-virtual-workspace:
          suspend: true
          syncWave: 4
          dependsOn: []
          targetNamespace: platform-mesh-system
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            deployment:
              resourceSchemaName: "v250704-6d57f16.contentconfigurations.ui.platform-mesh.io"
              resourceSchemaWorkspace: "root:platform-mesh-system"
        marketplace:
          suspend: true
          syncWave: 4
          dependsOn: []
          targetNamespace: platform-mesh-system
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        marketplace-ui:
          dependsOn: []
          suspend: true
          values:
            gatewayApi:
              enabled: true
            http:
              protocol: https
            istio:
              enabled: false
        terminal-controller-manager:
          dependsOn: []
          values:
            kcp:
              kubeconfigSecret: terminal-controller-manager-kubeconfig
        observability:
          syncWave: 4
          targetNamespace: observability
          dependsOn: []
          values:
            prometheus:
              server:
                persistentVolume:
                  enabled: false
                extraFlags:
                - web.enable-remote-write-receiver
              alertmanager:
                enabled: false
              prometheus-node-exporter:
                enabled: false
              prometheus-pushgateway:
                enabled: false
              kube-state-metrics:
                enabled: false
      targetNamespace: platform-mesh-system
