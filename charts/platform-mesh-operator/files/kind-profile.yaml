apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-mesh-profile
  namespace: platform-mesh-system
data:
  profile.yaml: |
    infra:
      deploymentTechnology: fluxcd
      ocm:
        component:
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          name: platform-mesh
        skipVerify: true
      certManager:
        # Installed by platform-mesh-prerequisites.
        enabled: false
      etcdDruid:
        # Installed by platform-mesh-prerequisites.
        enabled: false
      prometheusOperatorCRDs:
        enabled: false
      opentelemetryOperator:
        enabled: false
    components:
      # -- Change hostaliases here and all involved components will get the same hostaliases
      hostAliasesEntries: &hostAliasesEntries
        # REQUIRED: set the host aliases for kcp shards
        - ip: "__GATEWAY_SERVICE_CLUSTER_IP__"
          hostnames:
            - "{{ .baseDomain }}"
            - "kcp.api.{{ .baseDomain }}"
            - "root.kcp.{{ .baseDomain }}"
      deploymentTechnology: fluxcd
      ocm:
        component:
          create: true
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          create: true
          name: platform-mesh
        skipVerify: true
      services:
        account-operator:
          syncWave: 4
          dependsOn: []
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            crds:
              enabled: false
            kcp:
              apiExportEndpointSliceName: "core.platform-mesh.io"
            kubeconfigSecret: account-operator-kubeconfig
            log:
              level: debug
              noJson: true
            subroutines:
              fga:
                grpcAddr: openfga:8081
            tracing:
              collector:
                host: observability-opentelemetry-collector.observability.svc.cluster.local:4317
              enabled: false
        extension-manager-operator:
          syncWave: 4
          dependsOn: []
          values:
            crds:
              enabled: false
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            kcp:
              enabled: true
              kubeconfigSecret: extension-manager-operator-kubeconfig
            tracing:
              collector:
                host: observability-opentelemetry-collector.observability.svc.cluster.local:4317
              enabled: false
        infra:
          dependsOn: []
          values:
            keycloak:
              operator:
                hostname: https://{{ .baseDomainPort }}/keycloak/
                enabled: true
                # cert-manager writes the issuing CA as ca.crt in the leaf certificate Secret.
                caSecret: domain-certificate
                httpEnabled: true
                db:
                  password: keycloak-password
                admin:
                  password: admin
                  secret: admin
                health:
                  port: 9000
                  periodSeconds: 10
                  liveness:
                    path: /keycloak/health/live
                    failureThreshold: 3
                  readiness:
                    path: /keycloak/health/ready
                    initialDelaySeconds: 0
                    periodSeconds: 10
                  startup:
                    path: /keycloak/health
                    failureThreshold: 600
              gatewayApi:
                hostnames:
                  - "{{ .baseDomain }}"
              service:
                name: keycloak-service
                port: 8080
              keycloakConfig:
                url: http://keycloak-service.platform-mesh-system.svc.cluster.local:8080/keycloak
                redirectUrls: ["http://localhost:8000/callback*"]
            dex:
              enabled: false
            cnpg:
              enabled: true
              cluster:
                instances: 1
              roles:
                keycloak:
                  password: keycloak-password
                openfga:
                  password: openfga-password
            gatewayApi:
              enabled: true
              gatewayClassName: __GATEWAY_CLASS_NAME__
              listeners:
                - name: terminate
                  hostname: "{{ .baseDomain }}"
                  port: 8443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: domain-certificate
                        namespace: platform-mesh-system
                - name: terminate-wildstar
                  hostname: "*.{{ .baseDomain }}"
                  port: 8443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: domain-certificate
                        namespace: platform-mesh-system
              passthrough:
                enabled: true
                port: 8443
              listenersExtra:
                - name: terminate-services
                  hostname: "*.services.{{ .baseDomain }}"
                  port: 8443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: domain-certificate
                        namespace: platform-mesh-system
                  allowedRoutes:
                    namespaces:
                      from: All
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            kcp:
              external:
                hostname: kcp.api.{{ .baseDomain }}
                port: 8443
              auth:
                serviceAccount:
                  enabled: true
              frontProxy:
                port: 8443
              rootShard:
                hostname: "root.kcp.{{ .baseDomain }}"
                shardBaseURL: https://root.kcp.{{ .baseDomain }}:8443/
                extraArgs:
                - --feature-gates=WorkspaceAuthentication=true,CacheAPIs=true
              shards: []
              webhook:
                enabled: true
        iam-ui:
          dependsOn: []
          syncWave: 4
          values:
            exposure:
              hostnames:
              - "{{ .baseDomain }}"
              - "*.{{ .baseDomain }}"
        iam-service:
          syncWave: 4
          dependsOn: []
          values:
            caSecret: domain-certificate
            extraArgs:
            - --no-json
            keycloak:
              baseUrl: "https://{{ .baseDomainPort }}/keycloak"
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        kcp:
          external: true
          dependsOn: []
        kcp-operator:
          syncWave: 1
          external: true
          # The chart comes from kcp's Helm repository, not from an OCI registry
          # (third_party/kcp-operator/component-constructor.yaml).
          helmRepo: true
          dependsOn: []
          targetNamespace: platform-mesh-system
          values: {}
        keycloak-operator:
          # Installed by platform-mesh-prerequisites.
          external: true
          dependsOn: []
          absoluteReferencePath:
            - name: keycloak-operator
            - name: chart
          values:
            watchNamespaces: platform-mesh-system
        cnpg-operator:
          # Installed by platform-mesh-prerequisites.
          external: true
          dependsOn: []
          targetNamespace: platform-mesh-system
          absoluteReferencePath:
          - name: cnpg-operator
          values: {}
        kubernetes-graphql-gateway:
          syncWave: 4
          dependsOn: []
          values:
            gateway:
              playground: true
              logLevel: trace
            gatewayApi:
              enabled: true
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            kubeConfig:
              enabled: true
              secretName: kubernetes-graphql-gateway-kubeconfig
            listener:
              virtualWorkspacesConfig:
                content:
                  virtualWorkspaces:
                  - kubeconfig: /app/kubeconfig/kubeconfig
                    name: contentconfigurations
                    url: "{{ .internalFrontProxyUrl }}/services/contentconfigurations"
                  - kubeconfig: /app/kubeconfig/kubeconfig
                    name: marketplace
                    url: "{{ .internalFrontProxyUrl }}/services/marketplace"
                enabled: true
            sentry:
              environment: dev
            tracing:
              enabled: false
            trust:
              default:
                audience: default
                jwksUrl: http://keycloak-headless.platform-mesh-system:8080/keycloak/realms/default/protocol/openid-connect/certs
                trustedIssuer: 'https://{{ .baseDomainPort }}/keycloak/realms/default'
        openfga:
          external: true
          dependsOn: []
          syncWave: 2
          suspend: true
          values:
            autoscaling:
              enabled: false
            checkQueryCache:
              enabled: true
              limit: 10000
              ttl: 10s
            datastore:
              applyMigrations: true
              engine: postgres
              existingSecret: cnpg-openfga-user
              maxOpenConns: 30
              migrationType: initContainer
              migrations:
                image:
                  pullPolicy: Always
                  repository: groundnuty/k8s-wait-for
                  tag: v2.0
              secretKeys:
                passwordKey: password
                usernameKey: username
              uri: postgres://platform-mesh-pg-rw.platform-mesh-system.svc.cluster.local:5432/openfga?sslmode=verify-full&sslrootcert=/etc/openfga/cnpg-ca/ca.crt
            extraEnvVars:
            - name: OPENFGA_EXPERIMENTALS
              value: enable-list-users
            extraVolumeMounts:
            - mountPath: /etc/openfga/cnpg-ca
              name: cnpg-ca
              readOnly: true
            extraVolumes:
            - name: cnpg-ca
              secret:
                secretName: platform-mesh-pg-ca
                items:
                  - key: ca.crt
                    path: ca.crt
            image:
              tag: v1.11.2
            log:
              level: info
            migrate:
              repository: openfga/openfga
              annotations:
                sidecar.istio.io/inject: "false"
              extraVolumeMounts:
              - mountPath: /etc/openfga/cnpg-ca
                name: cnpg-ca
                readOnly: true
              extraVolumes:
              - name: cnpg-ca
                secret:
                  secretName: platform-mesh-pg-ca
                  items:
                  - key: ca.crt
                    path: ca.crt
            podAnnotations:
              traffic.sidecar.istio.io/excludeInboundPorts: "2112"
            postgresql:
              enabled: false
            replicaCount: 1
            telemetry:
              trace:
                enabled: false
                otlp:
                  endpoint: observability-opentelemetry-collector.openmfp-observability.svc.cluster.local:4317
                  tls:
                    enabled: false
        portal:
          syncWave: 4
          dependsOn: []
          values:
            auth:
              default:
                baseDomain: '{{ .baseDomain }}'
                clientId: welcome
                clientSecretKey: attribute.client_secret
                clientSecretName: portal-client-secret-welcome
                discoveryUrl: 'https://{{ .baseDomainPort }}/keycloak/realms/${org-name}/.well-known/openid-configuration'
            cookieDomain: '{{ .baseDomain }}'
            crdGatewayApiUrl: 'https://${org-subdomain}{{ .baseDomain }}/api/kubernetes-graphql-gateway/root:orgs:${org-name}/graphql'
            environment: kind
            extraEnvVars:
            - name: OPENMFP_PORTAL_CONTEXT_IAM_SERVICE_API_URL
              value: https://${org-subdomain}{{ .baseDomainPort }}/iam/graphql
            - name: OPENMFP_PORTAL_CONTEXT_CRD_GATEWAY_API_URL
              value: https://${org-subdomain}{{ .baseDomainPort }}/gateway/api/clusters/root:orgs:${org-name}/graphql
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-bundle.crt
            - name: OPENMFP_PORTAL_CONTEXT_AUTHZ_WEBHOOK_URL
              value: https://rebac-authz-webhook.platform-mesh-system.svc.cluster.local:9443
            initContainers:
            - name: combine-ca
              image: busybox:1.36
              command:
              - sh
              - -c
              - cat /domain-ca/ca.crt /webhook-ca/ca.crt > /combined-ca/ca-bundle.crt
              # busybox runs as root by default, but pod has runAsNonRoot
              securityContext:
                runAsUser: 1000
              volumeMounts:
              - name: domain-ca
                mountPath: /domain-ca
                readOnly: true
              - name: webhook-ca
                mountPath: /webhook-ca
                readOnly: true
              - name: combined-ca
                mountPath: /combined-ca
            extraVolumes:
            - name: domain-ca
              secret:
                secretName: domain-certificate
            - name: webhook-ca
              secret:
                secretName: rebac-authz-webhook-cert
            - name: combined-ca
              emptyDir: {}
            extraVolumeMounts:
            - name: combined-ca
              mountPath: /etc/ssl/certs/ca-bundle.crt
              subPath: ca-bundle.crt
              readOnly: true
            frontendPort: '8443'
            gatewayApi:
              enabled: true
              httpRoute:
                hostnames:
                - "{{ .baseDomain }}"
                - "*.{{ .baseDomain }}"
                parentRefs:
                - name: k8sapi-gateway
                  kind: Gateway
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            http:
              protocol: https
            kcp:
              kubeconfigSecret: portal-kubeconfig
        rebac-authz-webhook:
          syncWave: 4
          dependsOn: []
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            certManager:
              enabled: false
            istio:
              dnsNames:
              - rebac-authz-webhook.platform-mesh-system.svc.cluster.local
              exposed: false
            log:
              level: debug
            openfga:
              url: openfga:8081
        security-operator:
          syncWave: 4
          dependsOn: []
          values:
            baseDomain: '{{ .baseDomainPort }}'
            caSecret: domain-certificate
            crds:
              enabled: false
            openfga:
              endpoint: openfga.platform-mesh-system.svc.cluster.local:8081
            keycloak:
              baseUrl: 'https://{{ .baseDomainPort }}/keycloak'
            idp:
              smtp:
                # REQUIRED: configure a production SMTP server
                server: ""
                port: ""
                fromAddress: ""
              # Production defaults: invite-only, require email verification
              registrationAllowed: false
              allowUnverifiedEmails: false
              setDefaultPassword: false
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            initializer:
              kubeconfigSecret: security-initializer-kubeconfig
            kubeconfigSecret: security-operator-kubeconfig
            log:
              level: debug
              noJson: true
            terminator:
              kubeconfigSecret: security-terminator-kubeconfig
        virtual-workspaces:
          syncWave: 4
          dependsOn: []
          targetNamespace: platform-mesh-system
          values:
            virtualWorkspaceSecretName: virtual-workspaces-cert
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            deployment:
              serverUrl: "{{ .internalFrontProxyUrl }}"
              resourceSchemaName: "v250704-6d57f16.contentconfigurations.ui.platform-mesh.io"
              resourceSchemaWorkspace: "root:platform-mesh-system"
        marketplace-ui:
          dependsOn: []
          values:
            contentConfig:
              baseDomain: '{{ .baseDomain }}'
              protocol: https
            exposure:
              hostnames:
              - "{{ .baseDomain }}"
              - "*.{{ .baseDomain }}"
            gatewayApi:
              enabled: true
            http:
              protocol: https
            istio:
              enabled: false
        terminal-controller-manager:
          dependsOn: []
          values:
            kcp:
              kubeconfigSecret: terminal-controller-manager-kubeconfig
        observability:
          syncWave: 4
          targetNamespace: observability
          dependsOn: []
          values:
            prometheus:
              server:
                persistentVolume:
                  enabled: false
                extraFlags:
                - web.enable-remote-write-receiver
              alertmanager:
                enabled: false
              prometheus-node-exporter:
                enabled: false
              prometheus-pushgateway:
                enabled: false
              kube-state-metrics:
                enabled: false
      targetNamespace: platform-mesh-system
