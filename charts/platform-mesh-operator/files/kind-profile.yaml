apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-mesh-profile
  namespace: platform-mesh-system
data:
  profile.yaml: |
    infra:
      deploymentTechnology: fluxcd
      ocm:
        component:
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          name: platform-mesh
        skipVerify: true
    components:
      # -- Change hostaliases here and all involved components will get the same hostaliases
      hostAliasesEntries: &hostAliasesEntries
        # REQUIRED: set the host aliases for kcp shards
        - ip: "__GATEWAY_SERVICE_CLUSTER_IP__"
          hostnames:
            - "{{ .baseDomain }}"
            - "kcp.api.{{ .baseDomain }}"
            - "root.kcp.{{ .baseDomain }}"
      deploymentTechnology: fluxcd
      ocm:
        component:
          create: true
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          create: true
          name: platform-mesh
        skipVerify: true
      services:
        account-operator:
          # Installed once its image is known: a HelmRelease applied before the
          # operator has filled in the image runs the chart's default, and Flux
          # then waits out the install timeout on an image that may not exist.
          # The same goes for the services below.
          suspend: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: account-operator
              unsuspend: "true"
          syncWave: 4
          enabled: true
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        extension-manager-operator:
          suspend: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: extension-manager-operator
              unsuspend: "true"
          syncWave: 4
          enabled: true
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        infra:
          enabled: true
          imageResources:
          - name: keycloak-image
            resource: keycloak-image
            resourceName: keycloak-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: keycloak.operator.image.tag
          - name: busybox-image
            resource: busybox-image
            resourceName: busybox-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: keycloak.operator.waitForDb.image.tag
          - name: postgres-image
            resource: postgres-image
            resourceName: postgres-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: cnpg.cluster.image.tag
          - name: kcp-server-image
            resource: image
            absoluteReferencePath:
            - name: kcp
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.image.tag
              image-ref: combined
          - name: etcd-wrapper-image
            resource: etcd-wrapper-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.etcd.image.tag
              image-ref: combined
          - name: etcdbrctl-image
            resource: etcdbrctl-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.etcd.backup.image.tag
              image-ref: combined
          values:
            keycloak:
              operator:
                enabled: true
            cnpg:
              enabled: true
            gatewayApi:
              enabled: true
            kcp:
              proxy:
                replicas: 1
              shards: []
        iam-ui:
          enabled: true
          syncWave: 4
          suspend: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: iam-ui
              unsuspend: "true"
          values: {}
        iam-service:
          suspend: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: iam-service
              unsuspend: "true"
          syncWave: 4
          enabled: true
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        kcp:
          external: true
        kcp-operator:
          syncWave: 1
          external: true
          # The chart comes from kcp's Helm repository, not from an OCI registry
          # (third_party/kcp-operator/component-constructor.yaml).
          helmRepo: true
          enabled: true
          imageResources:
          - name: kcp-operator-image
            annotations:
              repo: oci
              artifact: image
              for: kcp-operator
              image-ref: combined
          targetNamespace: platform-mesh-system
        kubernetes-graphql-gateway:
          suspend: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: kubernetes-graphql-gateway
              unsuspend: "true"
          syncWave: 4
          enabled: true
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            gateway:
              playground: true
              logLevel: trace
            gatewayApi:
              enabled: true
            kubeConfig:
              enabled: true
              secretName: kubernetes-graphql-gateway-kubeconfig
            sentry:
              environment: dev
        openfga:
          enabled: true
          external: true
          syncWave: 2
          suspend: true
          imageResources:
          - name: openfga-image
            annotations:
              repo: oci
              artifact: image
              for: openfga
              image-ref: combined
              unsuspend: "true"
          values:
            autoscaling:
              enabled: false
            checkQueryCache:
              enabled: true
              limit: 10000
              ttl: 10s
            datastore:
              applyMigrations: true
              engine: postgres
              existingSecret: cnpg-openfga-user
              maxOpenConns: 30
              migrationType: initContainer
              migrations:
                image:
                  pullPolicy: Always
                  repository: groundnuty/k8s-wait-for
                  tag: v2.0
              secretKeys:
                passwordKey: password
                usernameKey: username
              uri: postgres://platform-mesh-pg-rw.platform-mesh-system.svc.cluster.local:5432/openfga?sslmode=verify-full&sslrootcert=/etc/openfga/cnpg-ca/ca.crt
            extraEnvVars:
            - name: OPENFGA_EXPERIMENTALS
              value: enable-list-users
            extraVolumeMounts:
            - mountPath: /etc/openfga/cnpg-ca
              name: cnpg-ca
              readOnly: true
            extraVolumes:
            - name: cnpg-ca
              secret:
                secretName: platform-mesh-pg-ca
                items:
                  - key: ca.crt
                    path: ca.crt
            image:
              tag: v1.11.2
            log:
              level: info
            migrate:
              repository: openfga/openfga
              annotations:
                sidecar.istio.io/inject: "false"
              extraVolumeMounts:
              - mountPath: /etc/openfga/cnpg-ca
                name: cnpg-ca
                readOnly: true
              extraVolumes:
              - name: cnpg-ca
                secret:
                  secretName: platform-mesh-pg-ca
                  items:
                  - key: ca.crt
                    path: ca.crt
            podAnnotations:
              traffic.sidecar.istio.io/excludeInboundPorts: "2112"
            postgresql:
              enabled: false
            replicaCount: 1
            telemetry:
              trace:
                enabled: false
                otlp:
                  endpoint: observability-opentelemetry-collector.openmfp-observability.svc.cluster.local:4317
                  tls:
                    enabled: false
        portal:
          suspend: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: portal
              unsuspend: "true"
          syncWave: 4
          enabled: true
          values:
            environment: kind
        pm-openfga-authz-webhook:
          suspend: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: pm-openfga-authz-webhook
              unsuspend: "true"
          syncWave: 4
          enabled: true
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        pm-keycloak-operator:
          suspend: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: pm-keycloak-operator
              unsuspend: "true"
          syncWave: 4
          enabled: true
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        pm-openfga-operator:
          suspend: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: pm-openfga-operator
              unsuspend: "true"
          syncWave: 4
          enabled: true
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        extension-manager-virtual-workspace:
          suspend: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: extension-manager-virtual-workspace
              unsuspend: "true"
          syncWave: 4
          enabled: true
          targetNamespace: platform-mesh-system
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        marketplace:
          suspend: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: marketplace
              unsuspend: "true"
          syncWave: 4
          enabled: true
          targetNamespace: platform-mesh-system
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        marketplace-ui:
          enabled: true
          suspend: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: marketplace-ui
              unsuspend: "true"
          values: {}
        terminal-controller-manager:
          enabled: false
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: terminal-controller-manager
          - name: terminal-image
            annotations:
              path: terminal.image.tag
              for: terminal-controller-manager
              repo: oci
              artifact: image
            resource: terminal-image
            referencePath:
            - name: terminal-controller-manager
      targetNamespace: platform-mesh-system
