{{- if .Values.ocm.enabled }}
{{- $_ := required "gateway.baseDomain must be set when ocm.enabled=true" .Values.gateway.baseDomain }}
{{- if eq .Values.ocm.profile "kind" }}
{{- $_ = required "gateway.clusterIP must be set to the ClusterIP of the gateway controller Service when using the kind profile" .Values.gateway.clusterIP }}
{{- end }}
apiVersion: delivery.ocm.software/v1alpha1
kind: Repository
metadata:
  name: platform-mesh
  namespace: {{ .Release.Namespace }}
spec:
  repositorySpec:
    baseUrl: {{ .Values.ocm.repository | quote }}
    type: OCIRegistry
  interval: 1m0s
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Component
metadata:
  name: platform-mesh
  namespace: {{ .Release.Namespace }}
spec:
  repositoryRef:
    name: platform-mesh
  component: github.com/platform-mesh/platform-mesh
  semver: {{ .Values.ocm.version | quote }}
  interval: 1m0s
  ocmConfig:
    - kind: Repository
      apiVersion: delivery.ocm.software/v1alpha1
      name: platform-mesh
      namespace: {{ .Release.Namespace }}
    # Verification of ocm.signatureName comes from this Secret's .ocmconfig; the
    # Component field that carried it, spec.verify, is gone since the OCM
    # controller 0.18. Objects referencing this Component inherit it.
    - kind: Secret
      apiVersion: v1
      name: ocm-signing-public-cert
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocm-resolver-config
  namespace: {{ .Release.Namespace }}
data:
  .ocmconfig: |
    type: generic.config.ocm.software/v1
    configurations:
      - type: resolvers.config.ocm.software
        resolvers:
          - repository:
              type: OCIRegistry/v1
              baseUrl: europe-docker.pkg.dev
              subPath: gardener-project/releases
            componentNamePattern: "github.com/gardener/*"
---
apiVersion: core.platform-mesh.io/v1alpha1
kind: PlatformMesh
metadata:
  name: platform-mesh
  namespace: {{ .Release.Namespace }}
spec:
  exposure:
    port: {{ .Values.gateway.port }}
    baseDomain: {{ .Values.gateway.baseDomain | quote }}
    protocol: https
  ocm:
    repo:
      name: platform-mesh
    component:
      name: platform-mesh
    referencePath: []
  featureToggles:
    - name: feature-accounts-in-accounts
    {{- if .Values.idp.allowUnverifiedEmails }}
    - name: feature-disable-email-verification
    {{- end }}
    {{- range .Values.platformMesh.extraFeatureToggles }}
    - name: {{ . | quote }}
    {{- end }}
  {{- with .Values.platformMesh.authentication }}
  authentication:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.platformMesh.values }}
  values:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  kcp: {}
{{- end }}
