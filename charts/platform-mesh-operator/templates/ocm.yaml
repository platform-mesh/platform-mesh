# DO NOT EDIT — generated by task generate:ocm-defaults from charts/*/ocm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-mesh-ocm-configuration
  namespace: platform-mesh-system
data:
  ocm-configuration.yaml: |
    account-operator:
      enabled: {{ .Values.ocm.services.account-operator }}
      imageResources:
      - annotations:
          repo: oci
          artifact: image
          for: account-operator
    cnpg-operator:
      enabled: {{ .Values.ocm.services.cnpg-operator }}
      imageResources:
      - name: cnpg-operator-image
        resource: image
        annotations:
          repo: oci
          artifact: image
          for: cnpg-operator
          image-ref: combined
    extension-manager-operator:
      enabled: {{ .Values.ocm.services.extension-manager-operator }}
      imageResources:
      - annotations:
          repo: oci
          artifact: image
          for: extension-manager-operator
    iam-service:
      enabled: {{ .Values.ocm.services.iam-service }}
      imageResources:
      - annotations:
          repo: oci
          artifact: image
          for: iam-service
    iam-ui:
      enabled: {{ .Values.ocm.services.iam-ui }}
      imageResources:
      - annotations:
          repo: oci
          artifact: image
          for: iam-ui
    infra:
      enabled: {{ .Values.ocm.services.infra }}
      imageResources:
      - name: keycloak-image
        resource: keycloak-image
        resourceName: keycloak-image
        annotations:
          repo: oci
          artifact: image
          for: infra
          path: keycloak.operator.image.tag
      - name: busybox-image
        resource: busybox-image
        resourceName: busybox-image
        annotations:
          repo: oci
          artifact: image
          for: infra
          path: keycloak.operator.waitForDb.image.tag
      - name: postgres-image
        resource: postgres-image
        resourceName: postgres-image
        annotations:
          repo: oci
          artifact: image
          for: infra
          path: cnpg.cluster.image.tag
      - name: kcp-server-image
        resource: image
        absoluteReferencePath:
        - name: kcp
        annotations:
          repo: oci
          artifact: image
          for: infra
          path: kcp.image.tag
          image-ref: combined
      - name: etcd-wrapper-image
        resource: etcd-wrapper-image
        annotations:
          repo: oci
          artifact: image
          for: infra
          path: kcp.etcd.image.tag
          image-ref: combined
      - name: etcdbrctl-image
        resource: etcdbrctl-image
        annotations:
          repo: oci
          artifact: image
          for: infra
          path: kcp.etcd.backup.image.tag
          image-ref: combined
    keycloak-operator:
      enabled: {{ .Values.ocm.services.keycloak-operator }}
      imageResources:
      - name: keycloak-operator-keycloak-image
        resource: keycloak-image
        resourceName: keycloak-image
        absoluteReferencePath:
        - name: keycloak-operator
        - name: image
        annotations:
          repo: oci
          artifact: image
          for: keycloak-operator
          path: keycloakImage.tag
      - name: keycloak-operator-image
        resource: manager-image
        resourceName: manager-image
        absoluteReferencePath:
        - name: keycloak-operator
        - name: image
        annotations:
          repo: oci
          artifact: image
          for: keycloak-operator
          path: image.tag
    kcp-operator:
      enabled: {{ .Values.ocm.services.kcp-operator }}
      imageResources:
      - name: kcp-operator-image
        resource: image
        annotations:
          repo: oci
          artifact: image
          for: kcp-operator
          image-ref: combined
    kubernetes-graphql-gateway:
      enabled: {{ .Values.ocm.services.kubernetes-graphql-gateway }}
      imageResources:
      - annotations:
          repo: oci
          artifact: image
          for: kubernetes-graphql-gateway
    marketplace-ui:
      enabled: {{ .Values.ocm.services.marketplace-ui }}
      imageResources:
      - annotations:
          repo: oci
          artifact: image
          for: marketplace-ui
    observability:
      enabled: {{ .Values.ocm.services.observability }}
      imageResources:
      - name: otel-collector-image
        resource: otel-collector-image
        resourceName: otel-collector-image
        annotations:
          repo: oci
          artifact: image
          for: observability
          path: otelCollector.image.tag
      - name: prometheus-server-image
        resource: prometheus-server-image
        annotations:
          repo: oci
          artifact: image
          for: observability
          path: prometheus.server.image.tag
          image-ref: combined
      - name: prometheus-config-reloader-image
        resource: prometheus-config-reloader-image
        annotations:
          repo: oci
          artifact: image
          for: observability
          path: prometheus.configmapReload.prometheus.image.tag
          image-ref: combined
    portal:
      enabled: {{ .Values.ocm.services.portal }}
      imageResources:
      - annotations:
          repo: oci
          artifact: image
          for: portal
    rebac-authz-webhook:
      enabled: {{ .Values.ocm.services.rebac-authz-webhook }}
      imageResources:
      - annotations:
          repo: oci
          artifact: image
          for: rebac-authz-webhook
    security-operator:
      enabled: {{ .Values.ocm.services.security-operator }}
      imageResources:
      - annotations:
          repo: oci
          artifact: image
          for: security-operator
    terminal-controller-manager:
      enabled: {{ .Values.ocm.services.terminal-controller-manager }}
      imageResources:
      - annotations:
          repo: oci
          artifact: image
          for: terminal-controller-manager
      - name: terminal-image
        resource: terminal-image
        referencePath:
        - name: terminal-controller-manager
        annotations:
          repo: oci
          artifact: image
          for: terminal-controller-manager
          path: terminal.image.tag
    virtual-workspaces:
      enabled: {{ .Values.ocm.services.virtual-workspaces }}
      imageResources:
      - annotations:
          repo: oci
          artifact: image
          for: virtual-workspaces
{{- end }}
