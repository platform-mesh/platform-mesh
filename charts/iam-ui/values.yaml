image:
  # -- The image registry
  registry: ghcr.io
  # -- The image repository path (without registry)
  repository: platform-mesh/iam-ui
  # -- The image digest (when set, overrides tag: registry/repository@digest)
  digest: ""
  pullPolicy: IfNotPresent

deployment:
  maxUnavailable: 0
  maxSurge: 5

port: 8080

health:
  port: 8080
  startup:
    path: /healthz
  readiness:
    path: /healthz

gatewayApi:
  httpRoute:
    # -- Explicit route hostnames; empty uses exposure.baseDomain and its wildcard.
    hostnames: []
    pathPrefix: /ui/iam
    parentRefs:
    - name: k8sapi-gateway
exposure:
  # -- Public hostname without protocol or port. Required for public resources; the platform-mesh operator supplies it from PlatformMesh.spec.exposure.
  baseDomain: ""
