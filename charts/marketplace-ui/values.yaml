image:
  # -- The image registry
  registry: ghcr.io
  # -- The image repository path (without registry)
  repository: platform-mesh/marketplace-ui
  # -- The image digest (when set, overrides tag: registry/repository@digest)
  digest: ""
  pullPolicy: IfNotPresent

deployment:
  maxUnavailable: 0
  maxSurge: 5

health:
  port: 8080
  startup:
    path: /healthz
  readiness:
    path: /healthz

gatewayApi:
  enabled: false
  httpRoute:
    pathPrefix: /ui/marketplace
    parentRefs:
    - name: k8sapi-gateway
    # -- list of HTTPRoute filters (default: none)
    filters: []

exposure:
  # -- hostnames to be used for exposure
  hostnames: []
