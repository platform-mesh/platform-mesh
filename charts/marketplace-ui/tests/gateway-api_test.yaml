set:
  exposure.baseDomain: example.com
suite: Gateway API
templates:
  - httproute.yaml
tests:
  - it: matches the snapshot
    values:
      - test-values.yaml
    set:
      gatewayApi:
        enabled: true
      istio:
        enabled: false
    asserts:
      - matchSnapshot: {}
  - it: uses the explicit route hostnames
    set:
      gatewayApi.enabled: true
      gatewayApi.httpRoute.enabled: true
      gatewayApi.httpRoute.hostnames:
      - custom.example.net
    asserts:
    - equal:
        path: spec.hostnames
        value:
        - custom.example.net
    template: httproute.yaml
