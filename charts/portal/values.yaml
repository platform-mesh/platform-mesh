image:
  # -- The image registry
  registry: ghcr.io
  # -- The image repository path (without registry)
  repository: platform-mesh/portal
  # -- The image digest (when set, overrides tag: registry/repository@digest)
  digest: ""
  pullPolicyOverride: IfNotPresent

# -- Base domain for the portal deployment. The operator substitutes this value. All derived
# -- URLs (cookieDomain, discoveryUrl, crdGatewayApiUrl, httpRoute hostnames) are built from it.
baseDomain: ""

# -- External HTTPS port for the portal. The operator substitutes this value.
port: 443

# -- Name of the Secret containing the domain TLS CA certificate (key: ca.crt).
# -- When set together with webhookCaSecret, the chart renders a combine-ca init container
# -- that merges both CAs into /etc/ssl/certs/ca-bundle.crt.
caSecret: domain-certificate

# -- Name of the Secret containing the rebac-authz-webhook CA certificate (key: ca.crt).
# -- Required when caSecret is also set; the two are concatenated by the combine-ca init container.
webhookCaSecret: rebac-authz-webhook-cert

http:
  # -- protocol used by the portal backend. Must be set. Permissible values: http, https
  protocol: https

validWebcomponentUrls: ".?"
featureToggles: "enableSessionAutoRefresh=true"
uiOptions: "enableFeatureToggleSetting"

# -- environment label propagated to observability (e.g. logs, traces). Permissible values: any string (e.g. production, staging, development)
environment: ""

# -- development landscape toggle. Set to "true" only in local/dev environments to enable dev-only UI features. Permissible values: "true", "false"
developmentLandcsape: "false"

# -- allows the configuration of a kubeconfig secret for external api servers
kubeconfigSecret: ""
kcp:
  # -- kcp API URL (e.g. https://localhost:8443 for local setup)
  url: ""
  kubeconfigSecret: portal-kubeconfig

auth:
  default:
    # -- client id
    clientId: welcome
    # -- Secret key holding the client secret
    clientSecretKey: attribute.client_secret
    # -- Secret name holding the client secret
    clientSecretName: portal-client-secret-welcome

health:
  # -- health port to be used by probes
  port: 8080

# -- hostAliases configuration
hostAliases:
  # -- enable hostAliases
  enabled: false
  # -- hostAliases entries
  entries: []

validation:
  # -- Port of the extension-manager validation webhook
  port: 8088
  # -- Path of the extension-manager validation webhook
  path: /validate
  # -- Service name of the extension-manager validation webhook
  service: "extension-manager-operator-server"
  # -- Protocol used to reach the extension-manager validation webhook. Permissible values: http, https
  protocol: "http"

# -- additional init containers to run before the main container (appended after combine-ca when enabled)
initContainers: []

gatewayApi:
  # -- toggle to enable the Gateway API
  enabled: true
  httpRoute:
    pathPrefix: /
    # -- hostnames for the HTTPRoute.
    hostnames: []
    parentRefs:
    - name: k8sapi-gateway
      kind: Gateway
    # -- list of HTTPRoute filters (default: none)
    filters: []
