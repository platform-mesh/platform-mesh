set:
  exposure.baseDomain: example.com
suite: Test Kubernetes Gateway API
values:
- ../values.yaml
release:
  name: platform-mesh
  namespace: platform-mesh-system
chart:
  appVersion: 1.0.0
templates:
  - httproute.yaml
tests:
  - it: match the Snapshot
    asserts:
      - matchSnapshot: {}
  - it: uses explicit route hostnames
    set:
      gatewayApi.httpRoute.hostnames:
      - custom.example.net
    asserts:
    - equal:
        path: spec.hostnames
        value:
        - custom.example.net
    template: httproute.yaml
