suite: deploy
templates:
  - deploy.yaml
chart:
  version: 1.0.0
  appVersion: 1.0.0
release:
  name: portal
tests:
  - it: uses the configured OIDC discovery endpoint
    set:
      baseDomain: portal.example.com
      frontendPort: "8443"
      auth:
        default:
          discoveryUrl: https://issuer.example.com/dex/.well-known/openid-configuration
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_ENDPOINT
            value: https://issuer.example.com/dex/.well-known/openid-configuration
  - it: matches the snapshot
    values:
      - test-values.yaml
    template: deploy.yaml
    asserts:
      - matchSnapshot: {}
  - it: test hosAliases
    templates:
      - deploy.yaml
    set:
      hostAliases:
        enabled: true
        entries:
          - ip: "10.0.0.1"
            hostnames:
              - "example.com"
              - "test.example.com"
    template: deploy.yaml
    asserts:
      - matchSnapshot: {}
