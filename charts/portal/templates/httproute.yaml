{{- if .Values.gatewayApi.enabled }}
{{- $hostnames := .Values.gatewayApi.httpRoute.hostnames }}
{{- if and (not $hostnames) .Values.baseDomain }}
{{- $hostnames = list .Values.baseDomain (printf "*.%s" .Values.baseDomain) }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "common.entity.name" . }}
spec:
  {{- with $hostnames }}
  hostnames:
  {{- range . }}
  - {{ . | quote }}
  {{- end }}
  {{- end }}
  parentRefs:
{{ toYaml .Values.gatewayApi.httpRoute.parentRefs | nindent 4 }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.gatewayApi.httpRoute.pathPrefix }}
    {{- with .Values.gatewayApi.httpRoute.filters }}
    filters:
    {{ toYaml . | nindent 4 }}
    {{- end }}
    backendRefs:
    - group: ""
      kind: Service
      name: {{ include "common.entity.name" . }}
      namespace: {{ .Release.Namespace }}
      port: 8080
{{- end }}
