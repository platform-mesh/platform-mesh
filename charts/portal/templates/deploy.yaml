{{- $_ := required "exposure.baseDomain is required" .Values.exposure.baseDomain -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.entity.name" . }}
  labels:
    app: {{ include "common.entity.name" . }}
spec:
  {{ include "common.deploymentBasics" . | indent 2 }}
  template:
    metadata:
      labels:
        {{- include "common.labelMatcher" . | indent 8 }}
    spec:
      {{- include "common.pod.securityContext" . | indent 6 }}
      terminationGracePeriodSeconds: {{ include "common.terminationGracePeriodSeconds" .}}
      {{ include "common.hostAliases" $ | nindent 6 }}
      {{- if or (and .Values.caSecret .Values.webhookCaSecret) .Values.initContainers }}
      initContainers:
        {{- if and .Values.caSecret .Values.webhookCaSecret }}
        - name: combine-ca
          image: {{ include "common.image" . }}
          {{- include "common.imagePullPolicy" . | nindent 10 }}
          command:
          - node
          args:
          - -e
          - >-
            const fs = require('node:fs');
            fs.writeFileSync('/combined-ca/ca-bundle.crt', Buffer.concat([
              fs.readFileSync('/domain-ca/ca.crt'),
              fs.readFileSync('/webhook-ca/ca.crt')
            ]));
          securityContext:
            runAsUser: 1000
          volumeMounts:
          - name: domain-ca
            mountPath: /domain-ca
            readOnly: true
          - name: webhook-ca
            mountPath: /webhook-ca
            readOnly: true
          - name: combined-ca
            mountPath: /combined-ca
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
      - {{- include "common.podBasics" . | indent 8 }}
        {{- include "common.container.securityContext" . | indent 8 }}
        env:
        - name: HTTP_PROTOCOL
          value: {{ .Values.exposure.protocol | quote }}
        {{- with .Values.auth.default }}
        - name: DISCOVERY_ENDPOINT
          {{- if .discoveryUrl }}
          value: {{ .discoveryUrl | quote }}
          {{- else }}
          value: "{{ $.Values.exposure.protocol }}://{{ $.Values.exposure.baseDomain }}{{ $.Values.exposure.normalizedPort }}/keycloak/realms/${org-name}/.well-known/openid-configuration"
          {{- end }}
        - name: OIDC_CLIENT_ID_DEFAULT
          value: {{ .clientId | quote }}
        - name: BASE_DOMAINS_DEFAULT
          value: {{ $.Values.exposure.baseDomain | quote }}
        {{- end }}
        - name: PORT
          value: "{{ include "common.getKeyValue" (dict "Values" .Values "key" "port") }}"
        - name: REGION
          value: {{ .Values.region }}
        - name: IMAGE_TAG
          value: "{{ .Chart.AppVersion }}"
        - name: IMAGE_NAME
          value: "{{ include "common.image.name" . }}"
        {{- if .Values.developmentLandcsape }}
        - name: DEVELOPMENT_INSTANCE
          value: "{{ .Values.developmentLandcsape }}"
        {{- end }}
        {{- if .Values.featureToggles }}
        - name: FEATURE_TOGGLES
          value: "{{ .Values.featureToggles }}"
        {{- end }}
        {{- if .Values.uiOptions }}
        - name: UI_OPTIONS
          value: "{{ .Values.uiOptions }}"
        {{- end }}
        - name: CONTENT_CONFIGURATION_VALIDATOR_API_URL
          value: "{{ .Values.validation.protocol }}://{{ .Values.validation.service }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.validation.port }}{{ .Values.validation.path }}"
        {{- if .Values.environment }}
        - name: ENVIRONMENT
          value: "{{ .Values.environment }}"
        {{- end }}
        {{- if .Values.validWebcomponentUrls }}
        - name: VALID_WEBCOMPONENT_URLS
          value: '{{ .Values.validWebcomponentUrls }}'
        {{- end }}
        {{- $envNames := list }}
        {{- range .Values.extraEnvVars }}
          {{- $envNames = append $envNames .name }}
        {{- end }}
        {{- if not (has "OPENMFP_PORTAL_CONTEXT_AUTHZ_WEBHOOK_URL" $envNames) }}
        - name: OPENMFP_PORTAL_CONTEXT_AUTHZ_WEBHOOK_URL
          value: "https://pm-openfga-authz-webhook.{{ .Release.Namespace }}.svc.cluster.local:9443"
        {{- end }}
        {{- if and (or .Values.caSecret .Values.webhookCaSecret) (not (has "NODE_EXTRA_CA_CERTS" $envNames)) }}
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/ssl/certs/ca-bundle.crt
        {{- end }}
        - name: COOKIE_DOMAIN
          value: {{ .Values.exposure.baseDomain | quote }}
        - name: FRONTEND_PORT
          value: {{ .Values.exposure.port | quote }}
        {{- if not (has "OPENMFP_PORTAL_CONTEXT_IAM_SERVICE_API_URL" $envNames) }}
        - name: OPENMFP_PORTAL_CONTEXT_IAM_SERVICE_API_URL
          value: "{{ .Values.exposure.protocol }}://${org-subdomain}{{ .Values.exposure.baseDomain }}{{ .Values.exposure.normalizedPort }}/iam/graphql"
        {{- end }}
        {{- if not (has "OPENMFP_PORTAL_CONTEXT_CRD_GATEWAY_API_URL" $envNames) }}
        - name: OPENMFP_PORTAL_CONTEXT_CRD_GATEWAY_API_URL
          value: "{{ .Values.exposure.protocol }}://${org-subdomain}{{ .Values.exposure.baseDomain }}{{ .Values.exposure.normalizedPort }}/gateway/api/clusters/root:orgs:${org-name}/graphql"
        {{- end }}
        {{ range .Values.extraEnvVars }}
        - name: {{ .name }}
          value: {{ .value | toJson }}
        {{ end }}
        {{- if .Values.kcp.url }}
        - name: KCP_URL
          value: {{ .Values.kcp.url | quote }}
        {{- end }}
        {{- if .Values.kubeconfigSecret }}
        - name: KUBECONFIG
          value: /kubeconfig/kubeconfig
        {{- end }}
        {{- if .Values.kcp.kubeconfigSecret }}
        - name: KUBECONFIG_KCP
          value: /kcp-kubeconfig/kubeconfig
        {{- end }}
        ports:
          {{- include "common.ports" . | nindent 10 }}
        volumeMounts:
        {{- include "common.extraVolumeMounts" . | nindent 8 }}
        {{- if and .Values.caSecret .Values.webhookCaSecret }}
        - name: combined-ca
          mountPath: /etc/ssl/certs/ca-bundle.crt
          subPath: ca-bundle.crt
          readOnly: true
        {{- else if .Values.caSecret }}
        - name: domain-ca
          mountPath: /etc/ssl/certs/ca-bundle.crt
          subPath: ca.crt
          readOnly: true
        {{- else if .Values.webhookCaSecret }}
        - name: webhook-ca
          mountPath: /etc/ssl/certs/ca-bundle.crt
          subPath: ca.crt
          readOnly: true
        {{- end }}
        {{- with .Values.kubeconfigSecret }}
        - name: kubeconfig
          mountPath: /kubeconfig
        {{- end }}
        {{- with .Values.kcp.kubeconfigSecret }}
        - name: kcp-kubeconfig
          mountPath: /kcp-kubeconfig
        {{- end }}
      volumes:
      {{- include "common.extraVolumes" . | nindent 8 }}
        {{- if .Values.caSecret }}
        - name: domain-ca
          secret:
            secretName: {{ .Values.caSecret }}
        {{- end }}
        {{- if .Values.webhookCaSecret }}
        - name: webhook-ca
          secret:
            secretName: {{ .Values.webhookCaSecret }}
        {{- end }}
        {{- if and .Values.caSecret .Values.webhookCaSecret }}
        - name: combined-ca
          emptyDir: {}
        {{- end }}
        {{- with .Values.kubeconfigSecret }}
        - name: kubeconfig
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- with .Values.kcp.kubeconfigSecret }}
        - name: kcp-kubeconfig
          secret:
            secretName: {{ . }}
        {{- end }}
