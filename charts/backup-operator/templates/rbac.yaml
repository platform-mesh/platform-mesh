# Namespaced: the operator only reads and changes objects in the release namespace.
# The rules are the same as operators/backup-operator/config/rbac/role.yaml, plus leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "backup-operator.name" . }}
  labels:
    {{- include "backup-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
    - ""
    resources:
    - secrets
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - backup.platform-mesh.io
    resources:
    - backups
    - backupstorages
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - backup.platform-mesh.io
    resources:
    - backups/status
    verbs:
    - get
    - patch
    - update
  - apiGroups:
    - cert-manager.io
    resources:
    - certificates
    - issuers
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - druid.gardener.cloud
    resources:
    - etcdopstasks
    verbs:
    - create
    - get
    - list
    - watch
  - apiGroups:
    - druid.gardener.cloud
    resources:
    - etcds
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - operator.kcp.io
    resources:
    - cacheservers
    - frontproxies
    - kubeconfigs
    - rootshards
    - shards
    verbs:
    - get
    - list
    - watch
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "backup-operator.name" . }}
  labels:
    {{- include "backup-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "backup-operator.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "backup-operator.name" . }}
    namespace: {{ .Release.Namespace }}
