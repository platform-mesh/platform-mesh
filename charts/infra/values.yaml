hostAliases:
  enabled: false

externalSecrets:
  enabled: false

credentials:
  # -- Generate missing CNPG role credential Secrets before PostgreSQL starts. Disable when credentials are provisioned externally.
  enabled: true
  image:
    # -- Credential bootstrap image registry
    registry: docker.io
    # -- Credential bootstrap image repository (without registry)
    repository: library/python
    # -- Credential bootstrap image tag
    tag: 3.14.0-alpine3.22
    # -- Credential bootstrap image digest (when set, overrides tag)
    digest: "sha256:8373231e1e906ddfb457748bfc032c4c06ada8c759b7b62d9c73ec2a3c56e710"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

kcp:
  image:
    repository: ghcr.io/kcp-dev/kcp
    # renovate: datasource=docker depName=ghcr.io/kcp-dev/kcp
    tag: v0.33.6
  namespace: platform-mesh-system
  certificates:
    # -- Existing Issuer/ClusterIssuer that signs the kcp certificate chain. It must be able to issue CA certificates. Mutually exclusive with caSecretRef.
    issuerRef: {}
    # -- Existing CA to sign from directly. Secret must be of type kubernetes.io/tls and contain the CA certificate and its private key. Mutually exclusive with issuerRef.
    caSecretRef: {}
  external:
    # -- External hostname for kcp. Required — must be set via profile map or PlatformMesh resource (e.g. kcp.api.example.com).
    hostname: ""
    port: 8443
  auth:
    adminCert:
      enabled: true
      privateKey:
        algorithm: RSA
        size: 2048
      subject:
        organizations:
          - system:kcp:admin
    serviceAccount:
      enabled: true
    oidc:
      enabled: false
      issuerUrl: ""
      clientID: ""
      groupsClaim: groups
      usernameClaim: email
      usernamePrefix: ""
      groupsPrefix: ""
      caFileRef:
        name: domain-certificate-ca
        key: tls.crt
  etcd:
    name: etcd-kcp
    service:
      name: etcd-kcp-client
      port: 2379
    image:
      # Pinned for the OCM inventory. Keep in sync with the etcd-wrapper-next
      # image of the deployed etcd-druid (etcd 3.5, UpgradeEtcdVersion is on by
      # default); an older wrapper would downgrade etcd.
      repository: europe-docker.pkg.dev/gardener-project/public/gardener/etcd-wrapper
      tag: v0.8.4
    defragmentationSchedule: "0 */24 * * *"
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 200Mi
    serverPort: 2380
    quota: 8Gi
    backup:
      image:
        # Keep in sync with etcd-druid's etcd-backup-restore-next image, see etcd.image.
        repository: europe-docker.pkg.dev/gardener-project/public/gardener/etcdbrctl
        tag: v0.45.3
      port: 8080
      fullSnapshotSchedule: "0 */24 * * *"
      resources:
        limits:
          cpu: 200m
          memory: 1Gi
        requests:
          cpu: 23m
          memory: 128Mi
      garbageCollectionPolicy: Exponential
      garbageCollectionPeriod: 43200s
      deltaSnapshotPeriod: 300s
      deltaSnapshotMemoryLimit: 1Gi
      compression:
        enabled: false
        policy: "gzip"
      leaderElection:
        reelectionPeriod: 5s
        etcdConnectionTimeout: 5s
      # store:
      #   container: etcd-bucket
      #   prefix: etcd-test
      #   provider: S3
      #   endpointOverride: http://localstack.default:4566
      #   secretRef:
      #     name: etcd-backup-aws
    sharedConfig:
      autoCompactionMode: periodic
      autoCompactionRetention: "30m"
    replicas: 1

  cacheServer:
    name: cache-server
    replicas: ""
    resources: {}
    etcd:
      name: etcd-cache
      service:
        name: etcd-cache-client
        port: 2379

  webhook:
    enabled: true
    authorizationWebhookSecretName: kcp-webhook-secret
    port: 9443
    version: v1

  proxy:
    replicas: ""

  rootShard:
    replicas: 1
    # -- Hostname for the root shard. Defaults to "root.kcp.<kcp.external.hostname>" when unset.
    hostname: ""
    # -- Base URL the root shard advertises. Defaults to "https://<rootShard.hostname>:<kcp.external.port>/" when unset.
    shardBaseURL: ""
    # -- Optional resource requests and limits for the root shard
    resources: {}
    # resources:
    #   limits:
    #     cpu: "2"
    #     memory: "2Gi"
    #   requests:
    #     cpu: "1"
    #     memory: "1Gi"
    extraArgs:
    - --feature-gates=WorkspaceAuthentication=true,CacheAPIs=true
  shards:
    - name: nereus
    - name: triton
  frontProxy:
    replicas: 1
    name: frontproxy
    clusterIP: ""
    # -- Optional resource requests and limits for the front proxy
    resources: {}
    # resources:
    #   limits:
    #     cpu: 500m
    #     memory: 512Mi
    #   requests:
    #     cpu: 100m
    #     memory: 128Mi
    additionalPathMappings:
      - path: /services/contentconfigurations
        backend: https://extension-manager-virtual-workspace.platform-mesh-system:8443
        backend_server_ca: /etc/kcp/tls/ca/tls.crt
        proxy_client_cert: /etc/kcp-front-proxy/requestheader-client/tls.crt
        proxy_client_key: /etc/kcp-front-proxy/requestheader-client/tls.key
      - path: /services/marketplace
        backend: https://marketplace.platform-mesh-system:8443
        backend_server_ca: /etc/kcp/tls/ca/tls.crt
        proxy_client_cert: /etc/kcp-front-proxy/requestheader-client/tls.crt
        proxy_client_key: /etc/kcp-front-proxy/requestheader-client/tls.key
    extraArgs:
    - --feature-gates=WorkspaceAuthentication=true

openfga:
  rbac:
    writePrincipals:
      - cluster.local/ns/platform-mesh-system/sa/iam-service
      - cluster.local/ns/platform-mesh-system/sa/pm-openfga-operator
      - cluster.local/ns/platform-mesh-system/sa/account-operator

keycloak:
  operator:
    # -- Enable Keycloak CR and supporting secrets managed by Keycloak Operator
    enabled: false
    # -- Number of Keycloak instances
    instances: 1
    image:
      # -- Keycloak image registry
      registry: ghcr.io
      # -- Keycloak image repository (without registry)
      repository: platform-mesh/custom-images/keycloak
      # -- Keycloak image tag (defaults to appVersion)
      tag: "v26.8.1"
      # -- Keycloak image digest (when set, overrides tag: registry/repository@digest)
      digest: ""
    waitForDb:
      image:
        # -- wait-for-db init container image registry
        registry: docker.io
        # -- wait-for-db init container image repository (without registry)
        repository: library/busybox
        # -- wait-for-db init container image tag
        tag: "1.38"
        # -- wait-for-db init container image digest (when set, overrides tag)
        digest: ""
    # -- Keycloak hostname (used in the Keycloak CR hostname.hostname field).
    # Must not include a path — the operator auto-derives http-relative-path from
    # any path component, which conflicts with the value baked into the image.
    hostname: ""
    db:
      # -- PostgreSQL host
      host: platform-mesh-pg-rw.platform-mesh-system.svc.cluster.local
      # -- PostgreSQL port
      port: 5432
      # -- Database name
      database: keycloak
      # -- Database username for explicit password configuration; must match the shared CNPG role
      username: keycloak
      # -- Explicit database password. Empty uses the shared CNPG role Secret, or db.existingSecret for an external database.
      password: ""
      # -- Existing database Secret with username/password keys. Empty selects the shared CNPG Secret or the explicit password Secret.
      existingSecret: ""
    admin:
      # -- Bootstrap admin username (written to keycloak-admin secret)
      username: keycloak-admin
      # -- Explicit bootstrap password. Empty delegates strong admin credential generation to the Keycloak operator.
      password: ""
      # -- Optional legacy client secret field for explicitly configured admin credentials
      secret: ""
      # -- Existing admin Secret with username/password keys. Set this when upgrading an existing Keycloak database.
      existingSecret: ""
    # -- Secret with PEM CA for outbound HTTPS trust (e.g. local mkcert CA)
    caSecret: ""
    # -- Enable plain HTTP on the Keycloak pod. Keycloak sits behind gatewayAPI, which
    # handles TLS termination.
    httpEnabled: true
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 750m
        memory: 1Gi
    health:
      port: 9000
      periodSeconds: 10
      liveness:
        path: /keycloak/health/live
        failureThreshold: 3
      readiness:
        path: /keycloak/health/ready
        initialDelaySeconds: 0
        periodSeconds: 10
      startup:
        path: /keycloak/health
        failureThreshold: 600
  gatewayApi:
    # -- hostnames for the Keycloak HTTPRoute
    hostnames: []
    # -- path prefix for the Keycloak HTTPRoute
    pathPrefix: /keycloak
    # -- list of HTTPRoute filters (default: none)
    filters: []

  # -- service configuration
  service:
    # -- service name
    name: keycloak
    # -- service port
    port: 80


dex:
  # -- Enable Dex as a local upstream OIDC identity provider
  enabled: false
  # -- Dex issuer URL (must match external browser-reachable URL)
  issuer: ""
  image:
    # -- Dex image registry
    registry: ghcr.io
    # -- Dex image repository (without registry)
    repository: dexidp/dex
    # -- Dex image tag
    tag: v2.46.1
    # -- Dex image digest (when set, overrides tag: registry/repository@digest)
    digest: "sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab"
  service:
    # -- Dex service name
    name: dex
    # -- Dex service port
    port: 5556
  health:
    periodSeconds: 10
    liveness:
      # Main HTTP server only exposes /healthz (prefixed by issuer path).
      # /healthz/live is on the optional telemetry port, not port 5556.
      path: /dex/healthz
      failureThreshold: 3
    readiness:
      path: /dex/healthz
      initialDelaySeconds: 0
      periodSeconds: 10
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  gatewayApi:
    # -- hostnames for the Dex HTTPRoute
    hostnames: []
    # -- path prefix for the Dex HTTPRoute
    pathPrefix: /dex
    # -- list of HTTPRoute filters (default: none)
    filters: []
  # -- Connector for the OAuth2 password grant, which issues tokens without a browser; `local` is the static password database (default: grant disabled)
  passwordConnector: ""
  # -- Dex `expiry` settings (token lifetimes, refresh token rotation), rendered as given (default: Dex defaults)
  expiry: {}
  staticClient:
    # -- OIDC client ID for Keycloak identity broker
    id: keycloak-broker
    # -- OIDC client secret for Keycloak identity broker. Required when Dex is enabled.
    secret: ""
    # -- Display name for the static OIDC client
    name: Keycloak Broker
    # -- Allowed redirect URIs (Keycloak broker callback URLs)
    redirectURIs: []
  # -- Optional Dex users with bcrypt password hashes. No users are provided by default.
  staticPasswords: []

cnpg:
  enabled: false
  cluster:
    name: platform-mesh-pg
    image:
      # -- PostgreSQL image registry
      registry: ghcr.io
      # -- PostgreSQL image repository (without registry)
      repository: cloudnative-pg/postgresql
      # -- PostgreSQL image tag
      tag: "18.6-system-trixie"
      # -- PostgreSQL image digest (when set, overrides tag)
      digest: ""
    instances: 2
    storage:
      size: 2Gi
    postgresql:
      maxConnections: "200"
      sharedBuffers: "128MB"
  roles:
    keycloak:
      # -- PostgreSQL username for Keycloak. Written to the cnpg-keycloak-user secret.
      username: keycloak
      # -- Password override. Empty lets the database bootstrap Job generate and preserve the role Secret.
      password: ""
    openfga:
      # -- PostgreSQL username for OpenFGA. Written to the cnpg-openfga-user secret.
      username: openfga
      # -- Password override. Empty lets the database bootstrap Job generate and preserve the role Secret.
      password: ""
  databases:
    - name: keycloak
      owner: keycloak
    - name: openfga
      owner: openfga

gatewayApi:
  # -- Toggle to enable/disable Gateway API resources
  enabled: true
  # -- Name of the Gateway resource
  name: k8sapi-gateway
  # -- GatewayClass name
  gatewayClassName: ""
  # -- HTTPS Terminate configuration
  infrastructure: {}
  # -- Gateway listeners. The HTTPS listener is hostname-less so all route hostnames share one listener (needed for HTTP/2 connection reuse on Istio).
  listeners:
    - name: terminate
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: domain-certificate
            namespace: platform-mesh-system
  passthrough:
    # -- Generate one TLS passthrough listener per kcp hostname (front proxy, root shard, shards). Disable to manage passthrough listeners yourself; kcp TLSRoutes then attach to a listener named "passthrough".
    enabled: true
    # -- Port of the generated passthrough listeners
    port: 443
    # -- allowedRoutes of the generated passthrough listeners
    allowedRoutes:
      namespaces:
        from: All
  # -- Additional listeners to be added to the Gateway resource (e.g. for HTTPBin)
  listenersExtra:
    - name: terminate-services
    # -- hostname should match the pattern "*.services.{{ .baseDomain }}"
      hostname: ""
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: domain-certificate
            namespace: platform-mesh-system
      allowedRoutes:
        namespaces:
          from: All
