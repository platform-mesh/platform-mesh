components:
  - name: github.com/platform-mesh/helm-charts/infra
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: chart
        type: helmChart
        relation: external
        version: ${PM_VERSION}
        access:
          type: ociArtifact
          imageReference: ${CHART_REPO}/infra:${PM_VERSION}
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
  - name: github.com/platform-mesh/images/infra
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: keycloak-image
        type: ociImage
        relation: external
        version: "${KEYCLOAK_IMAGE_TAG}"
        access:
          type: ociArtifact
          imageReference: ${KEYCLOAK_IMAGE_REGISTRY}/${KEYCLOAK_IMAGE_REPOSITORY}:${KEYCLOAK_IMAGE_TAG}
      - name: busybox-image
        type: ociImage
        relation: external
        version: "${BUSYBOX_IMAGE_TAG}"
        access:
          type: ociArtifact
          imageReference: ${BUSYBOX_IMAGE_REGISTRY}/${BUSYBOX_IMAGE_REPOSITORY}:${BUSYBOX_IMAGE_TAG}
      - name: postgres-image
        type: ociImage
        relation: external
        version: "${POSTGRES_IMAGE_TAG}"
        access:
          type: ociArtifact
          imageReference: ${POSTGRES_IMAGE_REGISTRY}/${POSTGRES_IMAGE_REPOSITORY}:${POSTGRES_IMAGE_TAG}
      - name: dex-image
        type: ociImage
        relation: external
        version: "${DEX_IMAGE_TAG}"
        access:
          type: ociArtifact
          imageReference: ${DEX_IMAGE_REGISTRY}/${DEX_IMAGE_REPOSITORY}:${DEX_IMAGE_TAG}@${DEX_IMAGE_DIGEST}
      - name: etcd-wrapper-image
        type: ociImage
        relation: external
        version: "${ETCD_WRAPPER_IMAGE_TAG}"
        access:
          type: ociArtifact
          imageReference: ${ETCD_WRAPPER_IMAGE_REPOSITORY}:${ETCD_WRAPPER_IMAGE_TAG}
      - name: etcdbrctl-image
        type: ociImage
        relation: external
        version: "${ETCDBRCTL_IMAGE_TAG}"
        access:
          type: ociArtifact
          imageReference: ${ETCDBRCTL_IMAGE_REPOSITORY}:${ETCDBRCTL_IMAGE_TAG}
  - name: github.com/platform-mesh/infra
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
    componentReferences:
      - name: chart
        componentName: github.com/platform-mesh/helm-charts/infra
        version: ${PM_VERSION}
      - name: image
        componentName: github.com/platform-mesh/images/infra
        version: ${PM_VERSION}
