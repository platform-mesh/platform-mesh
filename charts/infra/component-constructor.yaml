components:
  - name: github.com/platform-mesh/helm-charts/infra
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: chart
        type: helmChart
        relation: external
        version: ${PM_VERSION}
        access:
          type: ociArtifact
          imageReference: ${CHART_REPO}/infra:${PM_VERSION}
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
  - name: github.com/platform-mesh/images/infra
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: keycloak-image
        type: ociImage
        version: v26.8.1
        access:
          type: ociArtifact
          imageReference: ghcr.io/platform-mesh/custom-images/keycloak:v26.8.1
        relation: external
      - name: busybox-image
        type: ociImage
        version: "1.37"
        access:
          type: ociArtifact
          imageReference: docker.io/library/busybox:1.37
        relation: external
      - name: postgres-image
        type: ociImage
        version: "18.3"
        access:
          type: ociArtifact
          imageReference: ghcr.io/cloudnative-pg/postgresql:18.3
        relation: external
      - name: dex-image
        type: ociImage
        version: v2.42.0
        access:
          type: ociArtifact
          imageReference: ghcr.io/dexidp/dex:v2.42.0@sha256:1b4a6eee8550240b0faedad04d984ca939513650e1d9bd423502c67355e3822f
        relation: external
      - name: etcd-wrapper-image
        type: ociImage
        version: v0.6.2
        access:
          type: ociArtifact
          imageReference: europe-docker.pkg.dev/gardener-project/public/gardener/etcd-wrapper:v0.6.2@sha256:3992f1aedaae733acdd5794ba02cf1beb311c7a24269accd790885cecacdd3f9
        relation: external
      - name: etcdbrctl-image
        type: ociImage
        version: v0.41.2
        access:
          type: ociArtifact
          imageReference: europe-docker.pkg.dev/gardener-project/public/gardener/etcdbrctl:v0.41.2@sha256:b21f0d7aeaa275bad9bf616fba9ae29092ac39a391a88b2659eba5981b4650a1
        relation: external
  - name: github.com/platform-mesh/infra
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    sources:
      - name: chart
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
    componentReferences:
      - name: chart
        componentName: github.com/platform-mesh/helm-charts/infra
        version: ${PM_VERSION}
      - name: image
        componentName: github.com/platform-mesh/images/infra
        version: ${PM_VERSION}
