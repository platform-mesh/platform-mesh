envsubst:
  KEYCLOAK_IMAGE_REGISTRY: keycloak.operator.image.registry
  KEYCLOAK_IMAGE_REPOSITORY: keycloak.operator.image.repository
  KEYCLOAK_IMAGE_TAG: keycloak.operator.image.tag
  BUSYBOX_IMAGE_REGISTRY: keycloak.operator.waitForDb.image.registry
  BUSYBOX_IMAGE_REPOSITORY: keycloak.operator.waitForDb.image.repository
  BUSYBOX_IMAGE_TAG: keycloak.operator.waitForDb.image.tag
  POSTGRES_IMAGE_REGISTRY: cnpg.cluster.image.registry
  POSTGRES_IMAGE_REPOSITORY: cnpg.cluster.image.repository
  POSTGRES_IMAGE_TAG: cnpg.cluster.image.tag
  DEX_IMAGE_REGISTRY: dex.image.registry
  DEX_IMAGE_REPOSITORY: dex.image.repository
  DEX_IMAGE_TAG: dex.image.tag
  DEX_IMAGE_DIGEST: dex.image.digest
  ETCD_WRAPPER_IMAGE_REPOSITORY: kcp.etcd.image.repository
  ETCD_WRAPPER_IMAGE_TAG: kcp.etcd.image.tag
  ETCDBRCTL_IMAGE_REPOSITORY: kcp.etcd.backup.image.repository
  ETCDBRCTL_IMAGE_TAG: kcp.etcd.backup.image.tag
imageResources:
- name: keycloak-image
  resource: keycloak-image
  resourceName: keycloak-image
  annotations:
    repo: oci
    artifact: image
    for: infra
    path: keycloak.operator.image.tag
- name: busybox-image
  resource: busybox-image
  resourceName: busybox-image
  annotations:
    repo: oci
    artifact: image
    for: infra
    path: keycloak.operator.waitForDb.image.tag
- name: postgres-image
  resource: postgres-image
  resourceName: postgres-image
  annotations:
    repo: oci
    artifact: image
    for: infra
    path: cnpg.cluster.image.tag
- name: kcp-server-image
  resource: image
  absoluteReferencePath:
  - name: kcp
  annotations:
    repo: oci
    artifact: image
    for: infra
    path: kcp.image.tag
    image-ref: combined
- name: etcd-wrapper-image
  resource: etcd-wrapper-image
  annotations:
    repo: oci
    artifact: image
    for: infra
    path: kcp.etcd.image.tag
    image-ref: combined
- name: etcdbrctl-image
  resource: etcdbrctl-image
  annotations:
    repo: oci
    artifact: image
    for: infra
    path: kcp.etcd.backup.image.tag
    image-ref: combined
