# Default kcp audit policy.
# Verbatim copy of kcp-dev/kcp cmd/test-server/kcp/audit-policy.yaml (kcp commit 1933e289e).
# Replace it via kcp.audit.policy.inline or kcp.audit.policy.existingConfigMap.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
- RequestReceived
omitManagedFields: true
rules:
- level: None
  nonResourceURLs:
  - "/api*"
  - "/version"

- level: Metadata
  resources:
  - group: ""
    resources: ["secrets", "configmaps"]
  - group: "authorization.k8s.io"
    resources: ["subjectaccessreviews"]

- level: Metadata
  verbs: ["list", "watch"]

- level: Metadata
  verbs: ["get", "delete"]
  omitStages:
  - ResponseStarted

- level: RequestResponse
  verbs: ["create", "update", "patch"]
  omitStages:
  - ResponseStarted
