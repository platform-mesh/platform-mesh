{{- if .Values.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gatewayApi.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gatewayApi.gatewayClassName }}
  listeners:
    {{- $listeners := concat (.Values.gatewayApi.listeners | default list) (.Values.gatewayApi.listenersExtra | default list) }}
    {{- if .Values.gatewayApi.passthrough.enabled }}
    {{- $generated := include "kcp.passthroughListeners" . | fromYamlArray }}
    {{- range $generated }}
    {{- $name := .name }}
    {{- range $listeners }}
    {{- if eq .name $name }}
    {{- fail (printf "gatewayApi listener %q is generated from the kcp hostnames; remove it from gatewayApi.listeners or set gatewayApi.passthrough.enabled=false" $name) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $listeners = concat $listeners $generated }}
    {{- end }}
    {{- $listeners | toYaml | nindent 4 }}
{{- with .Values.gatewayApi.infrastructure }}
  infrastructure:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
