{{- if and .Values.gatewayApi.enabled .Values.gatewayApi.baseDomain }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gatewayApi.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gatewayApi.gatewayClassName | quote }}
  listeners:
    - name: terminate
      hostname: {{ .Values.gatewayApi.baseDomain | quote }}
      port: {{ .Values.gatewayApi.port }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: domain-certificate
            namespace: {{ .Release.Namespace }}
    - name: terminate-wildstar
      hostname: {{ printf "*.%s" .Values.gatewayApi.baseDomain | quote }}
      port: {{ .Values.gatewayApi.port }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: domain-certificate
            namespace: {{ .Release.Namespace }}
    - name: terminate-services
      hostname: {{ printf "*.services.%s" .Values.gatewayApi.baseDomain | quote }}
      port: {{ .Values.gatewayApi.port }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: domain-certificate
            namespace: {{ .Release.Namespace }}
      allowedRoutes:
        namespaces:
          from: All
    {{- if .Values.gatewayApi.passthrough.enabled }}
    {{- include "kcp.passthroughListeners" . | nindent 4 }}
    {{- end }}
{{- with .Values.gatewayApi.infrastructure }}
  infrastructure:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
