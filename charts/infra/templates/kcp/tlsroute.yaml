{{- if .Values.gatewayApi.enabled }}
{{- $_ := required "exposure.baseDomain is required" .Values.exposure.baseDomain -}}
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: kcp-front-proxy-tlsroute
  namespace: {{ .Values.kcp.namespace | default "kcp-system" }}
spec:
  hostnames:
  - "kcp.api.{{ .Values.exposure.baseDomain }}"
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gatewayApi.name }}
    sectionName: {{ include "kcp.passthroughSectionName" (dict "root" $ "suffix" "") }}
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: frontproxy-front-proxy
      namespace: {{ .Values.kcp.namespace | default "kcp-system" }}
      port: {{ .Values.kcp.external.port | default .Values.exposure.port }}
{{- end }}
