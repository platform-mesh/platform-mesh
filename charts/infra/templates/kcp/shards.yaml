{{- $kcpPort := int (.Values.kcp.external.port | default .Values.exposure.port) -}}
{{/* kcp always uses HTTPS; omit only :443 from its advertised URLs. */}}
{{- $kcpPortSuffix := "" -}}
{{- if ne $kcpPort 443 -}}
  {{- $kcpPortSuffix = printf ":%d" $kcpPort -}}
{{- end -}}
{{- range .Values.kcp.shards }}
{{- $_ := required "exposure.baseDomain is required" $.Values.exposure.baseDomain -}}
{{- $shardName := .name }}
{{- $etcdName := printf "etcd-kcp-%s" $shardName }}
{{- $etcdServiceName := printf "etcd-kcp-%s-client" $shardName }}
{{- $hostname := .hostname | default (printf "%s.kcp.%s" .name $.Values.exposure.baseDomain) }}
{{- $shardBaseURL := (.spec).shardBaseURL | default (printf "https://%s%s/" $hostname $kcpPortSuffix) }}
{{- $mergedEtcd := mustMergeOverwrite (mustDeepCopy $.Values.kcp.etcd) (.etcd | default dict) }}
{{- $defaultSpec := dict "replicas" $.Values.kcp.rootShard.replicas "extraArgs" $.Values.kcp.rootShard.extraArgs "resources" $.Values.kcp.rootShard.resources }}
{{- $mergedSpec := mustMergeOverwrite $defaultSpec (.spec | default dict) }}
---
{{ include "kcp.etcd" (dict "name" $etcdName "namespace" ($.Values.kcp.namespace | default "kcp-system") "etcd" $mergedEtcd) }}
---
apiVersion: operator.kcp.io/v1alpha1
kind: Shard
metadata:
  name: {{ $shardName }}
  namespace: {{ $.Values.kcp.namespace | default "kcp-system" }}
spec:
{{- include "kcp.shard.spec" (dict "root" $ "replicas" $mergedSpec.replicas "shardBaseURL" $shardBaseURL "extraArgs" $mergedSpec.extraArgs "resources" $mergedSpec.resources "port" $kcpPort "webhookPort" $.Values.kcp.webhook.port) | nindent 2 }}
  rootShard:
    ref:
      name: root
  cache:
    ref:
      name: {{ $.Values.kcp.cacheServer.name }}
  etcd:
    endpoints:
      - http://{{ $etcdServiceName }}.{{ $.Values.kcp.namespace | default "kcp-system" }}.svc.cluster.local:{{ $mergedEtcd.service.port | default 2379 }}
  certificateTemplates:
    server:
      spec:
        dnsNames:
          - {{ $shardName }}-shard-kcp
          - {{ $shardName }}-shard-kcp.{{ $.Values.kcp.namespace | default "kcp-system" }}
          - {{ $shardName }}-shard-kcp.{{ $.Values.kcp.namespace | default "kcp-system" }}.svc.cluster.local
          - {{ $hostname }}
---
{{ include "kcp.tlsroute" (dict "name" (printf "kcp-%s-tlsroute" $shardName) "hostname" $hostname "serviceName" (printf "%s-shard-kcp" $shardName) "namespace" ($.Values.kcp.namespace | default "kcp-system") "gatewayName" $.Values.gatewayApi.name "sectionName" (include "kcp.passthroughSectionName" (dict "root" $ "suffix" $shardName))) }}
{{- end }}
