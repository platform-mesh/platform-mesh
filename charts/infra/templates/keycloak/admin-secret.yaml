{{- if and .Values.keycloak.operator.enabled .Values.keycloak.operator.admin.password }}
{{- $_ := include "infra.keycloak.adminSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  username: {{ .Values.keycloak.operator.admin.username | quote }}
  password: {{ .Values.keycloak.operator.admin.password | quote }}
  {{- with .Values.keycloak.operator.admin.secret }}
  secret: {{ . | quote }}
  {{- end }}
{{- end }}
