{{- if and .Values.keycloak.operator.enabled .Values.keycloak.operator.db.password }}
{{- $_ := include "infra.keycloak.databaseSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  username: {{ .Values.keycloak.operator.db.username | quote }}
  password: {{ .Values.keycloak.operator.db.password | quote }}
{{- end }}
