{{- if and .Values.cnpg.enabled .Values.cnpg.roles.keycloak.password }}
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-keycloak-user
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  username: {{ .Values.cnpg.roles.keycloak.username | quote }}
  password: {{ .Values.cnpg.roles.keycloak.password | quote }}
{{- end }}
{{- if and .Values.cnpg.enabled .Values.cnpg.roles.openfga.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-openfga-user
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  username: {{ .Values.cnpg.roles.openfga.username | quote }}
  password: {{ .Values.cnpg.roles.openfga.password | quote }}
{{- end }}
