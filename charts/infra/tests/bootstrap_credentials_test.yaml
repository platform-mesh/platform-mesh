suite: Test database credential bootstrap hooks
release:
  name: infra
  namespace: platform-mesh-system
templates:
  - credentials/bootstrap.yaml
tests:
  - it: does not bootstrap credentials for disabled CNPG
    set:
      credentials.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: does not bootstrap admin or external database credentials
    set:
      credentials.enabled: true
      keycloak.operator.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: requires externally provisioned database credentials by default
    set:
      keycloak.operator.enabled: true
      cnpg.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: creates prerequisite hooks and the database bootstrap Job
    set:
      credentials.enabled: true
      keycloak.operator.enabled: true
      cnpg.enabled: true
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - equal:
          path: rules[0].resourceNames
          value: [cnpg-keycloak-user, keycloak-db-credentials, cnpg-openfga-user]
        documentIndex: 1
      - equal:
          path: rules[0].verbs
          value: [get]
        documentIndex: 1
      - equal:
          path: rules[1].verbs
          value: [create]
        documentIndex: 1
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        documentIndex: 4
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        documentIndex: 4
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "false"
        documentIndex: 4
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: infra-credentials-bootstrap
        documentIndex: 4
      - equal:
          path: stringData["config.json"]
          value: '{"groups":[[{"name":"cnpg-keycloak-user","password":"","username":"keycloak"},{"name":"keycloak-db-credentials","password":"","readOnly":true,"username":"keycloak"}],[{"name":"cnpg-openfga-user","password":"","username":"openfga"}]]}'
        documentIndex: 3
  - it: reads only CNPG Secrets when Keycloak is disabled
    set:
      credentials.enabled: true
      cnpg.enabled: true
    asserts:
      - equal:
          path: rules[0].resourceNames
          value: [cnpg-keycloak-user, cnpg-openfga-user]
        documentIndex: 1
  - it: excludes unrelated external Keycloak database credentials
    set:
      credentials.enabled: true
      cnpg.enabled: true
      keycloak.operator.enabled: true
      keycloak.operator.db.host: postgres.external.example
      keycloak.operator.db.existingSecret: external-keycloak-db
    asserts:
      - equal:
          path: rules[0].resourceNames
          value: [cnpg-keycloak-user, cnpg-openfga-user]
        documentIndex: 1
      - equal:
          path: stringData["config.json"]
          value: '{"groups":[[{"name":"cnpg-keycloak-user","password":"","username":"keycloak"}],[{"name":"cnpg-openfga-user","password":"","username":"openfga"}]]}'
        documentIndex: 3
  - it: validates a supplied shared database Secret without granting admin access
    set:
      credentials.enabled: true
      cnpg.enabled: true
      keycloak.operator.enabled: true
      keycloak.operator.db.existingSecret: supplied-keycloak-db
    asserts:
      - contains:
          path: rules[0].resourceNames
          content: supplied-keycloak-db
        documentIndex: 1
      - notContains:
          path: rules[0].resourceNames
          content: keycloak-admin
        documentIndex: 1
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"name":"supplied-keycloak-db","password":"","readOnly":true,"required":true,"username":"keycloak"'
        documentIndex: 3
  - it: supports image localization
    set:
      credentials.enabled: true
      cnpg.enabled: true
      credentials.image.registry: registry.example.com
      credentials.image.repository: mirror/python
      credentials.image.tag: custom
      credentials.image.digest: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/mirror/python:custom
        documentIndex: 4
