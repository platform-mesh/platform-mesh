set:
  exposure.baseDomain: example.com
  exposure.gatewayClassName: traefik
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test Dex manifests
release:
  name: infra
  namespace: platform-mesh-system
tests:
- it: dex disabled by default
  templates:
    - dex/configmap.yaml
    - dex/deployment.yaml
    - dex/service.yaml
    - dex/httproute.yaml
  asserts:
    - hasDocuments:
        count: 0
- it: match snapshots with dex enabled
  set:
    dex:
      enabled: true
    gatewayApi:
      enabled: true
  templates:
    - dex/configmap.yaml
    - dex/deployment.yaml
    - dex/service.yaml
    - dex/httproute.yaml
  asserts:
    - matchSnapshot: {}
- it: dex static password groups rendered
  set:
    dex:
      enabled: true
      staticPasswords:
        - email: admin@portal.localhost
          hash: "$2a$10$hash"
          username: admin
          userID: "1"
          groups:
            - platform-mesh:admins
        - email: nogroups@portal.localhost
          hash: "$2a$10$hash"
          username: nogroups
          userID: "2"
  templates:
    - dex/configmap.yaml
  asserts:
    - matchRegex:
        path: data["config.yaml"]
        pattern: 'userID: "1"\n  groups:\n  - "platform-mesh:admins"\n- email: "nogroups@portal.localhost"'
    - notMatchRegex:
        path: data["config.yaml"]
        pattern: 'userID: "2"\n  groups:'
- it: dex password connector not rendered by default
  set:
    dex:
      enabled: true
  templates:
    - dex/configmap.yaml
  asserts:
    - notMatchRegex:
        path: data["config.yaml"]
        pattern: passwordConnector
- it: dex password connector rendered when set
  set:
    dex:
      enabled: true
      passwordConnector: local
  templates:
    - dex/configmap.yaml
  asserts:
    - matchRegex:
        path: data["config.yaml"]
        pattern: 'oauth2:\n  skipApprovalScreen: true\n  passwordConnector: "local"'
- it: dex expiry not rendered by default
  set:
    dex:
      enabled: true
  templates:
    - dex/configmap.yaml
  asserts:
    - notMatchRegex:
        path: data["config.yaml"]
        pattern: expiry
- it: dex expiry rendered when set
  set:
    dex:
      enabled: true
      expiry:
        refreshTokens:
          disableRotation: true
          reuseInterval: 8760h
  templates:
    - dex/configmap.yaml
  asserts:
    - matchRegex:
        path: data["config.yaml"]
        pattern: '\nexpiry:\n  refreshTokens:\n    disableRotation: true\n    reuseInterval: 8760h\nenablePasswordDB: true'
- it: dex deployment restarts on config change
  set:
    dex:
      enabled: true
  templates:
    - dex/deployment.yaml
  asserts:
    - matchRegex:
        path: spec.template.metadata.annotations["checksum/config"]
        pattern: ^[0-9a-f]{64}$
- it: dex httproute not rendered when gateway API disabled
  set:
    dex:
      enabled: true
    gatewayApi:
      enabled: false
  templates:
    - dex/httproute.yaml
  asserts:
    - hasDocuments:
        count: 0
- it: dex deployment rendered when enabled
  set:
    dex:
      enabled: true
  templates:
    - dex/deployment.yaml
  asserts:
    - hasDocuments:
        count: 1
- it: dex service rendered when enabled
  set:
    dex:
      enabled: true
  templates:
    - dex/service.yaml
  asserts:
    - hasDocuments:
        count: 1
