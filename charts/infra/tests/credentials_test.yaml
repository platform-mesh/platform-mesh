suite: Test native and supplied credential references
release:
  name: infra
  namespace: platform-mesh-system
templates:
  - keycloak/admin-secret.yaml
  - keycloak/db-secret.yaml
  - keycloak/keycloak.yaml
  - cnpg/secrets.yaml
tests:
  - it: leaves native admin and generated database Secrets to their owners
    templates:
      - keycloak/admin-secret.yaml
      - keycloak/db-secret.yaml
      - cnpg/secrets.yaml
    set:
      keycloak.operator.enabled: true
      cnpg.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: uses native admin credentials and the CNPG role Secret directly
    templates:
      - keycloak/keycloak.yaml
    set:
      keycloak.operator.enabled: true
      cnpg.enabled: true
    asserts:
      - equal:
          path: spec.bootstrapAdmin.user.secret
          value: keycloak-initial-admin
      - equal:
          path: spec.db.usernameSecret.name
          value: cnpg-keycloak-user
      - equal:
          path: spec.db.passwordSecret.name
          value: cnpg-keycloak-user
  - it: references supplied admin and database Secrets
    templates:
      - keycloak/keycloak.yaml
    set:
      keycloak.operator.enabled: true
      keycloak.operator.admin.existingSecret: existing-admin
      keycloak.operator.db.existingSecret: existing-db
    asserts:
      - equal:
          path: spec.bootstrapAdmin.user.secret
          value: existing-admin
      - equal:
          path: spec.db.usernameSecret.name
          value: existing-db
      - equal:
          path: spec.db.passwordSecret.name
          value: existing-db
  - it: does not render supplied credential Secrets
    templates:
      - keycloak/admin-secret.yaml
      - keycloak/db-secret.yaml
    set:
      keycloak.operator.enabled: true
      keycloak.operator.admin.existingSecret: existing-admin
      keycloak.operator.db.existingSecret: existing-db
    asserts:
      - hasDocuments:
          count: 0
  - it: renders an explicit admin password without requiring a client secret
    templates:
      - keycloak/admin-secret.yaml
    set:
      keycloak.operator.enabled: true
      keycloak.operator.admin.password: explicit-admin-password
      cnpg.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: keycloak-admin
      - equal:
          path: stringData.username
          value: keycloak-admin
      - equal:
          path: stringData.password
          value: explicit-admin-password
      - notExists:
          path: stringData.secret
  - it: preserves legacy explicit credential references
    templates:
      - keycloak/keycloak.yaml
    set:
      keycloak.operator.enabled: true
      keycloak.operator.admin.password: explicit-admin-password
      keycloak.operator.db.password: explicit-db-password
    asserts:
      - equal:
          path: spec.bootstrapAdmin.user.secret
          value: keycloak-admin
      - equal:
          path: spec.db.usernameSecret.name
          value: keycloak-db-credentials
      - equal:
          path: spec.db.passwordSecret.name
          value: keycloak-db-credentials
  - it: rejects an external database without supplied credentials
    templates:
      - keycloak/keycloak.yaml
    set:
      keycloak.operator.enabled: true
      keycloak.operator.db.host: postgres.external.example
    asserts:
      - failedTemplate:
          errorPattern: keycloak.operator.db.existingSecret
  - it: renders an OpenFGA override independently of the Keycloak password
    templates:
      - cnpg/secrets.yaml
    set:
      cnpg.enabled: true
      cnpg.roles.openfga.password: explicit-openfga-password
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: cnpg-openfga-user
      - equal:
          path: stringData.password
          value: explicit-openfga-password
  - it: renders a Keycloak role override independently of the OpenFGA password
    templates:
      - cnpg/secrets.yaml
    set:
      cnpg.enabled: true
      cnpg.roles.keycloak.password: explicit-keycloak-password
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: cnpg-keycloak-user
      - equal:
          path: stringData.password
          value: explicit-keycloak-password
