# Set a component to false when it is supplied by the target cluster.
flux2:
  enabled: true
  imageAutomationController:
    # -- Enable Flux image updates when using ImageUpdateAutomation resources. Platform Mesh uses OCM component versions instead.
    create: false
  imageReflectionController:
    # -- Enable Flux image scanning when using ImageRepository or ImagePolicy resources.
    create: false
  # Flux's default policies select every Pod in the release namespace and only
  # allow ingress from that namespace. The API server must reach cert-manager's
  # admission webhook, so do not install them alongside shared prerequisites.
  policies:
    create: false
  # Platform Mesh creates several independent HelmReleases.  Some wait for KCP
  # bootstrap resources, so the default four workers can otherwise starve the
  # infra release that creates those resources.
  helmController:
    container:
      additionalArgs:
        - --concurrent=10
ocm-k8s-toolkit:
  enabled: true
cert-manager:
  enabled: true
  crds:
    enabled: true
  webhook:
    # Gardener requires admission webhooks to complete within 15 seconds so
    # they cannot delay shoot maintenance or hibernation operations.
    timeoutSeconds: 15
traefik:
  # Install on the second pass, after Gateway API CRDs are established.
  enabled: false
  gatewayClass:
    enabled: true
  # Platform Mesh brings its own Gateway (k8sapi-gateway, infra chart); the
  # chart's default Gateway would only sit unused next to it.
  gateway:
    enabled: false
  providers:
    kubernetesGateway:
      enabled: true
traefik-crds:
  enabled: true
  # Traefik's own CRDs (Middleware, ...). Set to false when not using Traefik.
  traefik: true
  # Gateway API CRDs. The upstream Gateway API project publishes no Helm chart;
  # Traefik's CRD chart bundles the upstream release unmodified, in a standard
  # and an experimental channel (mutually exclusive).
  # Standard channel serves TLSRoute only as v1, but infra charts of released
  # Platform Mesh versions up to 26.10 still create TLSRoute v1alpha2, so the
  # experimental channel (serves v1, v1alpha2 and v1alpha3) is used until those
  # are no longer installed. Set both to false when the cluster already
  # provides the Gateway API CRDs.
  gatewayAPI: false
  gatewayAPIExperimental: true
cnpg:
  enabled: true
keycloak-operator:
  enabled: true
etcd-druid:
  enabled: true

# Local Kind only. Production installations should provide their own certificates.
localCertificates:
  enabled: false
  # Namespace consumed by the Platform Mesh Gateway and PMO profile.
  namespace: platform-mesh-system
  dnsNames: []
  caSecretName: domain-certificate-ca
  certificateSecretName: domain-certificate
