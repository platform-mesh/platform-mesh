apiVersion: v2
name: platform-mesh-prerequisites
description: Optional infrastructure prerequisites for Platform Mesh
type: application
version: 0.0.0
appVersion: "0.1.0"
dependencies:
  - name: flux2
    version: 2.17.2
    repository: oci://ghcr.io/fluxcd-community/charts
    condition: flux2.enabled
  - name: chart
    alias: ocm-k8s-toolkit
    version: 0.13.0
    repository: oci://ghcr.io/open-component-model/kubernetes/controller
    condition: ocm-k8s-toolkit.enabled
  - name: cert-manager
    version: v1.20.5
    repository: oci://quay.io/jetstack/charts
    condition: cert-manager.enabled
  - name: gateway-api-crds
    version: 0.0.0
    repository: file://../gateway-api-crds
    condition: gateway-api-crds.enabled
  - name: traefik
    version: 42.1.3
    repository: oci://ghcr.io/traefik/helm
    condition: traefik.enabled
  - name: traefik-crds
    version: 1.14.0
    repository: oci://ghcr.io/platform-mesh/ocm/charts
    condition: traefik-crds.enabled
  - name: cloudnative-pg
    version: 0.28.0
    repository: oci://ghcr.io/cloudnative-pg/charts
    condition: cnpg.enabled
  - name: keycloak-operator
    version: 0.0.0
    repository: file://../keycloak-operator
    condition: keycloak-operator.enabled
  - name: etcd-druid
    version: v0.39.1
    repository: oci://ghcr.io/platform-mesh/charts/gardener
    condition: etcd-druid.enabled
