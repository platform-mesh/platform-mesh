# The identity the server runs as. It carries no resource permissions of its
# own — it acts through impersonation, so kcp authorizes every per-workspace
# request as the caller, and the audit log records both identities.
#
# The operator provisions the ClusterRoleBinding below in the kubeconfig's
# target workspace (root by default), but only the binding: the
# mcp-virtual-workspace-impersonator ClusterRole from the upstream
# deploy/kcp/rbac.yaml has to be applied in every workspace whose resources
# the server should reach on a caller's behalf.
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: mcp-vw-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kcp-mcp-vw.labels" . | nindent 4 }}
spec:
  target:
    frontProxyRef:
      name: {{ .Values.kcp.frontProxy }}
  # Matches the subject in the upstream deploy/kcp/rbac.yaml binding.
  username: mcp-virtual-workspace
  validity: 8766h # 1 year
  secretRef:
    name: mcp-vw-server-kubeconfig
  authorization:
    clusterRoleBindings:
      clusterRoles:
        - mcp-virtual-workspace-impersonator
