# The identity the init container bootstraps with: the kcp administrator.
# kcp's bootstrap policy binds system:kcp:admin to cluster-admin.
#
# Targets the front-proxy rather than the root shard because bootstrapping
# walks the workspace tree from root down, and path resolution across shards
# is something only the front-proxy does.
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: access-vw-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kcp-access-vw.labels" . | nindent 4 }}
spec:
  target:
    frontProxyRef:
      name: {{ .Values.kcp.frontProxy }}
  username: kcp-admin
  groups:
    - system:kcp:admin
  validity: 8766h # 1 year
  secretRef:
    name: access-vw-bootstrap-kubeconfig
---
# The identity the server runs as. Scoped to the workspace holding the
# APIExport; the init container grants it the controller role there (via
# --server-user), which covers apiexports, endpoint slices, RBAC reads and
# apiexports/content — and nothing else.
#
# The generated kubeconfig is self-contained and its current context already
# points at the controllers workspace, so the server needs no
# --workspace-path.
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: access-vw-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kcp-access-vw.labels" . | nindent 4 }}
spec:
  target:
    frontProxyRef:
      name: {{ .Values.kcp.frontProxy }}
  targetWorkspace: {{ .Values.workspacePrefix }}:{{ .Values.controllersWorkspace }}
  # No groups: this identity holds only what the init container grants it.
  username: access-vw
  validity: 8766h # 1 year
  secretRef:
    name: access-vw-server-kubeconfig
