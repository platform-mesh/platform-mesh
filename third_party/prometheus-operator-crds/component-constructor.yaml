        version: 29.0.0
        access:
          type: ociArtifact
          # renovate: datasource=docker depName=ghcr.io/prometheus-community/charts/prometheus-operator-crds
          imageReference: ghcr.io/prometheus-community/charts/prometheus-operator-crds:29.0.0
