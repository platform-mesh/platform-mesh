components:
  - name: github.com/openfga/openfga
    version: ${PM_VERSION}
    provider:
      name: openfga
    resources:
      - name: chart
        type: helmChart
        relation: local
        # renovate: datasource=docker depName=ghcr.io/openfga/helm-charts/openfga
        version: 0.2.62
        access:
          type: ociArtifact
          # renovate: datasource=docker depName=ghcr.io/openfga/helm-charts/openfga
          imageReference: ghcr.io/openfga/helm-charts/openfga:0.2.62
      - name: image
        type: ociImage
        relation: local
        # renovate: datasource=docker depName=docker.io/openfga/openfga
        version: v1.22.1
        access:
          type: ociArtifact
          # renovate: datasource=docker depName=docker.io/openfga/openfga
          imageReference: "docker.io/openfga/openfga:v1.22.1"
