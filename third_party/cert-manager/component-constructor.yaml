components:
  - name: github.com/cert-manager/cert-manager
    version: ${PM_VERSION}
    provider:
      name: cert-manager
    resources:
      - name: chart
        type: helmChart
        relation: local
        # renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager
        version: v1.21.3
        access:
          type: ociArtifact
          # renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager
          imageReference: quay.io/jetstack/charts/cert-manager:v1.21.3
      - name: webhook-image
        type: ociImage
        relation: local
        # renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager
        version: v1.21.3
        access:
          type: ociArtifact
          # renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager
          imageReference: "quay.io/jetstack/cert-manager-webhook:v1.21.3"
      - name: controller-image
        type: ociImage
        relation: local
        # renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager
        version: v1.21.3
        access:
          type: ociArtifact
          # renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager
          imageReference: "quay.io/jetstack/cert-manager-controller:v1.21.3"
      - name: cainjector-image
        type: ociImage
        relation: local
        # renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager
        version: v1.21.3
        access:
          type: ociArtifact
          # renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager
          imageReference: "quay.io/jetstack/cert-manager-cainjector:v1.21.3"
