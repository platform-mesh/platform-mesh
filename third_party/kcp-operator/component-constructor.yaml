components:
  - name: github.com/kcp-dev/kcp-operator
    version: ${PM_VERSION}
    provider:
      name: kcp
    resources:
      - name: chart
        type: helmChart
        relation: local
        # renovate: datasource=helm depName=kcp-operator registryUrl=https://kcp-dev.github.io/helm-charts
        version: 0.7.12
        access:
          type: helm
          helmRepository: https://kcp-dev.github.io/helm-charts
          # renovate: datasource=helm depName=kcp-operator registryUrl=https://kcp-dev.github.io/helm-charts
          helmChart: kcp-operator:0.7.12
      - name: image
        type: ociImage
        relation: local
        # renovate: datasource=docker depName=ghcr.io/kcp-dev/kcp-operator
        version: v0.10.3
        access:
          type: ociArtifact
          # renovate: datasource=docker depName=ghcr.io/kcp-dev/kcp-operator
          imageReference: "ghcr.io/kcp-dev/kcp-operator:v0.10.3"
