version: '3'

includes:
  tools:
    taskfile: tools/Taskfile.yaml
    dir: .

tasks:
  fmt:
    cmds:
      - go fmt ./...
  lint:
    vars:
      GOLANGCI_LINT:
        sh: 'UGET_DIRECTORY={{.ROOT_DIR}}/bin UGET_CHECKSUMS={{.ROOT_DIR}}/hack/tools.checksums UGET_PRINT_PATH=absolute task --dir {{.ROOT_DIR}} tools:golangci-lint'
    cmds:
      - task: fmt
      - '{{.GOLANGCI_LINT}} run --config {{.ROOT_DIR}}/.golangci.yaml --timeout 15m ./...'
  build:
    cmds:
      - go build ./...
      - go vet ./tests/...
      - task: pmctl
  pmctl:
    desc: Build the pmctl CLI into bin/pmctl (VERSION= to override the stamped version).
    vars:
      VERSION:
        sh: 'echo "${VERSION:-$(go run ./hack/release/get-version current)}"'
      GIT_COMMIT:
        sh: git rev-parse HEAD
      BUILD_DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
      LDFLAGS: >-
        -X k8s.io/component-base/version.gitVersion={{.VERSION}}
        -X k8s.io/component-base/version.gitCommit={{.GIT_COMMIT}}
        -X k8s.io/component-base/version.buildDate={{.BUILD_DATE}}
    cmds:
      - go build -ldflags '{{.LDFLAGS}}' -o {{.ROOT_DIR}}/bin/pmctl ./cli/cmd/pmctl
  generate:
    desc: Nothing to generate in the root module.
    cmds:
      - 'echo "root: nothing to generate"'
  test:
    desc: Unit tests of the root module. tests/integration, tests/e2e and tests/upgrade need an environment and have their own tasks (test-integration, test-e2e, test-upgrade).
    cmds:
      - go test $(go list ./... | grep -v -e /tests/integration/ -e /tests/e2e/ -e /tests/upgrade)
  test-e2e:
    desc: No e2e tests in the root module.
    cmds:
      - 'echo "root: no e2e tests"'
  tidy:
    cmds:
      - go mod tidy
