version: '3'

includes:
  tools:
    taskfile: tools/Taskfile.yaml
    dir: .

tasks:
  fmt:
    cmds:
      - go fmt ./...
  lint:
    vars:
      GOLANGCI_LINT:
        sh: 'UGET_DIRECTORY={{.ROOT_DIR}}/bin UGET_CHECKSUMS={{.ROOT_DIR}}/hack/tools.checksums UGET_PRINT_PATH=absolute task --dir {{.ROOT_DIR}} tools:golangci-lint'
    cmds:
      - task: fmt
      # tests/integration and tests/e2e are behind build tags
      - '{{.GOLANGCI_LINT}} run --config {{.ROOT_DIR}}/.golangci.yaml --build-tags integration,e2e --timeout 15m ./...'
  build:
    cmds:
      - go build ./...
      - go vet -tags integration,e2e ./tests/...
  generate:
    desc: Nothing to generate in the root module.
    cmds:
      - 'echo "root: nothing to generate"'
  test:
    cmds:
      - go test ./...
  test-e2e:
    desc: No e2e tests in the root module.
    cmds:
      - 'echo "root: no e2e tests"'
  tidy:
    cmds:
      - go mod tidy
