version: "3"

includes:
  tools:
    taskfile: ../../tools/Taskfile.yaml
    dir: .

tasks:
  build:
    cmds:
      - go build ./...
  generate:
    cmds:
      - echo "No generated files in this module."
  fmt:
    cmds:
      - go fmt ./...
  lint:
    cmds:
      - task: fmt
      - task: tools:lint
  test:
    cmds:
      - go test -count=1 ./...
  tidy:
    cmds:
      - go mod tidy
  tidy-check:
    cmds:
      - go mod tidy -diff
      - go list -m all >/dev/null
