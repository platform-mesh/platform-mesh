components:
  - name: github.com/platform-mesh/images/platform-mesh-deployer
    version: ${PM_VERSION}
    provider:
      name: The Platform Mesh Team
    sources:
      - name: source
        type: git
        version: ${PM_VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
    resources:
      - name: image
        type: ociImage
        relation: external
        version: v${PM_VERSION}
        access:
          type: ociArtifact
          imageReference: ${IMAGE_REPO}/platform-mesh-deployer:v${PM_VERSION}
      - name: sbom-cyclonedx
        type: sbom
        input:
          type: file
          path: platform-mesh-deployer/sbom-cyclonedx.json
          mediaType: application/vnd.cyclonedx+json
      - name: sbom-spdx
        type: sbom
        input:
          type: file
          path: platform-mesh-deployer/sbom-spdx.json
          mediaType: application/spdx+json
