version: "3"

# Standard component Taskfile for sdk-access-operator.
# Exposes the repo-standard targets: lint, test, test-e2e, generate, build.
#
# Shared tools (controller-gen, golangci-lint) come from the repository-root
# bin/ — installed by the root `tools:` tasks, referenced here via ROOT_BIN.

includes:
  # Shared go-installable tooling (controller-gen, golangci-lint, mockery,
  # apigen), installed once into the root bin/ and reused by every component.
  tools:
    taskfile: ../../tools/Taskfile.yaml
    dir: .

tasks:
  build:
    desc: Build the sdk-access-operator module.
    cmds:
      - go build ./...
  fmt:
    cmds:
      - go fmt ./...
  lint:
    desc: Lint the sdk-access-operator module.
    cmds:
      - task: fmt
      - task: tools:lint
  generate:
    desc: Regenerate deepcopy code for the sdk-access-operator module.
    cmds:
      - task: tools:generate-deepcopy
        vars:
          BASEDIR: '{{.TOPLEVEL}}/operators/sdk-access-operator'
          PATH: /...
  test:
    desc: Run sdk-access-operator unit tests.
    cmds:
      - go test -count=1 ./...
  test-e2e:
    desc: No e2e tests for the sdk-access-operator module.
    cmds:
      - 'echo "sdk-access-operator: no e2e tests"'
