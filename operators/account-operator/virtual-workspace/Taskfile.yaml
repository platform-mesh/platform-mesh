version: "3"

includes:
  # Shared go-installable tooling (golangci-lint, ...), installed once into
  # the root bin/ and reused by every component.
  tools:
    taskfile: ../../../tools/Taskfile.yaml
    dir: .

tasks:
  default:
    cmds:
      - task --list-all

  ## Development
  generate:
    desc: Nothing is generated here; the API types and their deepcopy functions are maintained by hand.
    cmds: []
  build:
    cmds:
      - go build ./...
  docker-build:
    desc: Build the container image (the build context is the repository root).
    cmds:
      - docker build -f Dockerfile {{.TOPLEVEL}}

  ## Testing
  fmt:
    cmds:
      - go fmt ./...
  lint:
    cmds:
      - task: fmt
      - task: tools:lint
  test:
    desc: Run unit tests (nothing in this module uses envtest).
    cmds:
      - go test ./... {{.ADDITIONAL_COMMAND_ARGS}}
