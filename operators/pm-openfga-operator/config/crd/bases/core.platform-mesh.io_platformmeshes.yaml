apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: platformmeshes.core.platform-mesh.io
spec:
  group: core.platform-mesh.io
  names:
    kind: PlatformMesh
    listKind: PlatformMeshList
    plural: platformmeshes
    singular: platformmesh
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: KCP status (shows reason if Unknown)
      jsonPath: .status.conditions[?(@.type=='KcpsetupSubroutine')].status
      name: KCP
      type: string
    - description: KCP reason if status is Unknown
      jsonPath: .status.conditions[?(@.type=='KcpsetupSubroutine')].reason
      name: KCP_REASON
      priority: 1
      type: string
    - description: Provider Secret status (shows reason if Unknown)
      jsonPath: .status.conditions[?(@.type=='ProvidersecretSubroutine')].status
      name: SECRET
      type: string
    - description: Provider Secret reason if status is Unknown
      jsonPath: .status.conditions[?(@.type=='ProvidersecretSubroutine')].reason
      name: SECRET_REASON
      priority: 1
      type: string
    - description: Deployment status (shows reason if Unknown)
      jsonPath: .status.conditions[?(@.type=='DeploymentSubroutine')].status
      name: DEPLOYMENT
      type: string
    - description: Deployment reason if status is Unknown
      jsonPath: .status.conditions[?(@.type=='DeploymentSubroutine')].reason
      name: DEPLOYMENT_REASON
      priority: 1
      type: string
    - description: Wait status (shows reason if Unknown)
      jsonPath: .status.conditions[?(@.type=='WaitSubroutine')].status
      name: WAIT
      type: string
    - description: Wait reason if status is Unknown
      jsonPath: .status.conditions[?(@.type=='WaitSubroutine')].reason
      name: WAIT_REASON
      priority: 1
      type: string
    - description: Shows if resource is ready
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PlatformMesh is the Schema for the platform-mesh API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlatformMeshSpec defines the desired state of PlatformMesh
            properties:
              exposure:
                properties:
                  baseDomain:
                    type: string
                  port:
                    type: integer
                  protocol:
                    type: string
                type: object
              featureToggles:
                items:
                  properties:
                    name:
                      type: string
                    parameters:
                      additionalProperties:
                        type: string
                      type: object
                  type: object
                type: array
              infraValues:
                x-kubernetes-preserve-unknown-fields: true
              kcp:
                properties:
                  extraDefaultAPIBindings:
                    items:
                      properties:
                        export:
                          type: string
                        path:
                          type: string
                        workspaceTypePath:
                          type: string
                      required:
                      - export
                      - path
                      - workspaceTypePath
                      type: object
                    type: array
                  extraProviderConnections:
                    items:
                      properties:
                        adminAuth:
                          description: |-
                            AdminAuth when true opts into cluster-admin certificate material. When false or omitted, the operator writes a scoped kubeconfig (ServiceAccount token and RBAC from the APIExports).
                            Scoped mode requires exactly one of endpointSliceName (virtual workspace server from slice) or apiExportNames (workspace server for Path).
                          type: boolean
                        apiExportNames:
                          description: |-
                            APIExportNames lists APIExport names in the workspace specified by Path.
                            Used to build RBAC for scoped kubeconfig when endpointSliceName is not set.
                            Each APIExport generates its own ClusterRole, all bound to the same ServiceAccount.
                          items:
                            minLength: 1
                            type: string
                          type: array
                        endpointSliceName:
                          type: string
                        external:
                          type: boolean
                        namespace:
                          type: string
                        path:
                          type: string
                        rawPath:
                          type: string
                        secret:
                          type: string
                      required:
                      - secret
                      type: object
                    type: array
                  extraWorkspaces:
                    items:
                      properties:
                        path:
                          type: string
                        type:
                          properties:
                            name:
                              type: string
                            path:
                              type: string
                          required:
                          - name
                          - path
                          type: object
                      required:
                      - path
                      - type
                      type: object
                    type: array
                  providerConnections:
                    items:
                      properties:
                        adminAuth:
                          description: |-
                            AdminAuth when true opts into cluster-admin certificate material. When false or omitted, the operator writes a scoped kubeconfig (ServiceAccount token and RBAC from the APIExports).
                            Scoped mode requires exactly one of endpointSliceName (virtual workspace server from slice) or apiExportNames (workspace server for Path).
                          type: boolean
                        apiExportNames:
                          description: |-
                            APIExportNames lists APIExport names in the workspace specified by Path.
                            Used to build RBAC for scoped kubeconfig when endpointSliceName is not set.
                            Each APIExport generates its own ClusterRole, all bound to the same ServiceAccount.
                          items:
                            minLength: 1
                            type: string
                          type: array
                        endpointSliceName:
                          type: string
                        external:
                          type: boolean
                        namespace:
                          type: string
                        path:
                          type: string
                        rawPath:
                          type: string
                        secret:
                          type: string
                      required:
                      - secret
                      type: object
                    type: array
                type: object
              ocm:
                properties:
                  component:
                    properties:
                      name:
                        default: platform-mesh
                        type: string
                    type: object
                  referencePath:
                    items:
                      properties:
                        name:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  repo:
                    properties:
                      name:
                        default: platform-mesh
                        type: string
                    type: object
                type: object
              profileConfigMap:
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              values:
                x-kubernetes-preserve-unknown-fields: true
              wait:
                properties:
                  resourceTypes:
                    items:
                      properties:
                        conditionStatus:
                          type: string
                        conditionType:
                          type: string
                        group:
                          type: string
                        kind:
                          type: string
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                        name:
                          type: string
                        namespace:
                          type: string
                        version:
                          type: string
                      required:
                      - group
                      - kind
                      - version
                      type: object
                      x-kubernetes-map-type: atomic
                    type: array
                type: object
            type: object
          status:
            description: PlatformMeshStatus defines the observed state of PlatformMesh
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              kcpWorkspaces:
                items:
                  properties:
                    name:
                      type: string
                    phase:
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
              nextReconcileTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
