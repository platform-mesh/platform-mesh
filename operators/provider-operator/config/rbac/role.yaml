---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - providers.platform-mesh.io
  resources:
  - managedproviders
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - providers.platform-mesh.io
  resources:
  - managedproviders/finalizers
  verbs:
  - update
- apiGroups:
  - providers.platform-mesh.io
  resources:
  - managedproviders/status
  verbs:
  - get
  - patch
  - update
