version: '3'

includes:
  # Shared go-installable tooling (golangci-lint, ...) installed into the root bin/.
  tools:
    taskfile: ../../tools/Taskfile.yaml
    dir: .

tasks:
  build:
    desc: Build the module
    cmds:
      - go build ./...

  fmt:
    desc: Run go fmt
    cmds:
      - go fmt ./...

  generate:
    cmds: []

  lint:
    desc: Run linter
    cmds:
      - task: fmt
      - task: tools:lint

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test-e2e:
    desc: No e2e suite yet
    cmds: []

  cover:
    desc: Run unit tests with coverage
    cmds:
      - go test -v -coverprofile=./cover.out -covermode=atomic -coverpkg=./... ./...

  docker-build:
    desc: Build the Docker image (build context is the repo root)
    vars:
      IMG: '{{.IMG | default "localhost/provider-operator:dev"}}'
    cmds:
      - docker build -t {{.IMG}} -f Dockerfile ../../

  kind-load:
    desc: Load the Docker image into a kind cluster
    vars:
      IMG: '{{.IMG | default "localhost/provider-operator:dev"}}'
      KIND_CLUSTER: '{{.KIND_CLUSTER | default "kind"}}'
    cmds:
      - kind load docker-image --name {{.KIND_CLUSTER}} {{.IMG}}
