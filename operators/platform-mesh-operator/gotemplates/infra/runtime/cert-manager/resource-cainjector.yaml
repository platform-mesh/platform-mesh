{{- if .certManager.enabled }}
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  labels:
    artifact: image
    repo: oci
    for: cert-manager
  annotations:
    path: cainjector.image.tag
  name: {{ .certManager.name }}-cainjector-image
  namespace: {{ .releaseNamespace }}
spec:
  componentRef:
    name: {{ .ocm.component.name }}
  ocmConfig:
    - apiVersion: delivery.ocm.software/v1alpha1
      kind: Repository
      name: {{ .ocm.repo.name }}
      namespace: {{ .releaseNamespace }}
    - kind: Secret
      apiVersion: v1
      # Objects that set ocmConfig do not inherit the Component's verifier,
      # so reference the signing configuration explicitly.
      name: ocm-signing-public-cert
      namespace: {{ .releaseNamespace }}
  resource:
    byReference:
      referencePath:
      {{- range .ocm.referencePath }}
        - name: {{ .name }}
      {{- end }}
        - name: {{ .certManager.name }}
      resource:
        name: cainjector-image
  additionalStatusFields:
    registry: resource.access.imageReference.toOCI().registry
    repository: resource.access.imageReference.toOCI().repository
    tag: resource.access.imageReference.toOCI().tag
    digest: resource.access.imageReference.toOCI().digest
{{- end }}
