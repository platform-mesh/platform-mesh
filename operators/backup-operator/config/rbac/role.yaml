---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - backup.platform-mesh.io
  resources:
  - backups
  - backupstorages
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - backup.platform-mesh.io
  resources:
  - backups/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  - issuers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - druid.gardener.cloud
  resources:
  - etcdopstasks
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - druid.gardener.cloud
  resources:
  - etcds
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - operator.kcp.io
  resources:
  - cacheservers
  - frontproxies
  - kubeconfigs
  - rootshards
  - shards
  verbs:
  - get
  - list
  - watch
