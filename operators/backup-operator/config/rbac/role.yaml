metadata:
  name: manager-role
rules:
- apiGroups:
  - backup.platform-mesh.io
  resources:
  - platformbackups
  - platformrestores
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - backup.platform-mesh.io
  resources:
  - platformbackups/status
  - platformrestores/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - druid.gardener.cloud
  resources:
  - etcdopstasks
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - druid.gardener.cloud
  resources:
  - etcdopstasks/status
  verbs:
  - get
- apiGroups:
  - druid.gardener.cloud
  resources:
