apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-operator-velero-installer
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - ""
    resources:
      - namespaces
      - serviceaccounts
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-operator-velero-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-operator-velero-installer
subjects:
  - kind: ServiceAccount
    name: backup-operator
    namespace: platform-mesh-backup-operator
