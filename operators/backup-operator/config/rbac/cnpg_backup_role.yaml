apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-operator-cnpg-backups
  namespace: platform-mesh-system
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - backups
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-operator-cnpg-backups
  namespace: platform-mesh-system
subjects:
  - kind: ServiceAccount
    name: backup-operator
    namespace: platform-mesh-backup-operator
roleRef:
  kind: Role
  name: backup-operator-cnpg-backups
  apiGroup: rbac.authorization.k8s.io
