apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-operator
  namespace: platform-mesh-backup-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-operator-manager-role
subjects:
  - kind: ServiceAccount
    name: backup-operator
    namespace: platform-mesh-backup-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-operator
  namespace: platform-mesh-backup-operator
  labels:
    app: backup-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backup-operator
  template:
    metadata:
      labels:
        app: backup-operator
    spec:
      serviceAccountName: backup-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: BACKUP_OPERATOR_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["/operator/manager"]
          args:
            - operator
            - --namespace=platform-mesh-backup-operator
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
