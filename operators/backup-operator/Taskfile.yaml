version: '3'

includes:
  # Shared go-installable tooling (controller-gen, golangci-lint, mockery,
  # apigen), installed once into the root bin/ and reused by every component.
  tools:
    taskfile: ../../tools/Taskfile.yaml
    dir: .

vars:
  CRD_DIRECTORY: config/crd
  RBAC_DIRECTORY: config/rbac
  # Content-addressed image tag: hash of all Go source files + Dockerfile.
  # The image is only rebuilt when operator source actually changes.
  IMAGE_REPO: ghcr.io/platform-mesh/backup-operator
  SOURCE_HASH:
    sh: find cmd pkg Dockerfile -type f | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -c1-12

tasks:
  ## Development
  manifests:
    cmds:
      - task: tools:generate-crds
        vars:
          PATH: /backup/...
          OUTPUT: '{{.CRD_DIRECTORY}}'
      - mkdir -p {{.RBAC_DIRECTORY}}
      - '{{.BIN}}/controller-gen rbac:roleName=manager-role paths=./pkg/... output:rbac:artifacts:config={{.RBAC_DIRECTORY}}'
  generate:
    cmds:
      - task: manifests
      - task: tools:generate-deepcopy
        vars:
          PATH: /backup/...
  build:
    desc: Build the backup-operator.
    cmds:
      - go build ./...
  docker-build:
    cmds:
      - docker build .

  ## Testing
  fmt:
    cmds:
      - go fmt ./...
  lint:
    cmds:
      - task: fmt
      - task: tools:lint
  test:
    deps: [tools:kcp, tools:gomplate]
    cmds:
      - go test -count=1 ./...
  test-e2e:
    deps: [tools:kcp, tools:gomplate, tools:envtest]
    cmds:
      - |
        set -ex
        export KUBEBUILDER_ASSETS=$({{.BIN}}/setup-envtest use {{.ENVTEST_K8S_VERSION}} --bin-dir {{.BIN}} -p path)
        go test -count=1 -tags integration ./... {{.ADDITIONAL_COMMAND_ARGS}}
  cover:
    cmds:
      - task: test
        vars:
          ADDITIONAL_COMMAND_ARGS: -v -coverprofile=./cover.out -covermode=atomic -coverpkg=./...
  cover-e2e:
    cmds:
      - task: test-e2e
        vars:
          ADDITIONAL_COMMAND_ARGS: -v -coverprofile=./cover.out -covermode=atomic -coverpkg=./...
  test-e2e-kind:
    desc: "Build, deploy, and run simulated e2e tests (in-process simulators, no real pods) against the running kind cluster"
    deps: [deploy:kind, deploy:etcd-druid]
    cmds:
      - |
        set -e
        NAMESPACE="${E2E_NAMESPACE:-platform-mesh-backup-operator}"
        trap "task teardown:kind E2E_NAMESPACE=$NAMESPACE" EXIT
        set -x
        KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}" \
        E2E_NAMESPACE="$NAMESPACE" \
        go test -tags e2e -count=1 -timeout 15m -v ./pkg/e2e/... {{.ADDITIONAL_COMMAND_ARGS}}

  test-e2e-kind-real:
    desc: "Real e2e tests: minio + real etcd-druid + real etcdbr (no simulators)"
    deps: [deploy:kind, deploy:etcd-druid]
    cmds:
      - |
        set -e
        NAMESPACE="${E2E_NAMESPACE:-platform-mesh-backup-operator}"
        trap "task teardown:kind E2E_NAMESPACE=$NAMESPACE" EXIT
        set -x
        KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}" \
        E2E_NAMESPACE="$NAMESPACE" \
        LIVE_SHARD_NAMESPACE="${LIVE_SHARD_NAMESPACE:-platform-mesh-system}" \
        go test -tags e2e_real -count=1 -timeout 40m -v ./pkg/e2e/real/... {{.ADDITIONAL_COMMAND_ARGS}}

  # deploy:kind builds the operator image only when operator source has changed
  # (detected via a content hash of cmd/, pkg/, and Dockerfile), loads it into
  # the kind cluster, applies all manifests, and waits for the pod to be ready.
  deploy:kind:
    desc: "Build (if changed) and deploy the backup-operator to the kind cluster"
    vars:
      CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
      KIND_CLUSTER: '{{.KIND_CLUSTER | default "platform-mesh"}}'
      E2E_NAMESPACE: '{{.E2E_NAMESPACE | default "platform-mesh-backup-operator"}}'
      IMAGE_NAME: '{{.IMAGE_REPO}}:{{.SOURCE_HASH}}'
    cmds:
      - |
        set -e
        IMAGE="{{.IMAGE_NAME}}"
        RUNTIME="{{.CONTAINER_RUNTIME}}"
        CLUSTER="{{.KIND_CLUSTER}}"
        NAMESPACE="{{.E2E_NAMESPACE}}"

        # Create the namespace if it doesn't exist yet.
        kubectl get namespace "$NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$NAMESPACE"

        # If the deployment already runs this exact image tag, skip build+load.
        CURRENT=$(kubectl get deployment backup-operator -n "$NAMESPACE" \
          -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
        REBUILT=false
        if [ "$CURRENT" = "$IMAGE" ]; then
          echo "Image $IMAGE already deployed — skipping build"
        else
          REBUILT=true
          echo "Building image $IMAGE using $RUNTIME"
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          "$RUNTIME" build --platform "linux/$ARCH" -t "$IMAGE" -f Dockerfile ../../
          if [ "$RUNTIME" = "podman" ]; then
            "$RUNTIME" save "$IMAGE" -o /tmp/kind-image.tar
            kind load image-archive /tmp/kind-image.tar --name "$CLUSTER"
            rm -f /tmp/kind-image.tar
          else
            kind load docker-image "$IMAGE" --name "$CLUSTER"
          fi
        fi

        kubectl apply -f config/crd/
        kubectl apply -f config/deploy/clusterrole.yaml
        kubectl apply -f config/deploy/role.yaml
        sed "s|BACKUP_OPERATOR_IMAGE|$IMAGE|g" config/deploy/deployment.yaml | kubectl apply -f -

        # Restart the pod only when a new image was loaded, to pick up the new binary.
        if [ "$REBUILT" = "true" ]; then
          kubectl rollout restart deployment/backup-operator -n "$NAMESPACE"
        fi

        kubectl rollout status deployment/backup-operator -n "$NAMESPACE" --timeout=3m
        echo "backup-operator ready ($IMAGE)"

  teardown:kind:
    desc: "Remove everything deploy:kind, deploy:etcd-druid, and the e2e test suites install from the kind cluster"
    vars:
      E2E_NAMESPACE: '{{.E2E_NAMESPACE | default "platform-mesh-backup-operator"}}'
    cmds:
      - |
        set -e
        NAMESPACE="{{.E2E_NAMESPACE}}"
        echo "--- tearing down backup-operator namespace and cluster-scoped resources ---"

        # Delete the namespace — cascades the operator Deployment, ServiceAccount,
        # Role/RoleBinding, minio, and all e2e test resources inside it.
        kubectl delete namespace "$NAMESPACE" --ignore-not-found --wait=true

        # Cluster-scoped resources are not namespaced and must be deleted explicitly.
        kubectl delete -f config/deploy/clusterrole.yaml --ignore-not-found
        kubectl delete clusterrolebinding backup-operator-manager-rolebinding --ignore-not-found

        # CRDs (removes all PlatformBackup/PlatformRestore objects cluster-wide)
        kubectl delete -f config/crd/ --ignore-not-found

        echo "--- teardown complete ---"
      - task: teardown:etcd-druid

  deploy:etcd-druid:
    desc: "Deploy etcd-druid to the kind cluster using the local chart (idempotent)"
    vars:
      ETCD_DRUID_SRC: '{{.ETCD_DRUID_SRC | default (printf "%s/go/src/etcd-io/etcd-druid" .HOME)}}'
      ETCD_DRUID_IMAGE: '{{.ETCD_DRUID_IMAGE | default "europe-docker.pkg.dev/gardener-project/releases/gardener/etcd-druid:v0.36.4"}}'
      KIND_CLUSTER: '{{.KIND_CLUSTER | default "platform-mesh"}}'
      CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
    cmds:
      - |
        set -e
        CHART="{{.ETCD_DRUID_SRC}}/charts"
        IMAGE="{{.ETCD_DRUID_IMAGE}}"
        RUNTIME="{{.CONTAINER_RUNTIME}}"
        CLUSTER="{{.KIND_CLUSTER}}"

        if [ ! -d "$CHART" ]; then
          echo "ERROR: etcd-druid chart not found at $CHART"
          echo "  Clone etcd-druid: git clone https://github.com/gardener/etcd-druid $HOME/go/src/etcd-io/etcd-druid"
          exit 1
        fi

        # Load the etcd-druid image into kind if not already present in containerd.
        if ! docker exec "$CLUSTER-control-plane" ctr -n k8s.io images ls 2>/dev/null | grep -q "$IMAGE"; then
          echo "Loading etcd-druid image $IMAGE into kind cluster $CLUSTER..."
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          # Pull platform-specific image, retag to strip provenance attestation
          # blobs that kind's containerd cannot import, then load.
          LOCAL_TAG="etcd-druid-kind-load:latest"
          docker pull --platform "linux/$ARCH" "$IMAGE"
          docker tag "$IMAGE" "$LOCAL_TAG"
          docker save "$LOCAL_TAG" | docker exec -i "$CLUSTER-control-plane" \
            ctr -n k8s.io images import --all-platforms=false -
          docker rmi "$LOCAL_TAG" 2>/dev/null || true
          # Re-tag inside containerd to match the original name helm expects.
          docker exec "$CLUSTER-control-plane" \
            ctr -n k8s.io images tag "$LOCAL_TAG" "$IMAGE" 2>/dev/null || true
        else
          echo "Image $IMAGE already present in kind cluster — skipping load"
        fi

        # Install or upgrade etcd-druid via helm.
        REPO=$(echo "$IMAGE" | cut -d: -f1)
        TAG=$(echo "$IMAGE" | cut -d: -f2)
        # Wait for any previously deleting CRDs to finish before helm install.
        for crd in etcds.druid.gardener.cloud etcdopstasks.druid.gardener.cloud etcdcopybackupstasks.druid.gardener.cloud; do
          kubectl wait crd/"$crd" --for=delete --timeout=60s 2>/dev/null || true
        done
        helm upgrade --install etcd-druid "$CHART" \
          --namespace etcd-druid-system \
          --create-namespace \
          --set image.repository="$REPO" \
          --set image.tag="$TAG" \
          --wait --timeout 5m
        echo "etcd-druid ready"

  teardown:etcd-druid:
    desc: "Remove etcd-druid from the kind cluster"
    cmds:
      - |
        set -e
        echo "--- tearing down etcd-druid ---"

        # Strip finalizers from all Etcd CRs so the CRDs are not blocked.
        for ns_name in $(kubectl get etcd -A --no-headers -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name' 2>/dev/null | tr -s ' ' ':'); do
          NS=$(echo "$ns_name" | cut -d: -f1)
          NAME=$(echo "$ns_name" | cut -d: -f2)
          kubectl patch etcd -n "$NS" "$NAME" --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
        done

        helm uninstall etcd-druid --namespace etcd-druid-system --ignore-not-found 2>/dev/null || true
        kubectl delete namespace etcd-druid-system --ignore-not-found --wait=true
        kubectl delete crd \
          etcds.druid.gardener.cloud \
          etcdopstasks.druid.gardener.cloud \
          etcdcopybackupstasks.druid.gardener.cloud \
          --ignore-not-found
        echo "--- etcd-druid teardown complete ---"

  docker:kind:
    desc: "Rebuild and reload the operator image into kind, then restart the deployment"
    vars:
      CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
      KIND_CLUSTER: '{{.KIND_CLUSTER | default "platform-mesh"}}'
      DEPLOYMENT_NAME: '{{.DEPLOYMENT_NAME | default "backup-operator"}}'
      DEPLOYMENT_NAMESPACE: '{{.DEPLOYMENT_NAMESPACE | default "platform-mesh-backup-operator"}}'
      IMAGE_TAG:
        sh: kubectl get deployment {{.DEPLOYMENT_NAME}} -n {{.DEPLOYMENT_NAMESPACE}} -o jsonpath='{.spec.template.spec.containers[0].image}' | cut -d':' -f2
      IMAGE_NAME: ghcr.io/platform-mesh/backup-operator:{{.IMAGE_TAG}}
    cmds:
      - echo "Building image with tag {{.IMAGE_TAG}} using {{.CONTAINER_RUNTIME}}"
      - "{{.CONTAINER_RUNTIME}} build -t {{.IMAGE_NAME}} -f Dockerfile ../../"
      - |
        if [ "{{.CONTAINER_RUNTIME}}" = "podman" ]; then
          {{.CONTAINER_RUNTIME}} save {{.IMAGE_NAME}} -o /tmp/kind-image.tar
          kind load image-archive /tmp/kind-image.tar --name {{.KIND_CLUSTER}}
          rm -f /tmp/kind-image.tar
        else
          kind load docker-image {{.IMAGE_NAME}} --name {{.KIND_CLUSTER}}
        fi
      - kubectl rollout restart deployment/{{.DEPLOYMENT_NAME}} -n {{.DEPLOYMENT_NAMESPACE}}
      - kubectl rollout status deployment/{{.DEPLOYMENT_NAME}} -n {{.DEPLOYMENT_NAMESPACE}} --timeout=3m
      - echo "Image loaded and deployment restarted"
