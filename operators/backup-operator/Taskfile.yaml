version: '3'

includes:
  tools:
    taskfile: ../../tools/Taskfile.yaml
    dir: .

vars:
  CRD_DIRECTORY: config/crd
  RBAC_DIRECTORY: config/rbac

tasks:
  ## Development
  manifests:
    cmds:
      - task: tools:generate-crds
        vars:
          PATH: /backup/...
          OUTPUT: '{{.CRD_DIRECTORY}}'
      - task: tools:generate-rbac
        vars:
          PATHS: ./...
          OUTPUT: '{{.RBAC_DIRECTORY}}'
  generate:
    cmds:
      - task: tools:generate-deepcopy
        vars:
          PATH: /backup/...
      - task: manifests
  build:
    desc: Build the backup-operator.
    cmds:
      - go build ./...
  fmt:
    cmds:
      - go fmt ./...
  lint:
    cmds:
      - task: fmt
      - task: tools:lint
  test:
    desc: Run unit tests.
    cmds:
      - go test -count=1 $(go list ./... | grep -v '/test/e2e')
  test-e2e:
    desc: Run the kind e2e tests. Needs a Platform Mesh in kind, see test/e2e/README.md.
    cmds:
      - go test -count=1 -tags e2e -timeout 90m -v ./test/e2e/... {{.CLI_ARGS}}
  test-e2e-fresh:
    desc: Backup in kind, delete the cluster, install it again and restore. Takes about one hour.
    cmds:
      - ./test/e2e/fresh.sh
  cover:
    cmds:
      - go test -count=1 $(go list ./... | grep -v '/test/e2e') -coverprofile=./cover.out -covermode=atomic

  docker:kind:
    desc: "Build the image and load it into the kind cluster"
    vars:
      KIND_CLUSTER: '{{.KIND_CLUSTER | default "platform-mesh"}}'
      IMAGE_NAME: '{{.IMAGE_NAME | default "ghcr.io/platform-mesh/platform-mesh/backup-operator:dev"}}'
    cmds:
      - docker build -t {{.IMAGE_NAME}} -f Dockerfile ../..
      - kind load docker-image {{.IMAGE_NAME}} --name {{.KIND_CLUSTER}}
