# Registry of the components built from this repository. This is the single
# source for the CI and release workflows (which components exist, where their
# sources are, which images they produce) and for the release notes.
#
# Components are not released on their own: a Platform Mesh release (tag
# vX.Y.Z, release.yml) builds every image listed here at that version and
# publishes it as the OCM component `github.com/platform-mesh/images/<name>`.
# Libraries are Go modules other projects import; they keep versions of their
# own and are tagged `<name>/vX.Y.Z` by hand, nothing is built for them.
#
# Fields:
#   path         directory of the component (module root)
#   library      true for go-gettable modules without an image
#   image        name of the primary image, pushed as
#                ghcr.io/<owner>/platform-mesh/<image>:<version>, built with
#                `task images-<name>` (repo root as build context, see the
#                root Taskfile). Omit for libraries.
#   chart        the component's Helm chart, if any (charts/<name>). Marks the
#                chart as one whose appVersion is the Platform Mesh version
#                charts not listed here wrap components from other repositories
#                or third parties.
#   optional     true if a release may leave the component out: nothing else
#                needs it, and installations enable it explicitly (a service
#                that is `enabled: false` in the profiles). A build that sets
#                SKIP_COMPONENTS=<name>[,<name>...] builds no image, chart or
#                OCM component for it, and the Platform Mesh component does
#                not reference it. Left out, it cannot be enabled from that
#                release.

components:
  # --- root module -----------------------------------------------------------
  # Tooling such as the release commands under hack/release.
  root:
    path: .

  # --- libraries -------------------------------------------------------------
  golang-commons:
    path: golang-commons
    library: true
  subroutines:
    path: subroutines
    library: true
  apis: # imports golang-commons and subroutines
    path: apis
    library: true

  # --- operators -------------------------------------------------------------
  account-operator:
    path: operators/account-operator
    image: account-operator
    chart: charts/account-operator
  extension-manager-operator:
    path: operators/extension-manager-operator
    image: extension-manager-operator
    chart: charts/extension-manager-operator
  kro-composition-operator:
    path: operators/kro-composition-operator
    image: kro-composition-operator
    chart: charts/kro-composition-operator
    optional: true # referenced by the aggregate, but no profile installs it
  platform-mesh-operator:
    path: operators/platform-mesh-operator
    image: platform-mesh-operator
    chart: charts/platform-mesh-operator
  provider-operator:
    path: operators/provider-operator
    e2e: false # scaffold only, no e2e suite yet
  resource-broker:
    path: operators/resource-broker
    image: resource-broker
    optional: true # no chart: nothing installs it
  pm-keycloak-operator:
    path: operators/pm-keycloak-operator
    image: pm-keycloak-operator
    chart: charts/pm-keycloak-operator
    e2e: false # no e2e suite; test-e2e is a no-op
  pm-openfga-operator:
    path: operators/pm-openfga-operator
    image: pm-openfga-operator
    chart: charts/pm-openfga-operator
  terminal-controller-manager:
    path: operators/terminal-controller-manager
    image: terminal-controller-manager
    chart: charts/terminal-controller-manager
    optional: true # enabled: false in the profiles

  # --- services --------------------------------------------------------------
  iam-service:
    path: services/iam-service
    image: iam-service
    chart: charts/iam-service
  kubernetes-graphql-gateway:
    path: services/kubernetes-graphql-gateway
    image: kubernetes-graphql-gateway
    chart: charts/kubernetes-graphql-gateway
  pm-openfga-authz-webhook:
    path: services/pm-openfga-authz-webhook
    image: rebac-authz-webhook
    chart: charts/rebac-authz-webhook
  virtual-workspaces:
    path: services/virtual-workspaces
    image: virtual-workspaces
    chart: charts/virtual-workspaces

  # --- tests -----------------------------------------------------------------
