# Versions of THIRD-PARTY software shipped with Platform Mesh (kcp, OpenFGA,
# Traefik, cert-manager, ...). Nothing in here is built from this repository.
#
# Platform Mesh's own components are NOT listed here and never need to be:
# their charts are versioned by charts/<name>/Chart.yaml, their images by the
# appVersion in the same file. A Platform Mesh release (tag vX.Y.Z) uses
# whatever those files say at the tagged commit.
#
# This is the single place the third-party versions are pinned. The OCM
# component constructor (ocm/component-constructor*.yaml) references them as
# ${VARIABLE}; the release workflow loads them with
# hack/release/export-versions.sh. Renovate updates the upstream versions (see
# the comments above each entry).
#
# Two kinds of entries:
#
#   *_CHART_VERSION, *_IMAGE_VERSION, ..._VERSION
#       the upstream artifact versions used as OCM resources
#
#   PM_*_VERSION
#       the version of the OCM component Platform Mesh publishes to wrap the
#       upstream artifacts (e.g. github.com/traefik/traefik:${PM_TRAEFIK_VERSION}).
#       Published component versions are immutable: whenever an upstream
#       version of a wrapper changes, its PM_* version must be bumped as well,
#       otherwise the release fails because the existing component version
#       would differ from what the constructor describes.

