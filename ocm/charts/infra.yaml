# OCM settings for charts/infra. See ocm/charts/README.md.

# Third-party images deployed by this chart. Published as the OCM component
# github.com/platform-mesh/images/infra:<chart version> so that air-gapped
# installations can mirror them. Keep in sync with the chart's values.
images:
  - name: keycloak-image
    values: .keycloak.operator.image
  - name: busybox-image
    values: .keycloak.operator.waitForDb.image
  - name: postgres-image
    values: .cnpg.cluster.image
  - name: dex-image
    values: .dex.image
  - name: etcd-wrapper-image
    values: .kcp.etcd.image
  - name: etcdbrctl-image
    values: .kcp.etcd.backup.image
