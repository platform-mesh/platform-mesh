# OCM settings for charts/gateway-api-crds. See ocm/charts/README.md.

# Historical shape, kept because component names are a contract: the service
# component github.com/platform-mesh/gateway-api-crds carries the chart
# resource directly instead of referencing a helm-charts/gateway-api-crds
# component.
flat: true
# appVersion records the bundled Gateway API release; there is no image.
image: false
