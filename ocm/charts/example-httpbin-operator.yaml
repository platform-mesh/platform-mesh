# OCM settings for charts/example-httpbin-operator. See ocm/charts/README.md.

# The image is built and released by platform-mesh/contrib-examples, which
# publishes github.com/platform-mesh/images/example-httpbin-operator itself;
# the appVersion in Chart.yaml selects the version.

# Additional components the service component references.
extraReferences:
  - name: api-syncagent
    componentName: github.com/platform-mesh/api-syncagent
    version: "${API_SYNCAGENT_COMPONENT_VERSION}"
  - name: ingress-nginx
    componentName: github.com/kubernetes/ingress-nginx
    version: "4.11.3"
