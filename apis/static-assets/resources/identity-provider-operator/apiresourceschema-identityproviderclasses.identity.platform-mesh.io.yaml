apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v261115-11cde023.identityproviderclasses.identity.platform-mesh.io
spec:
  group: identity.platform-mesh.io
  names:
    kind: IdentityProviderClass
    listKind: IdentityProviderClassList
    plural: identityproviderclasses
    singular: identityproviderclass
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      description: IdentityProviderClass defines an administrator-managed identity
        provider.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: IdentityProviderClassSpec defines how an identity provider
            is administered.
          properties:
            authenticationPolicy:
              description: authenticationPolicy contains administrator-owned authentication
                settings.
              properties:
                allowedTenantClaims:
                  description: allowedTenantClaims lists trusted claim names usable
                    as tenant constraints.
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: set
                groupClaim:
                  description: groupClaim is the optional claim used to identify groups
                    in tokens.
                  type: string
                groupPrefix:
                  description: |-
                    groupPrefix is prepended to each group claim value. Consumers must also
                    reject resulting group names in the reserved system: namespace.
                  type: string
                issuerMode:
                  description: issuerMode selects a dedicated or shared issuer.
                  enum:
                  - Dedicated
                  - Shared
                  type: string
              required:
              - issuerMode
              type: object
              x-kubernetes-validations:
              - message: 'a group claim requires a nonempty group prefix outside the
                  system: namespace'
                rule: '!has(self.groupClaim) || size(self.groupClaim) == 0 || (has(self.groupPrefix)
                  && size(self.groupPrefix) > 0 && !self.groupPrefix.startsWith(''system:''))'
              - message: 'system: group prefixes are reserved'
                rule: '!has(self.groupPrefix) || !self.groupPrefix.startsWith(''system:'')'
            configurationRef:
              description: configurationRef identifies a provider-specific configuration
                object.
              properties:
                apiGroup:
                  description: apiGroup is the API group of the referenced object.
                  maxLength: 253
                  minLength: 1
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
                kind:
                  description: kind is the kind of the referenced object.
                  minLength: 1
                  pattern: ^[A-Za-z][A-Za-z0-9]*$
                  type: string
                name:
                  description: name is the name of the referenced object.
                  maxLength: 253
                  minLength: 1
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
              required:
              - apiGroup
              - kind
              - name
              type: object
            controllerName:
              description: controllerName identifies the controller responsible for
                this class.
              maxLength: 253
              minLength: 1
              type: string
            directory:
              description: directory configures an optional provider directory endpoint.
              properties:
                tlsSecretRef:
                  description: |-
                    tlsSecretRef optionally references a Secret containing the endpoint CA.
                    Its namespace is supplied by installation configuration.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                url:
                  description: url is the endpoint URL.
                  minLength: 1
                  type: string
              required:
              - url
              type: object
            validation:
              description: validation configures an optional provider validation endpoint.
              properties:
                tlsSecretRef:
                  description: |-
                    tlsSecretRef optionally references a Secret containing the endpoint CA.
                    Its namespace is supplied by installation configuration.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                url:
                  description: url is the endpoint URL.
                  minLength: 1
                  type: string
              required:
              - url
              type: object
          required:
          - authenticationPolicy
          - configurationRef
          - controllerName
          type: object
          x-kubernetes-validations:
          - message: controllerName is immutable
            rule: self.controllerName == oldSelf.controllerName
          - message: configurationRef is immutable
            rule: self.configurationRef.apiGroup == oldSelf.configurationRef.apiGroup
              && self.configurationRef.kind == oldSelf.configurationRef.kind && self.configurationRef.name
              == oldSelf.configurationRef.name
          - message: authenticationPolicy is immutable
            rule: self.authenticationPolicy == oldSelf.authenticationPolicy
        status:
          description: IdentityProviderClassStatus reports the observed provider capabilities.
          properties:
            capabilities:
              description: capabilities lists the features supported by this provider
                class.
              items:
                description: IdentityCapability describes a capability supported by
                  an identity provider.
                type: string
              type: array
              x-kubernetes-list-type: set
            conditions:
              description: conditions represent the current state of the provider
                class.
              items:
                description: Condition contains details for one aspect of the current
                  state of this API Resource.
                properties:
                  lastTransitionTime:
                    description: |-
                      lastTransitionTime is the last time the condition transitioned from one status to another.
                      This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                    format: date-time
                    type: string
                  message:
                    description: |-
                      message is a human readable message indicating details about the transition.
                      This may be an empty string.
                    maxLength: 32768
                    type: string
                  observedGeneration:
                    description: |-
                      observedGeneration represents the .metadata.generation that the condition was set based upon.
                      For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                      with respect to the current state of the instance.
                    format: int64
                    minimum: 0
                    type: integer
                  reason:
                    description: |-
                      reason contains a programmatic identifier indicating the reason for the condition's last transition.
                      Producers of specific condition types may define expected values and meanings for this field,
                      and whether the values are considered a guaranteed API.
                      The value should be a CamelCase string.
                      This field may not be empty.
                    maxLength: 1024
                    minLength: 1
                    pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                    type: string
                  status:
                    description: status of the condition, one of True, False, Unknown.
                    enum:
                    - "True"
                    - "False"
                    - Unknown
                    type: string
                  type:
                    description: type of condition in CamelCase or in foo.example.com/CamelCase.
                    maxLength: 316
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                    type: string
                required:
                - lastTransitionTime
                - message
                - reason
                - status
                - type
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - type
              x-kubernetes-list-type: map
            contractVersion:
              description: contractVersion is the provider's identity API contract
                version.
              type: string
            observedConfigurationRevision:
              description: observedConfigurationRevision identifies the applied provider
                configuration.
              type: string
            observedGeneration:
              description: observedGeneration is the last spec generation processed
                by the controller.
              format: int64
              type: integer
          type: object
      required:
      - spec
      type: object
    served: true
    storage: true
    subresources:
      status: {}
