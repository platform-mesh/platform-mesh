{{- if not .featureDisableOpenFGA }}
apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: openfga.platform-mesh.io
spec:
  resources:
  - group: openfga.platform-mesh.io
    name: apiexportpolicies
    schema: v261110-63340683.apiexportpolicies.openfga.platform-mesh.io
    storage:
      crd: {}
  - group: openfga.platform-mesh.io
    name: stores
    schema: v261110-6b64808e.stores.openfga.platform-mesh.io
    storage:
      crd: {}
  # The APIExportPolicy reconciler reads the bound APIExports and their
  # bindings across workspaces.
  permissionClaims:
    - group: tenancy.kcp.io
      identityHash: {{ .apiExportRootTenancyKcpIoIdentityHash }}
      resource: workspaces
      verbs:
      - '*'
    - group: tenancy.kcp.io
      identityHash: {{ .apiExportRootTenancyKcpIoIdentityHash }}
      resource: workspacetypes
      verbs:
      - '*'
    - resource: apibindings
      group: apis.kcp.io
      identityHash: ""
      verbs:
      - '*'
    - resource: apiexports
      group: apis.kcp.io
      identityHash: ""
      verbs:
      - '*'
    - resource: apiresourceschemas
      group: apis.kcp.io
      identityHash: ""
      verbs:
      - '*'
    - resource: logicalclusters
      group: core.kcp.io
      identityHash: ""
      verbs:
      - '*'
status: {}
{{- end }}
