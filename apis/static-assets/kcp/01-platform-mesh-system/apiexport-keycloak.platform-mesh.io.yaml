apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: keycloak.platform-mesh.io
spec:
  resources:
  - group: keycloak.platform-mesh.io
    name: identityproviderconfigurations
    schema: v261110-12b5dfe4.identityproviderconfigurations.keycloak.platform-mesh.io
    storage:
      crd: {}
  - group: keycloak.platform-mesh.io
    name: invites
    schema: v261110-786b8a52.invites.keycloak.platform-mesh.io
    storage:
      crd: {}
  permissionClaims:
    - group: tenancy.kcp.io
      identityHash: {{ .apiExportRootTenancyKcpIoIdentityHash }}
      resource: workspaces
      verbs:
      - '*'
    - group: tenancy.kcp.io
      identityHash: {{ .apiExportRootTenancyKcpIoIdentityHash }}
      resource: workspacetypes
      verbs:
      - '*'
    - resource: logicalclusters
      group: core.kcp.io
      identityHash: ""
      verbs:
      - '*'
    # OIDC client secrets the IdentityProviderConfiguration reconciler writes.
    - resource: secrets
      group: ""
      identityHash: ""
      verbs:
      - get
      - create
      - update
      - delete
      defaultSelector:
        matchExpressions:
          - key: keycloak.platform-mesh.io/idp-name
            operator: Exists
          - key: keycloak.platform-mesh.io/client-name
            operator: Exists
status: {}
